                card.innerHTML = `
                    <div class="qa-card-header" onclick="toggleCardReveal(${q.global_id})">
                        <div class="qa-title-section">
                            <div class="qa-meta">
                                <span class="qa-global-id">Câu ${q.global_id}</span>
                                <span class="qa-priority ${badgeClass}">${q.priority}</span>
                            </div>
                            <h3 class="qa-title">${highlightedTitle}</h3>
                        </div>
                        <div class="qa-status-controls" onclick="event.stopPropagation()">
                            <span class="qa-status-badge status-${status}" id="status-badge-${q.global_id}"></span>
                            <select class="qa-status-select" onchange="changeQuestionStatus(${q.global_id}, this.value)">
                                <option value="unlearned" ${status === 'unlearned' ? 'selected' : ''}>Chưa thuộc</option>
                                <option value="learning" ${status === 'learning' ? 'selected' : ''}>Đang học</option>
                                <option value="learned" ${status === 'learned' ? 'selected' : ''}>Đã thuộc</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="study-placeholder">
                        <button class="btn-reveal-answer" onclick="revealSingleAnswer(${q.global_id})">Xem câu trả lời</button>
                    </div>
                    
                    <div class="qa-card-body">
                        <div class="markdown-body tex2jax_process">
                            ${highlightedHtml}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Toggle card reveal in study mode
        function toggleCardReveal(globalId) {
            if (isStudyMode) {
                const card = document.getElementById(`qa-card-${globalId}`);
                card.classList.toggle('study-hidden');
            }
        }

        // Reveal single answer in study mode
        function revealSingleAnswer(globalId) {
            const card = document.getElementById(`qa-card-${globalId}`);
            card.classList.remove('study-hidden');
        }

        // Handle dropdown status change
        window.changeQuestionStatus = function(globalId, value) {
            saveProgress(globalId, value);
            const badge = document.getElementById(`status-badge-${globalId}`);
            if (badge) {
                badge.className = `qa-status-badge status-${value}`;
            }
        };

        // Render Flashcard View
        function renderFlashcardView(questions, container) {
            if (questions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Không có câu hỏi ôn tập</h3>
                        <p>Không có câu hỏi nào khớp với độ ưu tiên đã lọc.</p>
                    </div>
                `;
                return;
            }
            
            if (currentFlashcardIndex >= questions.length) {
                currentFlashcardIndex = 0;
            }
            
            const q = questions[currentFlashcardIndex];
            const status = progress[q.global_id] || 'unlearned';
            
            let badgeClass = 'priority-yellow';
            if (q.priority === 'ĐỎ') badgeClass = 'priority-red';
            else if (q.priority === 'BẪY') badgeClass = 'priority-orange';
            
            const cardHtml = marked.parse(q.content);
            
            const viewContainer = document.createElement('div');
            viewContainer.className = 'flashcard-mode-container';
            
            viewContainer.innerHTML = `
                <div class="flashcard-progress-indicator">
                    Câu ${currentFlashcardIndex + 1} / ${questions.length} (Độ ưu tiên: ${activePriorityFilter})
                </div>
                
                <div class="flashcard-scene" onclick="flipFlashcard()">
                    <div class="flashcard ${isCardFlipped ? 'is-flipped' : ''}" id="flashcard-obj">
                        <!-- Front Face -->
                        <div class="flashcard-face flashcard-front">
                            <div class="flashcard-front-content">
                                <div class="qa-meta">
                                    <span class="qa-global-id">Câu ${q.global_id}</span>
                                    <span class="qa-priority ${badgeClass}">${q.priority}</span>
                                </div>
                                <h2 class="flashcard-question-title">${q.title}</h2>
                                <div class="flashcard-instruction">Click vào thẻ hoặc nhấn nút bên dưới để xem trả lời</div>
                            </div>
                        </div>
                        <!-- Back Face -->
                        <div class="flashcard-face flashcard-back text2jax_process">
                            <div class="markdown-body">
                                ${cardHtml}
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="flashcard-controls">
                    <button class="btn-fc btn-fc-review" onclick="event.stopPropagation(); prevFlashcard(${questions.length})">Câu trước</button>
                    <button class="btn-fc btn-fc-flip" onclick="event.stopPropagation(); flipFlashcard()">Lật thẻ</button>
                    
                    <button class="btn-fc btn-fc-learned" onclick="event.stopPropagation(); markFlashcardLearned(${q.global_id}, ${questions.length})">Đã thuộc ✓</button>
                    <button class="btn-fc btn-fc-review" onclick="event.stopPropagation(); markFlashcardReview(${q.global_id}, ${questions.length})">Cần ôn lại ⏳</button>
                    
                    <button class="btn-fc btn-fc-flip" onclick="event.stopPropagation(); nextFlashcard(${questions.length})">Câu tiếp</button>
                </div>
            `;
            container.appendChild(viewContainer);
        }

        // Flashcard Interactions
        window.flipFlashcard = function() {
            isCardFlipped = !isCardFlipped;
            const fc = document.getElementById('flashcard-obj');
            if (fc) {
                fc.classList.toggle('is-flipped', isCardFlipped);
            }
        };
        
        window.prevFlashcard = function(total) {
            if (total <= 1) return;
            currentFlashcardIndex = (currentFlashcardIndex - 1 + total) % total;
            isCardFlipped = false;
            renderActiveView();
        };

        window.nextFlashcard = function(total) {
            if (total <= 1) return;
            currentFlashcardIndex = (currentFlashcardIndex + 1) % total;
            isCardFlipped = false;
            renderActiveView();
        };

        window.markFlashcardLearned = function(globalId, total) {
            saveProgress(globalId, 'learned');
            nextFlashcard(total);
        };

        window.markFlashcardReview = function(globalId, total) {
            saveProgress(globalId, 'learning');
            nextFlashcard(total);
        };

        // Render Extra/Supplementary Materials
        function renderExtraView(container) {
            const group = data.find(g => g.group_id === currentGroupId);
            if (!group.extras || group.extras.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Không có tài liệu phụ lục</h3>
                        <p>Nhóm này không chứa tài liệu phụ lục đi kèm.</p>
                    </div>
                `;
                return;
            }
            
            const extrasContainer = document.createElement('div');
            extrasContainer.className = 'extras-container';
            
            group.extras.forEach(sect => {
                const card = document.createElement('div');
                card.className = 'extra-card';
                
                const extraHtml = marked.parse(sect.content);
                
                card.innerHTML = `
                    <h3 class="extra-card-title">${sect.title}</h3>
                    <div class="markdown-body tex2jax_process">
                        ${extraHtml}
                    </div>
                `;
                extrasContainer.appendChild(card);
            });
            container.appendChild(extrasContainer);
        }

        // Initialize App
        function initApp() {
            renderSidebar();
            updateOverallProgress();
            loadGroup(1);
            
            // Search Input listener
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                if (searchQuery.length > 0) {
                    currentView = 'list';
                    document.getElementById('view-tab-list').classList.add('active');
                    document.getElementById('view-tab-flashcard').classList.remove('active');
                    document.getElementById('view-tab-extra').classList.remove('active');
                    document.getElementById('active-group-subtitle').textContent = "Tìm kiếm";
                    document.getElementById('active-group-title').textContent = `Kết quả cho: "${searchQuery}"`;
                } else {
                    const group = data.find(g => g.group_id === currentGroupId);
                    document.getElementById('active-group-subtitle').textContent = `Nhóm ${currentGroupId}`;
                    document.getElementById('active-group-title').textContent = group.title;
                }
                renderActiveView();
            });
        }

        // Bulletproof initialization that runs immediately if DOM is already parsed
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
