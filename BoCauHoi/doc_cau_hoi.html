y không;\n- khó so sánh với paper khác.\n\n## 6.4. Hỗ trợ error analysis\n\nNếu cùng loại lỗi xuất hiện ở cả ba tập:\n\n- khả năng cao là hạn chế mô hình.\n\nNếu lỗi chỉ tăng ở một năm:\n\n- có thể là distribution shift.\n\n## 6.5. Nhiều test set vẫn chưa đủ nếu protocol không sạch\n\nCần thêm:\n\n- validation nội bộ;\n- test untouched;\n- nhiều seed;\n- confidence interval;\n- cùng decoding;\n- cùng preprocessing.\n\n## 6.6. Không nên nói\n\n- “Ba test set đảm bảo tổng quát ngoài đời.”\n- “Chỉ cần lấy trung bình là đủ.”\n- “Ba năm là ba lần train độc lập” nếu cùng checkpoint.\n- “Có nhiều test nên không cần validation.”\n\n---"}, {"global_id": 23, "local_id": 7, "priority": "ĐỎ", "title": "Có nguy cơ trùng người viết, trùng biểu thức hoặc rò rỉ dữ liệu giữa train và test không?", "content": "## 7.1. Bản trả lời nhanh 60–90 giây\n\n> **Có bốn loại nguy cơ cần tách. Một là CROHME 2014 được dùng chọn checkpoint rồi báo cáo lại, đây là model-selection contamination. Hai là trùng filename hoặc trùng ảnh giữa train và test, đây là leakage nghiêm trọng và cần kiểm tra bằng hash. Ba là cùng chuỗi LaTeX có thể xuất hiện ở train và test; điều này chưa chắc là leakage nếu ảnh do người viết khác tạo ra, nhưng phải báo cáo. Bốn là trùng người viết, cần writer metadata mới kết luận được.**\n>\n> **Repo chưa có audit chính thức, nên em không được nói “không trùng” chỉ vì các thư mục khác nhau. Em phải kiểm tra filename, SHA-256 ảnh, normalized LaTeX và writer ID nếu có.**\n\n## 7.2. Bốn loại overlap\n\n### A. Filename overlap\n\n$$ F_{\\text{train}} \\cap F_{\\text{test}} $$\n\nNếu khác rỗng, cần điều tra.\n\n### B. Image hash overlap\n\nTạo hash:\n\n$$ H(I)=\\operatorname{SHA256} (\\text{dtype},\\text{shape},I.\\text{bytes}) $$\n\nHash giống nhau giữa train và test là dấu hiệu duplicate image.\n\n### C. Exact normalized LaTeX overlap\n\n$$ Y_{\\text{train}} \\cap Y_{\\text{test}} $$\n\nCùng LaTeX có thể hợp lệ nếu:\n\n- khác ảnh;\n- khác người viết;\n- cùng công thức toán học.\n\nTuy nhiên cần báo cáo:\n\n- tỷ lệ test label đã thấy trong train;\n- tỷ lệ label mới;\n- accuracy trên seen-label và unseen-label.\n\n### D. Writer overlap\n\nĐây là style overlap. Muốn kiểm tra cần:\n\n- writer ID;\n- InkML metadata;\n- mapping chính thức.\n\nKhông nên suy writer ID chỉ từ filename nếu chưa biết quy ước tên.\n\n## 7.3. Model-selection contamination\n\nDo:\n\n```yaml\ntest_folder: 2014\nmonitor: val_ExpRate\n```\n\nnên 2014 ảnh hưởng:\n\n- checkpoint;\n- epoch;\n- có thể cả quyết định kiến trúc.\n\nNếu sau khi xem 2016/2019 ta tiếp tục thay model, hai tập đó cũng có thể trở thành development set ở cấp độ nghiên cứu.\n\n## 7.4. Trùng LaTeX không nhất thiết là leakage\n\nVí dụ cùng ground truth:\n\n```latex\nx + 1\n```\n\nnhưng hai ảnh do hai người viết khác nhau.\n\nHMER cần nhận dạng nhiều phong cách cho cùng ngôn ngữ toán học. Vì vậy cần phân biệt:\n\n- duplicate image;\n- duplicate label.\n\n## 7.5. Audit nên chạy\n\n```text\nAudit 1: duplicate filenames\nAudit 2: duplicate image hashes\nAudit 3: exact normalized LaTeX overlap\nAudit 4: token n-gram overlap\nAudit 5: writer overlap nếu có metadata\nAudit 6: validation/test role\n```\n\n## 7.6. Nếu phát hiện duplicate image\n\n- loại khỏi train hoặc test theo protocol;\n- tạo lại split;\n- retrain;\n- báo cáo lại;\n- lưu audit artifact.\n\n## 7.7. Khi chưa có writer metadata\n\n> **Em chưa có bằng chứng đủ để khẳng định writer-disjoint. Từ gói hiện tại em có thể audit image hash và label overlap; writer overlap cần metadata từ nguồn CROHME.**\n\n## 7.8. Không nên nói\n\n- “Khác folder là chắc chắn không trùng.”\n- “Cùng LaTeX nghĩa là leakage.”\n- “Không backpropagate trên test nên không có contamination.”\n- “Tên file chắc chắn là writer ID.”\n- “Benchmark công khai thì không cần audit.”\n\n---"}, {"global_id": 24, "local_id": 8, "priority": "ĐỎ", "title": "Từ điển token có bao nhiêu phần tử và được xây dựng từ tập nào?", "content": "## 8.1. Bản trả lời nhanh 45–60 giây\n\n> **Cấu hình model dùng `vocab_size: 113`, gồm 110 token trong `dictionary.txt` cộng ba token đặc biệt `<pad>`, `<sos>` và `<eos>`. `CROHMEVocab.init()` đọc từng dòng của `data/crohme/dictionary.txt` rồi gán chỉ số.**\n>\n> **Tuy nhiên repo không kèm script tạo dictionary, nên từ code hiện tại em chưa chứng minh được nó được xây chỉ từ train hay từ toàn benchmark. Đây là điểm phải audit. Ngoài ra code không có `<unk>`; token ngoài từ điển gây lỗi tra cứu thay vì được ánh xạ sang unknown.**\n\n## 8.2. Ba token đặc biệt\n\n| Token | Index | Vai trò |\n|---|---:|---|\n| `<pad>` | 0 | Padding chuỗi |\n| `<sos>` | 1 | Bắt đầu chuỗi |\n| `<eos>` | 2 | Kết thúc chuỗi |\n\nTổng vocabulary:\n\n$$ 110 + 3 = 113 $$\n\n## 8.3. Vocabulary không hoàn toàn bằng số lớp ký hiệu vật lý\n\nDictionary decoder có thể gồm:\n\n- chữ số;\n- chữ cái;\n- Greek;\n- toán tử;\n- macro `\\frac`, `\\sqrt`;\n- `{`, `}`;\n- `^`, `_`;\n- token điều khiển khác.\n\nDo đó cần phân biệt:\n\n- symbol classes;\n- LaTeX decoder tokens.\n\n## 8.4. Nguồn dictionary chưa được chứng minh\n\nCode chỉ cho biết:\n\n```python\nvocab.init(root / \"dictionary.txt\")\n```\n\nNó không chứng minh dictionary được tạo bằng:\n\n```text\nunique_tokens(train_only)\n```\n\nhay:\n\n```text\nunique_tokens(train + tests)\n```\n\nCần audit:\n\n```python\ntrain_tokens = set(...)\ntest_tokens = set(...)\ndictionary_tokens = set(...)\n```\n\n## 8.5. Rủi ro vocabulary leakage\n\nNếu dictionary được xây từ test:\n\n- model biết trước token universe;\n- nhưng không biết chuỗi hoặc tần suất cụ thể;\n- mức leakage nhẹ hơn dùng nhãn test để train;\n- vẫn phải khai báo protocol.\n\nNếu benchmark có vocabulary cố định chính thức, việc dùng vocabulary chung có thể hợp lệ, nhưng phải dẫn đúng protocol.\n\n## 8.6. Không có `<unk>`\n\n`words2indices()` tra trực tiếp:\n\n```python\nself.word2idx[word]\n```\n\nNếu token không tồn tại sẽ gây `KeyError`.\n\nHệ quả:\n\n- caption train/test phải nằm hoàn toàn trong dictionary;\n- model không thể sinh token mới ngoài 113 class.\n\n## 8.7. Câu hỏi phụ: “Vì sao 113 không bằng số symbol class?”\n\n> **Vì vocabulary của decoder gồm cả token cấu trúc và ba token đặc biệt; nó không nhất thiết bằng số loại ký hiệu được nhìn thấy trên ảnh.**\n\n## 8.8. Không nên nói\n\n- “Có 113 symbol classes” nếu chưa phân loại.\n- “Dictionary chắc chắn được xây từ train.”\n- “Có `<unk>`.”\n- “Model sinh được ký hiệu mới ngoài vocabulary.”\n- “Token hiếm bị loại tự động.”\n\n---"}, {"global_id": 25, "local_id": 9, "priority": "VÀNG", "title": "Phân bố độ dài chuỗi LaTeX trong train, validation và từng test set ra sao?", "content": "## 9.1. Bản trả lời nhanh trung thực\n\n> **Repo hiện chưa có bảng phân bố độ dài được lưu, nên em chưa được phép đọc một số trung bình từ trí nhớ. Mỗi nhãn đã được token hóa bằng khoảng trắng trong `caption.txt`; độ dài là số token sau image ID. Code loại mẫu train dài hơn 200 token, còn decoder giới hạn `max_len: 150`.**\n>\n> **Em cần báo cáo count, mean, median, standard deviation, P90, P95, max và tỷ lệ mẫu dài hơn 50, 100, 150 token cho train, 2014, 2016 và 2019. Đặc biệt phải đếm test label dài hơn 150 vì model có nguy cơ không thể sinh hết chuỗi.**\n\n## 9.2. Điều biết chắc từ code\n\nTraining filter:\n\n```python\nif is_train and len(label_tokens) > 200:\n    ignore\n```\n\nInference:\n\n```yaml\nmax_len: 150\n```\n\nCó mismatch:\n\n$$ L_{\\text{train max accepted}}=200 $$\n\nnhưng:\n\n$$ L_{\\text{decode max}}=150 $$\n\nNếu ground truth dài hơn 150 token, decoder có thể bị cắt trước khi hoàn tất.\n\n## 9.3. Bảng bắt buộc\n\n| Tập | N | Mean | Median | Std | P90 | P95 | Max | >50 | >100 | >150 | >200 |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n| Train raw |  |  |  |  |  |  |  |  |  |  |  |\n| Train effective |  |  |  |  |  |  |  |  |  |  |  |\n| 2014 | 986 |  |  |  |  |  |  |  |  |  |  |\n| 2016 | 1.147 |  |  |  |  |  |  |  |  |  |  |\n| 2019 | 1.199 |  |  |  |  |  |  |  |  |  |  |\n\n## 9.4. Vì sao mean chưa đủ?\n\nHai tập có thể cùng mean nhưng tail khác nhau.\n\nMẫu dài thường:\n\n- nhiều cấu trúc lồng;\n- nhiều ngoặc;\n- tăng exposure bias;\n- khó Exact Match;\n- tốn bộ nhớ hơn.\n\nCần histogram và percentile.\n\n## 9.5. Accuracy theo độ dài\n\nChia bin:\n\n```text\n1–10\n11–20\n21–30\n31–50\n51–75\n76–100\n>100\n```\n\nTính:\n\n$$ \\operatorname{ExpRate}_b = \\frac{\\#\\text{mẫu đúng trong bin }b} {\\#\\text{mẫu trong bin }b} $$\n\n## 9.6. Câu trả lời trước khi có số liệu\n\n> **Em có thể nói rõ giới hạn code nhưng chưa khẳng định phân bố cụ thể. Bảng độ dài là một artifact bắt buộc trước khi chốt luận văn.**\n\n## 9.7. Không nên nói\n\n- “Chuỗi trung bình khoảng 20 token” nếu chưa đo.\n- “Không có mẫu dài hơn 150.”\n- “Max train là 150.”\n- “Ba test set có độ dài giống nhau.”\n- “Biểu thức dài chắc chắn là nguyên nhân chính.”\n\n---"}, {"global_id": 26, "local_id": 10, "priority": "VÀNG", "title": "Những loại cấu trúc nào xuất hiện nhiều và những loại nào hiếm trong tập huấn luyện?", "content": "## 10.1. Bản trả lời nhanh trung thực\n\n> **Repo chưa có bảng tần suất cấu trúc train, nên em chưa thể nói loại nào nhiều hoặc hiếm bằng cảm giác. Có thể thống kê proxy từ token như `\\frac`, `\\sqrt`, `^`, `_`, `\\int`, `\\sum`, `\\lim`, nhưng token count chưa phản ánh đầy đủ cấu trúc lồng hoặc quan hệ ngữ cảnh.**\n>\n> **Em cần báo cáo số expression chứa từng cấu trúc, tổng số lần xuất hiện và accuracy riêng trên từng nhóm. Chỉ sau đó mới được gọi một cấu trúc là frequent hoặc long-tail.**\n\n## 10.2. Danh mục nên thống kê\n\n### Cấu trúc cơ bản\n\n- số và biến;\n- cộng, trừ, nhân, chia;\n- dấu bằng, bất đẳng thức;\n- ngoặc.\n\n### Cấu trúc 2D\n\n- superscript `^`;\n- subscript `_`;\n- fraction `\\frac`;\n- root `\\sqrt`;\n- integral `\\int`;\n- summation `\\sum`;\n- limit `\\lim`;\n- product `\\prod`;\n- matrix/environment nếu có.\n\n### Cấu trúc kết hợp\n\n- fraction nested;\n- root nested;\n- fraction trong root;\n- exponent trong fraction;\n- integral có cả hai cận;\n- sum có cả hai cận;\n- nhiều chỉ số liên tiếp.\n\n## 10.3. Ba loại count\n\n### Số expression chứa cấu trúc\n\n$$ N_c = \\sum_i \\mathbf{1}[c \\in Y_i] $$\n\n### Tổng số occurrence\n\n$$ O_c = \\sum_i \\operatorname{count}(c,Y_i) $$\n\n### Độ phức tạp có điều kiện\n\nVí dụ:\n\n- fraction lồng;\n- root lồng;\n- số cấu trúc con tối đa.\n\nKhông được dùng occurrence count thay cho expression count.\n\n## 10.4. Hạn chế của token proxy\n\n`_` có thể là:\n\n- subscript;\n- cận dưới tích phân;\n- cận dưới tổng.\n\n`^` có thể là:\n\n- số mũ;\n- cận trên.\n\nVì vậy cần parser theo ngữ cảnh.\n\n## 10.5. Định nghĩa long-tail\n\nCó thể đặt ngưỡng trước:\n\n- frequent: trên 10% expression;\n- medium: 1–10%;\n- rare: 0,1–1%;\n- very rare: dưới 0,1%.\n\nNgưỡng phải được ghi trước khi nhìn kết quả.\n\n## 10.6. Bảng cần tạo\n\n| Cấu trúc | Train expressions | Tỷ lệ train | 2014 | 2016 | 2019 | ExpRate M1 | ExpRate M4 |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| `\\frac` |  |  |  |  |  |  |  |\n| `\\sqrt` |  |  |  |  |  |  |  |\n| Superscript |  |  |  |  |  |  |  |\n| Subscript |  |  |  |  |  |  |  |\n| `\\int` |  |  |  |  |  |  |  |\n| `\\sum` |  |  |  |  |  |  |  |\n| `\\lim` |  |  |  |  |  |  |  |\n\n## 10.7. Không nên nói\n\n- “Dataset có nhiều phân số.”\n- “Tích phân có cận rất ít.”\n- “Căn là khó nhất.”\n- “M4 tốt hơn ở cấu trúc phức tạp.”\n\nMọi câu cần số liệu.\n\n---"}, {"global_id": 27, "local_id": 11, "priority": "VÀNG", "title": "Dataset có bao nhiêu mẫu chứa tích phân, tích phân có cận dưới, cận trên và có cả hai cận?", "content": "## 11.1. Bản trả lời nhanh trung thực\n\n> **Repo chưa có thống kê này, nên câu trả lời đúng hiện tại là em chưa được phép kết luận “dataset không có”. Em phải đếm trực tiếp trong từng `caption.txt`: số expression chứa `\\int`, không cận, chỉ cận dưới, chỉ cận trên, có cả hai cận và có nhiều tích phân.**\n>\n> **Việc đếm phải dựa vào `_` và `^` gắn ngay sau token `\\int`, không được tìm `^` ở bất kỳ vị trí nào trong chuỗi vì đó có thể là số mũ của biến. Sau đó em cần tính accuracy riêng cho subset tích phân trên 2014, 2016 và 2019.**\n\n## 11.2. Các nhóm cần tách\n\n| Nhóm | Điều kiện |\n|---|---|\n| Integral total | Có token `\\int` |\n| No bounds | Không có `_` hoặc `^` gắn ngay sau `\\int` |\n| Lower only | Có `_` nhưng không có `^` gắn với `\\int` |\n| Upper only | Có `^` nhưng không có `_` gắn với `\\int` |\n| Both bounds | Có cả `_` và `^` gắn với `\\int` |\n| Multiple integrals | Có từ hai `\\int` trở lên |\n\n## 11.3. Không được đếm ngây thơ\n\nVí dụ:\n\n```latex\n\\int x ^ { 2 } d x\n```\n\nCó `^` trong chuỗi, nhưng đó là số mũ của $x$, không phải cận trên của tích phân.\n\nSai:\n\n```python\ncontains_int and contains_caret\n```\n\nĐúng:\n\n- bắt đầu tại token `\\int`;\n- chỉ đọc các modifier `_` và `^` ngay sau đó;\n- skip group `{...}`;\n- dừng khi gặp phần thân tích phân.\n\n## 11.4. Parser cần hỗ trợ hai thứ tự\n\n```latex\n\\int _ { 0 } ^ { 1 }\n```\n\nvà:\n\n```latex\n\\int ^ { 1 } _ { 0 }\n```\n\n## 11.5. Bảng bắt buộc\n\n| Tập | Tổng mẫu | Có `\\int` | Không cận | Chỉ dưới | Chỉ trên | Cả hai | Nhiều tích phân |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| Train raw | 8.836 |  |  |  |  |  |  |\n| Train effective |  |  |  |  |  |  |  |\n| 2014 | 986 |  |  |  |  |  |  |\n| 2016 | 1.147 |  |  |  |  |  |  |\n| 2019 | 1.199 |  |  |  |  |  |  |\n\n## 11.6. Accuracy riêng cho subset\n\n$$ \\operatorname{ExpRate}_{\\text{int,both}} = \\frac{\\#\\text{tích phân hai cận dự đoán đúng}} {\\#\\text{tích phân hai cận}} $$\n\nNên bổ sung:\n\n- recall `\\int`;\n- recall `_`;\n- recall `^`;\n- Mean Edit Distance subset;\n- lỗi ngoặc;\n- lỗi truncate.\n\n## 11.7. Câu trả lời demo đúng\n\n> **Em chưa quy lỗi demo cho việc dataset không có. Em cần kiểm tra tần suất cấu trúc, độ rõ của cận sau resize, domain gap và token nào bị mất trong output.**\n\n## 11.8. Không nên nói\n\n- “Dataset không có tích phân có cận.”\n- “Có `^` trong chuỗi nghĩa là tích phân có cận trên.”\n- “Nhận đúng `\\int` là nhận đúng toàn bộ tích phân.”\n- “Cả hai cận rất hiếm” khi chưa đếm.\n\n---"}, {"global_id": 28, "local_id": 12, "priority": "VÀNG", "title": "Các token hiếm hoặc ngoài từ điển được xử lý như thế nào?", "content": "## 12.1. Bản trả lời nhanh 45–60 giây\n\n> **Code hiện không có `<unk>`. `words2indices()` tra trực tiếp từng token trong dictionary; token ngoài từ điển gây `KeyError`. Vì vậy train, validation và test phải được chuẩn hóa sao cho toàn bộ token nằm trong dictionary.**\n>\n> **Token hiếm nhưng có trong dictionary vẫn được học bằng cross-entropy bình thường. Repo chưa có class weighting, focal loss hoặc oversampling theo token, nên token hiếm có thể nhận ít tín hiệu huấn luyện hơn và cần được thống kê riêng.**\n\n## 12.2. OOV trong train/test\n\nCode tương đương:\n\n```python\nindices = [word2idx[token] for token in tokens]\n```\n\nKhông có:\n\n```python\nword2idx.get(token, unk_idx)\n```\n\nDo đó:\n\n- OOV gây lỗi;\n- dictionary coverage phải đạt 100%.\n\n## 12.3. OOV ở inference\n\nInput là ảnh, nên không có OOV input token.\n\nNhưng decoder chỉ có:\n\n$$ P(y_t \\mid \\cdot),\\quad y_t \\in V $$\n\nNếu ảnh chứa ký hiệu ngoài $V$:\n\n- model buộc chọn token gần nhất;\n- bỏ token;\n- hoặc sinh chuỗi sai;\n- không thể tạo class mới.\n\n## 12.4. Token hiếm\n\nCross-entropy tiêu chuẩn:\n\n$$ \\mathcal{L} = -\\sum_t \\log P(y_t) $$\n\nkhông tự cân bằng theo tần suất token.\n\nToken hiếm có thể:\n\n- recall thấp;\n- dễ nhầm với token phổ biến;\n- làm ExpRate giảm mạnh ở nhóm long-tail.\n\n## 12.5. Audit token\n\nVới token $v$:\n\n$$ f_{\\text{train}}(v) = \\sum_i \\operatorname{count}(v,Y_i) $$\n\nCần báo cáo:\n\n- 20 token phổ biến nhất;\n- 20 token hiếm nhất;\n- token có dưới 5, 10, 20 occurrence;\n- token có trong test nhưng không train;\n- token có test/train ratio bất thường.\n\n## 12.6. Hướng xử lý có thể thử\n\n- synthetic augmentation;\n- oversampling expression chứa token hiếm;\n- weighted loss;\n- curriculum;\n- external data hợp lệ;\n- constrained decoding.\n\nKhông được nói đã dùng nếu repo chưa có.\n\n## 12.7. Không nên nói\n\n- “Token hiếm đã bị loại.”\n- “Có `<unk>`.”\n- “Vocabulary bao phủ mọi toán học.”\n- “Cross-entropy tự cân bằng token.”\n- “Model có thể tự thêm token mới.”\n\n---"}, {"global_id": 29, "local_id": 13, "priority": "BẪY", "title": "Có thể kết luận một test set khó hơn test set khác chỉ từ ExpRate thấp hơn hay không? Vì sao?", "content": "## 13.1. Bản trả lời nhanh 45–60 giây\n\n> **Không. ExpRate thấp hơn chỉ cho biết một model cụ thể đạt kết quả thấp hơn trên tập đó. Nó chưa chứng minh bản thân dataset khó hơn, vì score còn phụ thuộc model, checkpoint, decoding, mức phù hợp với train, độ dài, cấu trúc, token hiếm, writer style và sai số thống kê.**\n>\n> **Muốn gọi một tập khó hơn, cần nhiều model cùng suy giảm nhất quán và có phân tích dữ liệu: độ dài, cấu trúc, rare token, kích thước ảnh, matched subsets và confidence interval.**\n\n## 13.2. ExpRate là hàm của cả model và dataset\n\n$$ \\operatorname{ExpRate} = f(\\text{model},\\text{checkpoint},\\text{decoding},\\text{dataset}) $$\n\nNó không phải thuộc tính chỉ của dataset.\n\n## 13.3. Các nguyên nhân làm score khác nhau\n\n- sequence length;\n- nesting depth;\n- token rarity;\n- writer style;\n- image scale;\n- aspect ratio;\n- label normalization;\n- vocabulary coverage;\n- beam-search behavior;\n- checkpoint selection;\n- random seed.\n\n## 13.4. Điều kiện mạnh hơn để nói “khó hơn”\n\n### Nhiều model cùng giảm\n\nNếu các kiến trúc độc lập đều giảm trên tập B.\n\n### Confidence interval\n\nDùng bootstrap:\n\n1. lấy mẫu test có hoàn lại;\n2. tính ExpRate;\n3. lặp nhiều lần;\n4. lấy khoảng tin cậy 95%.\n\n### Matched subsets\n\nSo sánh các tập sau khi khớp:\n\n- độ dài;\n- cấu trúc;\n- token;\n- kích thước.\n\n### Nhiều metric cùng xấu đi\n\n- ExpRate;\n- $\\leq 1$;\n- $\\leq 2$;\n- Mean Edit Distance;\n- syntax validity.\n\n## 13.5. Cách nói đúng\n\nSai:\n\n> “CROHME 2019 khó hơn vì M1 thấp hơn.”\n\nĐúng:\n\n> **M1 có ExpRate thấp hơn trên 2019. Đây là quan sát model–dataset; để kết luận độ khó cần phân tích phân bố và xu hướng trên nhiều model.**\n\n## 13.6. Không nên nói\n\n- “ExpRate thấp đồng nghĩa dataset khó.”\n- “Năm mới hơn chắc chắn khó hơn.”\n- “Nhiều mẫu hơn là khó hơn.”\n- “Một model đủ để xếp hạng độ khó.”\n\n---"}, {"global_id": 30, "local_id": 14, "priority": "BẪY", "title": "Nếu demo ngoài đời thất bại nhưng test set tốt, đó là lỗi mô hình hay lỗi phân bố dữ liệu? Cần kiểm chứng thế nào?", "content": "## 14.1. Bản trả lời nhanh 60–90 giây\n\n> **Có thể là cả hai. Test set đo hiệu quả in-domain trên ảnh đã được render và chuẩn hóa gần CROHME, trong khi demo có thể khác về nền, nét, crop, độ dày, tỷ lệ, thiết bị và phong cách viết. Đó là domain shift. Nhưng nếu model cũng sai trên các mẫu CROHME có cùng cấu trúc với demo, thì model hoặc data coverage còn yếu.**\n>\n> **Để tách nguyên nhân, em cần lưu ảnh ở từng bước preprocessing, đưa một ảnh CROHME qua đúng pipeline demo, tạo subset in-domain cùng cấu trúc, so sánh token-by-token và thử controlled perturbations. Không được đổ toàn bộ cho người dùng viết xấu hoặc cho dataset.**\n\n## 14.2. Hai miền dữ liệu\n\nBenchmark:\n\n$$ (X,Y)\\sim P_{\\text{CROHME}} $$\n\nDemo:\n\n$$ (X,Y)\\sim P_{\\text{demo}} $$\n\nNếu:\n\n$$ P_{\\text{demo}}(X) \\neq P_{\\text{CROHME}}(X) $$\n\nthì có covariate shift.\n\nNếu cấu trúc cũng khác:\n\n$$ P_{\\text{demo}}(Y) \\neq P_{\\text{CROHME}}(Y) $$\n\nthì có label hoặc structure shift.\n\n## 14.3. Nguồn domain shift\n\n### Ảnh\n\n- nền trắng hoặc đen;\n- antialiasing;\n- RGB sang grayscale;\n- compression;\n- blur;\n- noise;\n- shadow;\n- đường kẻ;\n- crop;\n- margin.\n\n### Nét\n\n- chuột so với bút;\n- nét dày hoặc mảnh;\n- nét đứt;\n- ký hiệu dính;\n- độ nghiêng.\n\n### Bố cục\n\n- cận quá nhỏ;\n- khoảng cách khác train;\n- biểu thức dài;\n- nhiều dòng;\n- bố trí không chuẩn.\n\n### Nhãn\n\n- macro ngoài dictionary;\n- cách LaTeX khác protocol;\n- cấu trúc hiếm.\n\n## 14.4. Quy trình chẩn đoán bảy bước\n\n### Bước 1 — Lưu ảnh trung gian\n\n```text\nraw_input.png\ncropped.png\ndeskewed.png\nbinarized.png\nresized.png\nnormalized_model_input.png\n```\n\n### Bước 2 — Kiểm tra polarity\n\nSo sánh:\n\n- mean pixel;\n- foreground ratio;\n- histogram;\n- nền và nét.\n\n### Bước 3 — Kiểm tra pipeline consistency\n\nLấy một ảnh từ `images.pkl`:\n\n1. xuất PNG;\n2. chạy trực tiếp vào model;\n3. chạy qua app preprocessing;\n4. so sánh output.\n\nNếu direct path đúng nhưng app path sai, lỗi nằm ở integration/preprocessing.\n\n### Bước 4 — Tạo structural subset\n\nNếu demo là tích phân hai cận:\n\n- lấy tất cả test expression có hai cận;\n- tính accuracy riêng;\n- xem năng lực in-domain.\n\n### Bước 5 — Controlled perturbation\n\nTừ ảnh CROHME đúng:\n\n- tăng độ dày;\n- giảm độ dày;\n- nghiêng;\n- thêm margin;\n- đảo polarity;\n- blur;\n- thu nhỏ cận.\n\nĐo điểm bắt đầu suy giảm.\n\n### Bước 6 — Token-level diagnosis\n\nGround truth:\n\n```latex\n\\int _ { 0 } ^ { 1 } x d x\n```\n\nPhân loại:\n\n- mất `\\int`;\n- mất `_`;\n- mất `^`;\n- sai nội dung cận;\n- sai body;\n- sai ngoặc;\n- truncate.\n\n### Bước 7 — Confidence và beam analysis\n\n- beam scores;\n- top-k alternatives;\n- token entropy;\n- attention map;\n- nearest train examples.\n\n## 14.5. Ma trận kết luận\n\n| In-domain subset | Demo | Kết luận chính |\n|---|---|---|\n| Tốt | Kém | Domain shift hoặc preprocessing là nghi phạm lớn |\n| Kém | Kém | Model hoặc data coverage còn yếu |\n| Direct path tốt, app path kém | Kém | Integration/preprocessing lỗi |\n| Kém riêng một cấu trúc | Kém đúng cấu trúc đó | Long-tail hoặc structural limitation |\n| Tốt hơn sau domain augmentation | Tốt hơn | Domain adaptation có tác dụng |\n\n## 14.6. Cách nói khoa học\n\n> **Demo failure là bằng chứng hệ thống chưa tổng quát tốt ngoài benchmark, nhưng chưa đủ để xác định nguyên nhân. Em tách data coverage, preprocessing consistency và model capacity bằng controlled evaluation.**\n\n## 14.7. Không nên nói\n\n- “Người dùng viết xấu.”\n- “Dataset không có.”\n- “Test tốt nên model không có lỗi.”\n- “Demo sai chắc chắn do frontend.”\n- “Chỉ cần augmentation là giải quyết.”\n- “Một ảnh demo đủ để kết luận domain shift.”\n\n---"}], "extras": [{"title": "15. Script audit dataset bắt buộc phải chạy", "content": "Lưu script sau thành:\n\n```text\ntools/audit_crohme_dataset.py\n```\n\nChạy:\n\n```bash\npython tools/audit_crohme_dataset.py \\\n  --root data/crohme \\\n  --output dataset_audit\n```\n\n```python\nfrom __future__ import annotations\n\nimport argparse\nimport hashlib\nimport json\nimport math\nimport pickle\nfrom collections import Counter, defaultdict\nfrom pathlib import Path\nfrom typing import Any\n\nimport numpy as np\n\n\nSPLITS = (\"train\", \"2014\", \"2016\", \"2019\")\nMAX_TRAIN_TOKENS = 200\nMAX_TRAIN_AREA = 320_000\n\n\ndef read_dictionary(root: Path) -> list[str]:\n    path = root / \"dictionary.txt\"\n    with path.open(\"r\", encoding=\"utf-8\") as file:\n        return [line.strip() for line in file if line.strip()]\n\n\ndef read_captions(root: Path, split: str) -> list[dict[str, Any]]:\n    path = root / split / \"caption.txt\"\n    rows: list[dict[str, Any]] = []\n\n    with path.open(\"r\", encoding=\"utf-8\") as file:\n        for line_no, line in enumerate(file, start=1):\n            parts = line.strip().split()\n            if not parts:\n                continue\n\n            rows.append(\n                {\n                    \"line_no\": line_no,\n                    \"image_id\": parts[0],\n                    \"tokens\": parts[1:],\n                    \"latex\": \" \".join(parts[1:]),\n                }\n            )\n\n    return rows\n\n\ndef read_images(root: Path, split: str) -> dict[str, np.ndarray]:\n    path = root / split / \"images.pkl\"\n    with path.open(\"rb\") as file:\n        images = pickle.load(file)\n\n    if not isinstance(images, dict):\n        raise TypeError(\n            f\"{path} phải chứa dict image_id -> numpy array, \"\n            f\"nhưng nhận {type(images)!r}\"\n        )\n\n    return images\n\n\ndef summarize_numbers(values: list[int]) -> dict[str, Any]:\n    if not values:\n        return {\n            \"count\": 0,\n            \"mean\": math.nan,\n            \"median\": math.nan,\n            \"std\": math.nan,\n            \"p90\": math.nan,\n            \"p95\": math.nan,\n            \"max\": None,\n            \"gt_50\": 0,\n            \"gt_100\": 0,\n            \"gt_150\": 0,\n            \"gt_200\": 0,\n        }\n\n    array = np.asarray(values, dtype=np.float64)\n\n    return {\n        \"count\": int(len(values)),\n        \"mean\": float(array.mean()),\n        \"median\": float(np.median(array)),\n        \"std\": float(array.std()),\n        \"p90\": float(np.percentile(array, 90)),\n        \"p95\": float(np.percentile(array, 95)),\n        \"max\": int(array.max()),\n        \"gt_50\": int((array > 50).sum()),\n        \"gt_100\": int((array > 100).sum()),\n        \"gt_150\": int((array > 150).sum()),\n        \"gt_200\": int((array > 200).sum()),\n    }\n\n\ndef image_hash(image: np.ndarray) -> str:\n    contiguous = np.ascontiguousarray(image)\n    digest = hashlib.sha256()\n    digest.update(str(contiguous.dtype).encode(\"utf-8\"))\n    digest.update(str(contiguous.shape).encode(\"utf-8\"))\n    digest.update(contiguous.tobytes())\n    return digest.hexdigest()\n\n\ndef skip_group(tokens: list[str], index: int) -> int:\n    \"\"\"Bỏ qua một group LaTeX bắt đầu tại index.\"\"\"\n\n    if index >= len(tokens):\n        return index\n\n    if tokens[index] != \"{\":\n        return index + 1\n\n    depth = 0\n    cursor = index\n\n    while cursor < len(tokens):\n        if tokens[cursor] == \"{\":\n            depth += 1\n        elif tokens[cursor] == \"}\":\n            depth -= 1\n            if depth == 0:\n                return cursor + 1\n        cursor += 1\n\n    return cursor\n\n\ndef classify_integral_at(\n    tokens: list[str],\n    integral_index: int,\n) -> tuple[bool, bool]:\n    \"\"\"Trả về has_lower và has_upper cho một token \\\\int.\"\"\"\n\n    cursor = integral_index + 1\n    has_lower = False\n    has_upper = False\n\n    while cursor < len(tokens):\n        token = tokens[cursor]\n\n        if token == \"_\":\n            has_lower = True\n            cursor = skip_group(tokens, cursor + 1)\n            continue\n\n        if token == \"^\":\n            has_upper = True\n            cursor = skip_group(tokens, cursor + 1)\n            continue\n\n        break\n\n    return has_lower, has_upper\n\n\ndef classify_integral_expression(tokens: list[str]) -> dict[str, Any]:\n    positions = [\n        index\n        for index, token in enumerate(tokens)\n        if token == r\"\\int\"\n    ]\n\n    result: dict[str, Any] = {\n        \"contains_integral\": bool(positions),\n        \"integral_occurrences\": len(positions),\n        \"no_bounds\": False,\n        \"lower_only\": False,\n        \"upper_only\": False,\n        \"both_bounds\": False,\n        \"multiple_integrals\": len(positions) >= 2,\n    }\n\n    for position in positions:\n        lower, upper = classify_integral_at(tokens, position)\n\n        if lower and upper:\n            result[\"both_bounds\"] = True\n        elif lower:\n            result[\"lower_only\"] = True\n        elif upper:\n            result[\"upper_only\"] = True\n        else:\n            result[\"no_bounds\"] = True\n\n    return result\n\n\ndef expression_structures(tokens: list[str]) -> set[str]:\n    token_set = set(tokens)\n    structures: set[str] = set()\n\n    mapping = {\n        r\"\\frac\": \"fraction\",\n        r\"\\sqrt\": \"sqrt\",\n        r\"\\int\": \"integral\",\n        r\"\\sum\": \"sum\",\n        r\"\\prod\": \"product\",\n        r\"\\lim\": \"limit\",\n        \"^\": \"superscript_or_upper_bound\",\n        \"_\": \"subscript_or_lower_bound\",\n    }\n\n    for token, name in mapping.items():\n        if token in token_set:\n            structures.add(name)\n\n    if tokens.count(r\"\\frac\") >= 2:\n        structures.add(\"multiple_or_nested_fraction\")\n\n    if tokens.count(r\"\\sqrt\") >= 2:\n        structures.add(\"multiple_or_nested_sqrt\")\n\n    if r\"\\frac\" in token_set and r\"\\sqrt\" in token_set:\n        structures.add(\"fraction_and_sqrt\")\n\n    integral = classify_integral_expression(tokens)\n\n    if integral[\"no_bounds\"]:\n        structures.add(\"integral_no_bounds\")\n    if integral[\"lower_only\"]:\n        structures.add(\"integral_lower_only\")\n    if integral[\"upper_only\"]:\n        structures.add(\"integral_upper_only\")\n    if integral[\"both_bounds\"]:\n        structures.add(\"integral_both_bounds\")\n\n    return structures\n\n\ndef audit_split(\n    root: Path,\n    split: str,\n    dictionary: set[str],\n) -> tuple[dict[str, Any], list[dict[str, Any]]]:\n    rows = read_captions(root, split)\n    images = read_images(root, split)\n\n    missing_images: list[str] = []\n    extra_images = set(images)\n\n    lengths: list[int] = []\n    heights: list[int] = []\n    widths: list[int] = []\n    areas: list[int] = []\n\n    token_counts: Counter[str] = Counter()\n    structure_counts: Counter[str] = Counter()\n    integral_counts: Counter[str] = Counter()\n    oov_counts: Counter[str] = Counter()\n\n    image_hash_to_ids: dict[str, list[str]] = defaultdict(list)\n    latex_to_ids: dict[str, list[str]] = defaultdict(list)\n\n    effective_rows: list[dict[str, Any]] = []\n\n    filtered_too_long = 0\n    filtered_too_large = 0\n\n    for row in rows:\n        image_id = row[\"image_id\"]\n        tokens = row[\"tokens\"]\n\n        if image_id not in images:\n            missing_images.append(image_id)\n            continue\n\n        extra_images.discard(image_id)\n\n        image = np.asarray(images[image_id])\n\n        if image.ndim < 2:\n            raise ValueError(\n                f\"Ảnh {split}/{image_id} có shape không hợp lệ: \"\n                f\"{image.shape}\"\n            )\n\n        height = int(image.shape[0])\n        width = int(image.shape[1])\n        area = height * width\n\n        lengths.append(len(tokens))\n        heights.append(height)\n        widths.append(width)\n        areas.append(area)\n\n        token_counts.update(tokens)\n\n        for token in tokens:\n            if token not in dictionary:\n                oov_counts[token] += 1\n\n        structures = expression_structures(tokens)\n        structure_counts.update(structures)\n\n        integral = classify_integral_expression(tokens)\n        for key, value in integral.items():\n            if key == \"integral_occurrences\":\n                integral_counts[key] += int(value)\n            elif value:\n                integral_counts[key] += 1\n\n        digest = image_hash(image)\n        image_hash_to_ids[digest].append(image_id)\n        latex_to_ids[row[\"latex\"]].append(image_id)\n\n        keep = True\n        reasons: list[str] = []\n\n        if split == \"train\":\n            if len(tokens) > MAX_TRAIN_TOKENS:\n                keep = False\n                filtered_too_long += 1\n                reasons.append(\"too_long\")\n\n            if area > MAX_TRAIN_AREA:\n                keep = False\n                filtered_too_large += 1\n                reasons.append(\"too_large\")\n\n        enriched = dict(row)\n        enriched.update(\n            {\n                \"height\": height,\n                \"width\": width,\n                \"area\": area,\n                \"image_hash\": digest,\n                \"keep_for_training\": keep,\n                \"filter_reason\": reasons,\n            }\n        )\n\n        if keep:\n            effective_rows.append(enriched)\n\n    stats = {\n        \"split\": split,\n        \"raw_caption_count\": len(rows),\n        \"images_count\": len(images),\n        \"missing_image_count\": len(missing_images),\n        \"missing_images_first_20\": missing_images[:20],\n        \"extra_image_count\": len(extra_images),\n        \"extra_images_first_20\": sorted(extra_images)[:20],\n        \"lengths\": summarize_numbers(lengths),\n        \"image_height\": summarize_numbers(heights),\n        \"image_width\": summarize_numbers(widths),\n        \"image_area\": summarize_numbers(areas),\n        \"effective_count_after_repo_train_filters\": len(effective_rows),\n        \"filtered_too_long\": filtered_too_long,\n        \"filtered_too_large\": filtered_too_large,\n        \"token_occurrences_total\": sum(token_counts.values()),\n        \"unique_tokens\": len(token_counts),\n        \"oov_token_types\": len(oov_counts),\n        \"oov_token_occurrences\": sum(oov_counts.values()),\n        \"oov_counts\": dict(oov_counts.most_common()),\n        \"top_30_tokens\": token_counts.most_common(30),\n        \"rare_tokens_le_5\": sorted(\n            (token, count)\n            for token, count in token_counts.items()\n            if count <= 5\n        ),\n        \"structure_expression_counts\": dict(\n            structure_counts.most_common()\n        ),\n        \"integral_counts\": dict(integral_counts),\n        \"duplicate_image_hash_groups_within_split\": sum(\n            len(ids) > 1\n            for ids in image_hash_to_ids.values()\n        ),\n        \"duplicate_latex_groups_within_split\": sum(\n            len(ids) > 1\n            for ids in latex_to_ids.values()\n        ),\n    }\n\n    return stats, effective_rows\n\n\ndef pairwise_overlap(\n    split_rows: dict[str, list[dict[str, Any]]],\n) -> dict[str, Any]:\n    result: dict[str, Any] = {}\n\n    for left_index, left_name in enumerate(SPLITS):\n        for right_name in SPLITS[left_index + 1:]:\n            left_rows = split_rows[left_name]\n            right_rows = split_rows[right_name]\n\n            left_ids = {row[\"image_id\"] for row in left_rows}\n            right_ids = {row[\"image_id\"] for row in right_rows}\n\n            left_hashes = {row[\"image_hash\"] for row in left_rows}\n            right_hashes = {row[\"image_hash\"] for row in right_rows}\n\n            left_latex = {row[\"latex\"] for row in left_rows}\n            right_latex = {row[\"latex\"] for row in right_rows}\n\n            pair_name = f\"{left_name}__{right_name}\"\n\n            seen_count = sum(\n                row[\"latex\"] in left_latex\n                for row in right_rows\n            )\n\n            result[pair_name] = {\n                \"filename_overlap\": len(left_ids & right_ids),\n                \"image_hash_overlap\": len(\n                    left_hashes & right_hashes\n                ),\n                \"exact_latex_overlap\": len(\n                    left_latex & right_latex\n                ),\n                \"right_expressions_with_latex_seen_in_left\":\n                    seen_count,\n                \"right_seen_latex_rate\": (\n                    seen_count / len(right_rows)\n                    if right_rows\n                    else math.nan\n                ),\n            }\n\n    return result\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--root\", type=Path, required=True)\n    parser.add_argument(\"--output\", type=Path, required=True)\n    args = parser.parse_args()\n\n    root: Path = args.root\n    output: Path = args.output\n    output.mkdir(parents=True, exist_ok=True)\n\n    dictionary_list = read_dictionary(root)\n    dictionary = set(dictionary_list)\n\n    report: dict[str, Any] = {\n        \"dictionary_file_tokens\": len(dictionary_list),\n        \"dictionary_unique_tokens\": len(dictionary),\n        \"model_vocab_size_with_pad_sos_eos\":\n            len(dictionary) + 3,\n        \"special_tokens\": [\"<pad>\", \"<sos>\", \"<eos>\"],\n        \"splits\": {},\n    }\n\n    split_rows: dict[str, list[dict[str, Any]]] = {}\n\n    for split in SPLITS:\n        stats, effective_rows = audit_split(\n            root,\n            split,\n            dictionary,\n        )\n        report[\"splits\"][split] = stats\n        split_rows[split] = effective_rows\n\n    report[\"pairwise_overlap\"] = pairwise_overlap(split_rows)\n\n    json_path = output / \"dataset_audit.json\"\n    with json_path.open(\"w\", encoding=\"utf-8\") as file:\n        json.dump(report, file, ensure_ascii=False, indent=2)\n\n    lines = [\n        \"# CROHME Dataset Audit\",\n        \"\",\n        f\"- Dictionary tokens: {len(dictionary)}\",\n        (\n            \"- Model vocabulary including special tokens: \"\n            f\"{len(dictionary) + 3}\"\n        ),\n        \"\",\n        \"## Split sizes\",\n        \"\",\n        \"| Split | Raw | Effective | Mean length | \"\n        \"P95 | Max | >150 |\",\n        \"|---|---:|---:|---:|---:|---:|---:|\",\n    ]\n\n    for split in SPLITS:\n        stats = report[\"splits\"][split]\n        lengths = stats[\"lengths\"]\n\n        lines.append(\n            f\"| {split} | \"\n            f\"{stats['raw_caption_count']} | \"\n            f\"{stats['effective_count_after_repo_train_filters']} | \"\n            f\"{lengths['mean']:.2f} | \"\n            f\"{lengths['p95']:.2f} | \"\n            f\"{lengths['max']} | \"\n            f\"{lengths['gt_150']} |\"\n        )\n\n    lines.extend(\n        [\n            \"\",\n            \"## Integral distribution\",\n            \"\",\n            \"| Split | Integral expressions | No bounds | \"\n            \"Lower only | Upper only | Both bounds |\",\n            \"|---|---:|---:|---:|---:|---:|\",\n        ]\n    )\n\n    for split in SPLITS:\n        counts = report[\"splits\"][split][\"integral_counts\"]\n\n        lines.append(\n            f\"| {split} | \"\n            f\"{counts.get('contains_integral', 0)} | \"\n            f\"{counts.get('no_bounds', 0)} | \"\n            f\"{counts.get('lower_only', 0)} | \"\n            f\"{counts.get('upper_only', 0)} | \"\n            f\"{counts.get('both_bounds', 0)} |\"\n        )\n\n    lines.extend(\n        [\n            \"\",\n            \"## Pairwise overlap\",\n            \"\",\n            \"| Pair | Filename | Image hash | Exact LaTeX | \"\n            \"Right labels seen in left |\",\n            \"|---|---:|---:|---:|---:|\",\n        ]\n    )\n\n    for pair, values in report[\"pairwise_overlap\"].items():\n        lines.append(\n            f\"| {pair} | \"\n            f\"{values['filename_overlap']} | \"\n            f\"{values['image_hash_overlap']} | \"\n            f\"{values['exact_latex_overlap']} | \"\n            f\"{values['right_expressions_with_latex_seen_in_left']} |\"\n        )\n\n    markdown_path = output / \"dataset_audit.md\"\n    markdown_path.write_text(\n        \"\\n\".join(lines),\n        encoding=\"utf-8\",\n    )\n\n    print(f\"Đã ghi: {json_path}\")\n    print(f\"Đã ghi: {markdown_path}\")\n\n\nif __name__ == \"__main__\":\n    main()\n```\n\n---"}, {"title": "16. Script tính accuracy riêng cho tích phân hai cận", "content": "Repo có thể lưu prediction dạng:\n\n```text\npred_2014.json\npred_2016.json\npred_2019.json\n```\n\nMỗi sample thường gồm:\n\n```json\n{\n  \"sample_id\": {\n    \"pred\": \"...\",\n    \"gt\": \"...\",\n    \"dist\": 0\n  }\n}\n```\n\nLưu script:\n\n```text\ntools/evaluate_integral_bounds.py\n```\n\n```python\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef skip_group(tokens: list[str], index: int) -> int:\n    if index >= len(tokens):\n        return index\n\n    if tokens[index] != \"{\":\n        return index + 1\n\n    depth = 0\n\n    while index < len(tokens):\n        if tokens[index] == \"{\":\n            depth += 1\n        elif tokens[index] == \"}\":\n            depth -= 1\n            if depth == 0:\n                return index + 1\n        index += 1\n\n    return index\n\n\ndef has_integral_with_both_bounds(\n    tokens: list[str],\n) -> bool:\n    for index, token in enumerate(tokens):\n        if token != r\"\\int\":\n            continue\n\n        cursor = index + 1\n        lower = False\n        upper = False\n\n        while cursor < len(tokens):\n            current = tokens[cursor]\n\n            if current == \"_\":\n                lower = True\n                cursor = skip_group(tokens, cursor + 1)\n                continue\n\n            if current == \"^\":\n                upper = True\n                cursor = skip_group(tokens, cursor + 1)\n                continue\n\n            break\n\n        if lower and upper:\n            return True\n\n    return False\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\n        \"prediction_json\",\n        type=Path,\n    )\n    args = parser.parse_args()\n\n    with args.prediction_json.open(\n        \"r\",\n        encoding=\"utf-8\",\n    ) as file:\n        data: dict[str, dict[str, Any]] = json.load(file)\n\n    subset: list[dict[str, Any]] = []\n\n    for sample_id, item in data.items():\n        gt_tokens = item[\"gt\"].split()\n\n        if not has_integral_with_both_bounds(gt_tokens):\n            continue\n\n        subset.append(\n            {\n                \"id\": sample_id,\n                \"pred\": item[\"pred\"],\n                \"gt\": item[\"gt\"],\n                \"dist\": int(item[\"dist\"]),\n                \"exact\": item[\"pred\"] == item[\"gt\"],\n            }\n        )\n\n    total = len(subset)\n    exact = sum(row[\"exact\"] for row in subset)\n\n    mean_distance = (\n        sum(row[\"dist\"] for row in subset) / total\n        if total\n        else float(\"nan\")\n    )\n\n    print(f\"Integral both-bounds samples: {total}\")\n    print(f\"Exact: {exact}\")\n\n    if total:\n        print(f\"ExpRate: {exact / total:.4%}\")\n    else:\n        print(\"ExpRate: N/A\")\n\n    print(f\"Mean edit distance: {mean_distance:.4f}\")\n\n    worst = sorted(\n        subset,\n        key=lambda row: row[\"dist\"],\n        reverse=True,\n    )[:20]\n\n    print(\"\\nTop errors:\")\n\n    for row in worst:\n        print(\"-\" * 80)\n        print(\"ID  :\", row[\"id\"])\n        print(\"GT  :\", row[\"gt\"])\n        print(\"Pred:\", row[\"pred\"])\n        print(\"Dist:\", row[\"dist\"])\n\n\nif __name__ == \"__main__\":\n    main()\n```\n\n---"}, {"title": "17. Bảng trả lời học thuộc", "content": "| Câu | Ý chính phải nói |\n|---|---|\n| 1 | Train lấy `train`; val và test cùng lấy `test_folder`; mặc định là 2014 |\n| 2 | 8.836 / 986 / 1.147 / 1.199; phải phân biệt raw count và effective train count |\n| 3 | Nguồn gốc online InkML nhưng model dùng offline raster `[B,1,H,W]` |\n| 4 | Đọc `images.pkl`, resize giữ tỷ lệ, ToTensor, dynamic batch, zero padding và mask |\n| 5 | Ba kỳ khác nhau về quy mô và đợt thu thập; phân bố chi tiết phải đo |\n| 6 | Nhiều test giúp kiểm tra tính ổn định và tránh cherry-picking |\n| 7 | Audit filename, image hash, LaTeX và writer; 2014 có model-selection contamination |\n| 8 | 110 dictionary token + 3 special = 113; chưa chứng minh dictionary train-only; không có UNK |\n| 9 | Chưa có stats; train filter 200 nhưng decode max 150 |\n| 10 | Không nói cấu trúc nào hiếm trước khi đếm |\n| 11 | Không nói dataset không có tích phân có cận; phải parse ngay sau `\\int` |\n| 12 | OOV gây KeyError; rare token không được reweight |\n| 13 | ExpRate thấp là thuộc tính model–dataset, chưa đủ xếp hạng độ khó |\n| 14 | Demo failure có thể do domain shift, preprocessing và model; cần controlled diagnosis |\n\n---"}, {"title": "18. Các câu tuyệt đối không nên nói", "content": "1. “CROHME 2014 chỉ là test set.”\n2. “Repo có validation riêng.”\n3. “Train chắc chắn có đúng 8.836 mẫu sau lọc.”\n4. “Dataset không có tích phân có cận.”\n5. “2019 khó nhất vì ExpRate thấp.”\n6. “CROHME là offline dataset nguyên gốc.”\n7. “Repo sử dụng stroke order.”\n8. “Dictionary chắc chắn tạo từ train.”\n9. “Có token `<unk>`.”\n10. “Token hiếm đã được xử lý cân bằng.”\n11. “Khác thư mục thì chắc chắn không trùng.”\n12. “Demo sai chỉ vì người dùng viết xấu.”\n13. “Random horizontal flip được dùng.”\n14. “Ảnh đều resize về một kích thước cố định.”\n15. “Ba test set đều untouched như nhau.”\n\n---"}, {"title": "19. Checklist bắt buộc trước khi đưa Nhóm 3 vào luận văn", "content": "## Dataset identity\n\n- [ ] Lưu checksum SHA-256 của `CROHME.zip`.\n- [ ] Ghi nguồn tải và ngày tải.\n- [ ] Ghi cấu trúc thư mục sau giải nén.\n- [ ] Ghi commit code dùng để train.\n\n## Split\n\n- [ ] Chạy count từng `caption.txt`.\n- [ ] Đếm train sau filter.\n- [ ] Chốt validation protocol.\n- [ ] Ghi rõ 2014 dùng model selection hay không.\n- [ ] Không tune tiếp trên 2016/2019 sau khi xem kết quả.\n\n## Vocabulary\n\n- [ ] Xuất toàn bộ 110 dictionary token.\n- [ ] Xác định nguồn xây dictionary.\n- [ ] Audit OOV từng split.\n- [ ] Phân loại symbol token và structural token.\n\n## Distribution\n\n- [ ] Bảng length statistics.\n- [ ] Histogram token length.\n- [ ] Histogram image size và aspect ratio.\n- [ ] Token frequency.\n- [ ] Structure frequency.\n- [ ] Integral-bound counts.\n- [ ] Seen-label và unseen-label rate.\n\n## Leakage\n\n- [ ] Filename overlap.\n- [ ] Image hash overlap.\n- [ ] Exact normalized LaTeX overlap.\n- [ ] Writer overlap nếu có metadata.\n- [ ] Ghi rõ model-selection contamination.\n\n## Demo\n\n- [ ] Lưu ảnh trước và sau preprocessing.\n- [ ] Kiểm tra polarity.\n- [ ] Test ảnh CROHME qua app path.\n- [ ] Test subset tích phân có cận.\n- [ ] Token-level error analysis.\n\n---"}, {"title": "20. Nguồn đối chiếu chính", "content": "## Trong repo\n\n- `chuyende_tamer_temp/1-cnn-gnn/config/crohme.yaml`\n- `chuyende_tamer_temp/1-cnn-gnn/tamer/datamodule/datamodule.py`\n- `chuyende_tamer_temp/1-cnn-gnn/tamer/datamodule/dataset.py`\n- `chuyende_tamer_temp/1-cnn-gnn/tamer/datamodule/transforms.py`\n- `chuyende_tamer_temp/1-cnn-gnn/tamer/datamodule/vocab.py`\n- `chuyende_tamer_temp/KetQua/*/config/crohme.yaml`\n- `chuyende_tamer_temp/KetQua/*/evaluation_results/pred_*.json`\n\n## Nguồn benchmark cần trích trong luận văn\n\n- Báo cáo CROHME 2014.\n- Báo cáo ICFHR CROHME 2016.\n- Báo cáo CROHME 2019.\n- Paper hoặc repo TAMER gốc để đối chiếu protocol.\n- Tài liệu mô tả định dạng InkML và annotation CROHME.\n\n---"}, {"title": "21. Đoạn trả lời tổng hợp khoảng hai phút", "content": "> **Repo hiện dùng gói CROHME đã được chuyển từ dữ liệu stroke online sang ảnh raster. Model đọc `images.pkl`, còn nhãn token nằm trong `caption.txt`; vì đầu vào cuối là tensor một kênh `[B,1,H,W]`, đây là offline HMER. Quy mô chuẩn là 8.836 mẫu train, còn 2014, 2016 và 2019 có 986, 1.147 và 1.199 mẫu. Tuy nhiên train có bộ lọc nhãn dài hơn 200 token và ảnh lớn hơn 320.000 pixel, nên em phải báo cáo thêm số mẫu hiệu dụng.**\n>\n> **Một điểm quan trọng là code không có validation riêng: `val_dataset` và `test_dataset` cùng lấy từ `test_folder`. Config hiện đặt `test_folder: 2014`, trong khi checkpoint được chọn theo `val_ExpRate`; do đó 2014 đang là model-selection set và không còn là test hoàn toàn untouched. Em cần sửa protocol bằng validation nội bộ hoặc ít nhất ghi rõ hạn chế này.**\n>\n> **Vocabulary có 113 class đầu ra, gồm 110 token trong `dictionary.txt` và ba token `<pad>`, `<sos>`, `<eos>`. Code không có `<unk>`, nên mọi caption phải nằm trong dictionary. Repo chưa có báo cáo phân bố độ dài, cấu trúc, token hiếm và tích phân có cận; vì vậy em không được nói dataset không có cấu trúc đó. Em sẽ chạy audit trên caption và image để đếm chính xác, kiểm tra OOV, duplicate image, exact-LaTeX overlap và accuracy theo subset.**\n>\n> **Cuối cùng, ExpRate thấp hơn trên một năm không đủ chứng minh test set đó khó hơn. Cần phân tích độ dài, cấu trúc, rare token, writer style và confidence interval. Nếu demo ngoài đời kém nhưng benchmark tốt, em sẽ tách domain shift, preprocessing và giới hạn mô hình bằng controlled tests, thay vì đổ lỗi cho người viết hoặc dataset.**\n\n---"}, {"title": "22. Câu kết thúc Nhóm 3", "content": "> **Đối với dataset, câu trả lời có điểm không phải là câu nghe hợp lý nhất, mà là câu có thể truy ngược đến đúng file dữ liệu, đúng script đếm và đúng protocol chia tập. Bất kỳ nhận định nào về “nhiều”, “ít”, “khó” hoặc “không có” đều phải đi kèm số liệu.**"}]}, {"group_id": 4, "title": "Tiền xử lý ảnh, token hóa và nhãn LaTeX", "intro": "# NHÓM 4 — TIỀN XỬ LÝ ẢNH, TOKEN HÓA VÀ NHÃN LATEX\n\n> **Mục tiêu nhóm:** Giải thích được mọi biến đổi từ ảnh thô và nhãn thô đến tensor và chuỗi token mà mô hình thật sự nhìn thấy.\n\n## Quy ước của tài liệu\n\n- Công thức Markdown dùng `$...$` và `$$...$$`.\n- Mọi mô tả “đã dùng” phải lấy từ code/config của đúng run.\n- Phải tách **preprocessing dataset**, **transform trong dataloader** và **preprocessing của app**.\n- Cuốn chuyên đề cũ không phải nguồn sự thật cho pipeline hiện tại.\n\n---", "questions": [{"global_id": 31, "local_id": 1, "priority": "ĐỎ", "title": "Ảnh đầu vào được resize, padding và chuẩn hóa như thế nào?", "content": "## 1.1. Bản trả lời nhanh\n\n> **Ảnh được đọc dưới dạng mảng raster một kênh. Nếu `scale_to_limit` bật, code resize giữ nguyên tỷ lệ để chiều cao nằm trong khoảng 16–256 và chiều rộng trong khoảng 16–1024; ảnh đang nằm trong giới hạn thì không bị resize. Trong mỗi batch, ảnh được pad bằng 0 đến chiều cao và chiều rộng lớn nhất của batch, đồng thời tạo mask đánh dấu vùng padding. Sau đó ảnh được chuyển thành tensor một kênh bằng `ToTensor()`.**\n>\n> **Repo hiện không cho thấy bước chuẩn hóa mean–standard deviation. Vì vậy em chỉ được nói có scale kích thước, chuyển tensor, zero-padding và mask; không được tự thêm các bước grayscale, contrast hoặc normalization nếu không có code/log chứng minh.**\n\n## 1.2. Giải thích chi tiết\n\n### a. Đầu vào mà loader nhận\n\nGói dữ liệu chứa ảnh trong `images.pkl`. Một sample được lấy bằng image ID trong `caption.txt`. `HMEDataset` áp dụng chuỗi transform lên từng ảnh.\n\nCác giới hạn kích thước trong code:\n\n```python\nH_LO = 16\nH_HI = 256\nW_LO = 16\nW_HI = 1024\n```\n\n### b. Resize giữ tỷ lệ\n\nVới ảnh có kích thước $H \\times W$, nếu ảnh vượt giới hạn trên, hệ số thu nhỏ là:\n\n$$ s_{\\text{down}} = \\min\\left(\\frac{256}{H},\\frac{1024}{W}\\right) $$\n\nNếu ảnh nhỏ hơn giới hạn dưới, hệ số phóng to là:\n\n$$ s_{\\text{up}} = \\max\\left(\\frac{16}{H},\\frac{16}{W}\\right) $$\n\nCả hai chiều đều nhân cùng một hệ số, nên tỷ lệ hình học được giữ. Ảnh không bị ép méo về một khung cố định như $128 \\times 512$.\n\nCode dùng `cv2.INTER_LINEAR` cho cả thu nhỏ và phóng to. Đây là điểm có thể ảnh hưởng nét mảnh: interpolation tuyến tính có thể làm các pixel biên trở thành mức xám trung gian.\n\n### c. Padding theo batch\n\nVì mỗi ảnh có kích thước khác nhau, collate tạo tensor:\n\n$$ X \\in \\mathbb{R}^{B \\times 1 \\times H_{\\max} \\times W_{\\max}} $$\n\nẢnh nhỏ được đặt vào góc trên trái và phần còn lại được điền 0. Một mask có dạng:\n\n$$ M \\in \\{0,1\\}^{B \\times H_{\\max} \\times W_{\\max}} $$\n\nđánh dấu vùng thật và vùng padding. Trong code encoder, mask được downsample song song với feature map và được dùng để loại node padding khỏi attention.\n\n### d. “Chuẩn hóa” cần dùng đúng nghĩa\n\nTrong bảo vệ, từ “chuẩn hóa” có thể gây hiểu nhầm. Nên tách:\n\n- chuẩn hóa kích thước: có;\n- chuẩn hóa số kênh: đầu vào tensor một kênh;\n- chuẩn hóa cường độ bằng `ToTensor()`: chuyển sang tensor và scale theo quy tắc torchvision;\n- chuẩn hóa mean/std: chưa thấy;\n- binarization, deskew, morphology: thuộc app nếu có, không phải pipeline train mặc định.\n\n### e. Vấn đề cần audit\n\nCần lấy 20 ảnh train và ghi:\n\n- dtype trước `ToTensor`;\n- min, max, mean;\n- polarity nền/nét;\n- shape trước/sau resize;\n- tỷ lệ foreground;\n- tensor sau padding.\n\nKhông làm audit này thì rất dễ demo đảo màu hoặc scale khác train.\n\n## 1.3. Câu hỏi truy tiếp và cách trả lời\n\n**“Ảnh có bị cố định chiều cao 128 không?”**\n\n> Không trong loader train hiện tại. Loader chỉ đảm bảo $16 \\le H \\le 256$ và $16 \\le W \\le 1024$, giữ tỷ lệ. Nếu app demo có resize về chiều cao 128 thì đó là một pipeline khác và phải kiểm tra tính nhất quán.\n\n**“Padding bằng 0 có chắc là nền không?”**\n\n> Chưa chắc nếu chưa kiểm tra polarity. Mask giúp attention bỏ vùng padding, nhưng các lớp CNN ban đầu vẫn nhận pixel pad. Cần xác nhận pixel 0 tương ứng gần nền train hoặc đánh giá ảnh hưởng biên padding.\n\n## 1.4. Không nên nói\n\n- “Mọi ảnh được resize về cùng kích thước.”\n- “Ảnh luôn được cố định chiều cao 128.”\n- “Có normalization mean/std” khi chưa thấy code.\n- “Padding không thể ảnh hưởng vì đã có mask.”\n- “Ảnh chắc chắn nền đen nét trắng” nếu chưa audit dữ liệu thật.\n\n## 1.5. Bằng chứng cần chỉ ra\n\n- `tamer/datamodule/dataset.py`: các hằng số 16, 256, 16, 1024 và chuỗi transform.\n- `tamer/datamodule/transforms.py`: công thức scale giữ tỷ lệ và `INTER_LINEAR`.\n- `tamer/datamodule/datamodule.py`: zero-padding và mask.\n- Một file audit ảnh trước/sau transform do luận văn tự xuất.\n\n---"}, {"global_id": 32, "local_id": 2, "priority": "ĐỎ", "title": "Quy trình tiền xử lý lúc demo có giống hoàn toàn lúc train và test không?", "content": "## 2.1. Bản trả lời nhanh\n\n> **Không được mặc định là giống. Train/test đọc trực tiếp ảnh đã đóng gói trong `images.pkl`, dùng `ScaleToLimitRange`, `ToTensor`, padding và mask. Demo lại có thể đi qua upload/canvas, crop, grayscale, threshold, đảo màu, deskew hoặc resize riêng. Chỉ cần khác polarity, tỷ lệ, margin hoặc độ dày nét là đã tạo domain gap.**\n>\n> **Muốn khẳng định giống nhau, em phải đưa cùng một ảnh qua hai đường xử lý và so sánh tensor cuối cùng, không chỉ nhìn ảnh bằng mắt.**\n\n## 2.2. Giải thích chi tiết\n\n### a. Hai pipeline phải được xem là hai hệ thống độc lập cho đến khi kiểm chứng\n\n**Đường benchmark:**\n\n```text\nimages.pkl\n→ ScaleToLimitRange\n→ ToTensor\n→ dynamic batching\n→ zero-padding + mask\n→ model\n```\n\n**Đường demo có thể là:**\n\n```text\ncanvas/ảnh chụp\n→ decode RGB\n→ crop\n→ remove background\n→ grayscale\n→ threshold\n→ invert\n→ deskew\n→ resize\n→ pad\n→ model\n```\n\nSố bước nhiều hơn làm tăng nguy cơ mismatch.\n\n### b. Các mismatch nguy hiểm\n\n1. **Polarity:** train nét sáng trên nền tối nhưng demo ngược lại.\n2. **Range:** train tensor $[0,1]$, demo truyền $[0,255]$.\n3. **Channel:** train 1 channel, demo 3 channel.\n4. **Crop:** demo crop sát làm mất dấu mũ; train có margin.\n5. **Aspect ratio:** demo ép khung cố định.\n6. **Interpolation:** demo dùng nearest/bicubic khác train.\n7. **Foreground ratio:** nét demo dày hơn nhiều.\n8. **Antialiasing:** canvas có biên mờ khác ảnh render CROHME.\n9. **Padding position:** train đặt ở góc trên trái nhưng demo căn giữa.\n10. **Threshold:** dấu chấm hoặc cận nhỏ bị xóa.\n\n### c. Phép kiểm chứng đúng\n\nTạo một hàm preprocessing dùng chung cho cả offline evaluation và API. Sau đó:\n\n- lấy một ảnh từ `images.pkl`;\n- lưu tensor chuẩn từ dataloader;\n- xuất ảnh đó thành PNG;\n- gửi PNG qua API demo;\n- lấy tensor ngay trước model;\n- tính:\n\n$$ \\Delta = \\frac{1}{CHW} \\lVert X_{\\text{loader}}-X_{\\text{demo}} Vert_1 $$\n\nNếu shape khác, polarity khác hoặc $\\Delta$ lớn, hai pipeline chưa tương đương.\n\n### d. Kiểm thử hồi quy\n\nNên có test:\n\n```python\nassert model_input_from_api(test_png)\n       == model_input_from_dataset(test_png)\n```\n\nTrong thực tế có sai số interpolation, nên dùng `torch.allclose` với tolerance rõ ràng.\n\n### e. Cách trình bày trước hội đồng\n\n> **Hiện em tách core recognizer và app preprocessing. Em chỉ gọi chúng tương thích sau khi có parity test trên tensor. Nếu chưa làm parity test, em ghi đây là hạn chế triển khai, không nói demo dùng đúng preprocessing chỉ vì cùng resize.**\n\n## 2.3. Câu hỏi truy tiếp và cách trả lời\n\n**“Demo nhận ảnh CROHME tốt nhưng ảnh tự vẽ kém thì sao?”**\n\n> Khi ảnh CROHME đi qua chính API vẫn tốt, integration cơ bản đúng; phần còn lại nhiều khả năng là domain shift của nét và bố cục. Tuy vậy vẫn cần controlled perturbation để xác nhận.\n\n**“Có thể chỉ nhìn ảnh normalized để kết luận giống không?”**\n\n> Không. Hai ảnh nhìn giống nhưng range, antialiasing hoặc margin có thể khác. Bằng chứng tốt hơn là tensor statistics và output parity.\n\n## 2.4. Không nên nói\n\n- “Demo chắc chắn giống train.”\n- “Cùng kích thước là cùng phân bố.”\n- “Chỉ cần grayscale là đủ.”\n- “Ảnh render được bằng mắt nên model sẽ nhận được.”\n\n## 2.5. Bằng chứng cần chỉ ra\n\n- Pipeline dataloader trong `dataset.py`, `transforms.py`, `datamodule.py`.\n- Pipeline thực tế trong thư mục `App`.\n- Bộ parity tests và các ảnh `raw/crop/binary/resized/model_input`.\n\n---"}, {"global_id": 33, "local_id": 3, "priority": "ĐỎ", "title": "Việc cố định chiều cao ảnh ảnh hưởng thế nào đến các ký hiệu nhỏ như cận tích phân hoặc chỉ số?", "content": "## 3.1. Bản trả lời nhanh\n\n> **Khi biểu thức dài được co về một chiều cao cố định, toàn bộ ký hiệu cùng bị thu nhỏ. Cận tích phân, số mũ, chỉ số dưới và dấu chấm vốn chiếm ít pixel có thể chỉ còn vài pixel, bị interpolation làm mờ hoặc bị threshold xóa. Sau đó DenseNet còn downsample nhiều lần, nên tín hiệu nhỏ có thể mất trước khi đến GAT.**\n>\n> **Vì vậy không thể chỉ đổ cho decoder. Cần đo kích thước ký hiệu trước/sau resize và lưu feature hoặc accuracy riêng theo tỷ lệ kích thước.**\n\n## 3.2. Giải thích chi tiết\n\n### a. Tỷ lệ thu nhỏ\n\nNếu ảnh gốc cao $H_0$ và được đưa về $H_t$, hệ số:\n\n$$ s=\\frac{H_t}{H_0} $$\n\nMột cận cao $h_b$ pixel sẽ còn:\n\n$$ h_b'=s h_b $$\n\nNếu $h_b'$ chỉ còn 2–4 pixel, một lần downsampling stride 2 có thể làm biểu diễn gần biến mất.\n\n### b. Chuỗi downsampling trong DenseNet\n\nEncoder có:\n\n- convolution stride 2;\n- max pooling stride 2;\n- hai transition dùng average pooling 2.\n\nKích thước không gian giảm xấp xỉ nhiều lần. Chi tiết nhỏ có thể bị:\n\n- trộn với nền;\n- trộn với ký hiệu chính;\n- làm yếu contrast;\n- mất vị trí tương đối.\n\nGAT chỉ hoạt động sau DenseNet. Nó có thể truyền thông tin còn lại, nhưng không tái tạo chi tiết đã mất hoàn toàn.\n\n### c. Biểu thức dài và rộng đặc biệt nguy hiểm\n\nGiới hạn chiều rộng 1024 cũng có thể buộc ảnh rất dài thu nhỏ. Khi giữ tỷ lệ, chiều cao thực tế cũng giảm, dù chưa chạm giới hạn chiều cao.\n\nDo đó lỗi không chỉ phụ thuộc “fixed height”, mà phụ thuộc:\n\n- aspect ratio;\n- scale factor;\n- kích thước tuyệt đối của cận;\n- số bước downsampling;\n- threshold và interpolation.\n\n### d. Thí nghiệm cần làm\n\n1. Tách subset có superscript/subscript/integral bounds.\n2. Với mỗi ảnh, tính scale factor.\n3. Chia bin theo scale:\n   - không resize;\n   - $0.75  \\lt  s \\le 1$;\n   - $0.5  \\lt  s \\le 0.75$;\n   - $s \\le 0.5$.\n4. Tính ExpRate và recall của `_`, `^`.\n5. Lưu ảnh trước/sau preprocessing.\n6. Thử multi-scale inference hoặc tăng resolution.\n7. So sánh feature map của cận trước và sau từng block.\n\n### e. Giải pháp khả dĩ\n\n- giữ chiều cao lớn hơn;\n- adaptive resolution theo aspect ratio;\n- multi-scale encoder;\n- crop hoặc tile cho biểu thức rất dài;\n- tránh threshold quá mạnh;\n- auxiliary high-resolution branch;\n- augment riêng các cận nhỏ;\n- super-resolution chỉ khi có thí nghiệm kiểm chứng.\n\n## 3.4. Không nên nói\n\n- “Cận mất chắc chắn do dataset.”\n- “GAT sẽ khôi phục ký hiệu nhỏ.”\n- “Resize giữ tỷ lệ nên không mất thông tin.”\n- “Chỉ cần tăng chiều cao là chắc chắn tốt hơn.”\n\n## 3.5. Bằng chứng cần chỉ ra\n\n- Sơ đồ downsampling trong `encoder.py`.\n- Phân bố scale factor của dataset và demo.\n- Ảnh trước/sau resize của các trường hợp có cận.\n- Accuracy subset theo kích thước cận.\n\n---"}, {"global_id": 34, "local_id": 4, "priority": "ĐỎ", "title": "Token hóa LaTeX theo token, ký tự hay quy tắc nào?", "content": "## 4.1. Bản trả lời nhanh\n\n> **Repo không token hóa chuỗi LaTeX thô bằng một tokenizer động trong lúc train. `caption.txt` đã được tách sẵn bằng khoảng trắng; loader lấy token đầu làm image ID và phần còn lại là danh sách token. Vì vậy đơn vị đánh giá và học là token đã chuẩn bị, không phải từng ký tự Unicode.**\n>\n> **Ví dụ `\\frac`, `{`, `x`, `}`, `^` có thể là các token riêng. Muốn mô tả đầy đủ quy tắc token hóa gốc, em phải truy script tạo `caption.txt`; code hiện tại chỉ chứng minh cách đọc token đã tách.**\n\n## 4.2. Giải thích chi tiết\n\n### a. Token list trong loader\n\nMột dòng có dạng:\n\n```text\nimage_id \\frac { x } { y }\n```\n\nSau `split()`:\n\n```python\nimage_id = parts[0]\ntokens = parts[1:]\n```\n\nDo đó:\n\n- whitespace là ranh giới token trong file đã chuẩn bị;\n- macro như `\\frac` là một token;\n- `{` và `}` thường là token;\n- `^` và `_` là token cấu trúc;\n- ký tự nhiều chữ như `\\alpha` không bị tách từng chữ.\n\n### b. Không phải character-level thuần túy\n\nNếu character-level, `\\frac` sẽ thành các ký tự `\\`, `f`, `r`, `a`, `c`. Repo không làm vậy ở loader.\n\n### c. Không phải subword/BPE\n\nKhông có:\n\n- vocabulary learning BPE;\n- SentencePiece;\n- unigram tokenizer;\n- byte tokenizer.\n\nVocabulary được đọc từ `dictionary.txt`.\n\n### d. Tác động đến metric\n\nEdit distance được tính trên danh sách `pred` và `gt`, nên là token-level nếu hai biến đó vẫn là list token. Sai một macro `\\frac` tính như một phép thay thế token, không phải năm ký tự.\n\n### e. Cần audit tokenizer gốc\n\nNhững câu hỏi chưa được code loader trả lời:\n\n- `x^2` được canonicalize thành `x ^ { 2 }` hay không;\n- macro tương đương được đổi về cùng dạng không;\n- khoảng trắng trong `\\operatorname` xử lý thế nào;\n- alias như `\\lt` và `<` có thống nhất không.\n\nPhải truy script tạo data hoặc kiểm tra toàn bộ `caption.txt`.\n\n## 4.3. Câu hỏi truy tiếp và cách trả lời\n\n**“Một token có luôn tương ứng một ký hiệu trên ảnh không?”**\n\n> Không. `\\frac`, `{`, `}` hoặc token cấu trúc không nhất thiết có một glyph riêng; ngược lại một vùng ảnh có thể dẫn đến nhiều token cấu trúc.\n\n**“Edit distance là ký tự hay token?”**\n\n> Với code đang truyền list token vào `editdistance.eval`, đó là token-level. Cần xác nhận không có bước join chuỗi trước hàm.\n\n## 4.4. Không nên nói\n\n- “Token là từng ký tự.”\n- “Mỗi token là một bounding box.”\n- “Repo dùng BPE.”\n- “Tokenizer tự normalize mọi LaTeX tương đương.”\n\n## 4.5. Bằng chứng cần chỉ ra\n\n- `caption.txt` trong gói dữ liệu.\n- `extract_data()` hoặc loader đọc `split()`.\n- `vocab.py`.\n- `lit_tamer.py` nơi `pred` và `gt` được chuyển thành danh sách từ.\n\n---"}, {"global_id": 35, "local_id": 5, "priority": "ĐỎ", "title": "Các token đặc biệt như BOS, EOS, PAD và UNK có vai trò gì?", "content": "## 5.1. Bản trả lời nhanh\n\n> **Repo định nghĩa `<pad>` index 0, `<sos>` index 1 và `<eos>` index 2. `<sos>` khởi động quá trình giải mã; `<eos>` báo kết thúc; `<pad>` làm các chuỗi trong batch có cùng chiều dài và được mask trong loss/attention. Repo không định nghĩa `<unk>`.**\n>\n> **Vì không có UNK, token ngoài dictionary gây lỗi khi mã hóa nhãn và model cũng không thể sinh ký hiệu ngoài vocabulary 113 lớp.**\n\n## 5.2. Giải thích chi tiết\n\n### BOS/SOS\n\nBOS thường được gọi là beginning-of-sequence; repo dùng `<sos>`.\n\nDecoder autoregressive bắt đầu với:\n\n$$ y_0=\\langle sos angle $$\n\nrồi dự đoán token tiếp theo.\n\n### EOS\n\nKhi model dự đoán `<eos>`, hypothesis có thể dừng. Nếu EOS quá sớm:\n\n- chuỗi bị thiếu;\n- biểu thức dài bị cắt.\n\nNếu EOS quá muộn:\n\n- sinh token thừa;\n- chạm `max_len`.\n\n### PAD\n\nPAD dùng để:\n\n- pad target sequence;\n- tạo `tgt_key_padding_mask`;\n- bỏ vị trí padding khỏi loss nếu `ce_loss` cấu hình đúng;\n- không cho attention xem padding như token thật.\n\n### UNK\n\nRepo không có `<unk>` trong `CROHMEVocab`. `words2indices` dùng tra cứu trực tiếp:\n\n```python\nself.word2idx[w]\n```\n\nToken không tồn tại gây `KeyError`.\n\n### Ranh giới cần phân biệt\n\n- PAD là kỹ thuật batching, không phải token LaTeX.\n- SOS/EOS là control token, không render ra công thức.\n- UNK nếu có chỉ biểu diễn không biết, không giúp model nhận đúng ký hiệu mới.\n\n## 5.4. Không nên nói\n\n- “BOS và SOS là hai token khác nhau trong repo.”\n- “Có UNK.”\n- “PAD được tính như token đúng trong ExpRate.”\n- “EOS chỉ dùng khi train, không dùng inference.”\n\n## 5.5. Bằng chứng cần chỉ ra\n\n- `tamer/datamodule/vocab.py`.\n- `decoder.py`: target padding mask và beam search.\n- Hàm tạo target hai chiều và hàm loss.\n\n---"}, {"global_id": 36, "local_id": 6, "priority": "VÀNG", "title": "Nhãn LaTeX có được normalize trước khi train và đánh giá không?", "content": "## 6.1. Bản trả lời nhanh\n\n> **Nhãn trong `caption.txt` đã ở dạng token hóa/canonicalized nào đó, nhưng repo hiện không cho thấy một hàm normalize LaTeX được gọi ngay trước train hoặc trước Exact Match. Loader đọc token trực tiếp; evaluation so sequence index/token trực tiếp.**\n>\n> **Vì vậy em chỉ được nói model học và đánh giá trên biểu diễn đã có trong dataset. Muốn khẳng định normalize những gì, phải truy script tạo caption hoặc xây một normalizer được version hóa.**\n\n## 6.2. Giải thích chi tiết\n\n### Hai nghĩa của normalization\n\n1. **Dataset preparation normalization:** xảy ra trước khi repo đọc data.\n2. **Evaluation-time normalization:** chuyển prediction và GT về canonical form trước khi so.\n\nCode hiện tại chứng minh chắc phần đọc token; chưa chứng minh có normalizer semantic ở evaluation.\n\n### Hậu quả\n\nHai chuỗi render giống nhau nhưng token khác có thể bị tính sai. Ví dụ:\n\n```latex\nx ^ 2\n```\n\nvà:\n\n```latex\nx ^ { 2 }\n```\n\nNếu dataset protocol yêu cầu braces, chuỗi thứ nhất không match chuỗi thứ hai.\n\n### Cần xây normalization contract\n\nMột tài liệu phải nêu rõ:\n\n- bỏ hay giữ whitespace;\n- chuẩn hóa braces;\n- alias macro;\n- `\\left`/`\\right`;\n- `\\mathrm`/`\\operatorname`;\n- optional braces;\n- Unicode versus macro;\n- cách xử lý `\\!`, `\\,`;\n- thứ tự token.\n\n### Không nên normalize quá mức\n\nKhông được biến:\n\n```latex\nx + 1\n```\n\nthành tương đương đại số với:\n\n```latex\n1 + x\n```\n\nvì đó không còn là recognition exact match mà là symbolic equivalence.\n\n### Thực nghiệm nên báo cáo hai metric nếu cần\n\n- Protocol Exact Match: theo token benchmark.\n- Render/canonical equivalence: dùng parser/canonicalizer được định nghĩa riêng.\n\nKhông trộn hai metric.\n\n## 6.4. Không nên nói\n\n- “Mọi LaTeX tương đương đều được xem giống nhau.”\n- “Whitespace chắc chắn bị bỏ.”\n- “Exact Match đo tương đương toán học.”\n- “Có normalize vì caption đã token hóa.”\n\n## 6.5. Bằng chứng cần chỉ ra\n\n- Script tạo `caption.txt`, nếu tìm được.\n- Code `ExpRateRecorder`.\n- Một tài liệu `normalization_spec.md`.\n- Unit test với các cặp biểu diễn tương đương và không tương đương.\n\n---"}, {"global_id": 37, "local_id": 7, "priority": "VÀNG", "title": "Hai biểu diễn tương đương như x^2 và x^{2} được xem là giống hay khác?", "content": "## 7.1. Bản trả lời nhanh\n\n> **Theo Exact Match token-level, chúng chỉ được xem giống nếu bước chuẩn hóa biến cả hai về cùng chuỗi. Với pipeline hiện tại chưa thấy normalizer evaluation, nên nếu token sequence khác thì bị xem là khác, dù render giống.**\n>\n> **Em phải trả lời theo protocol, không theo cảm giác ngữ nghĩa. Có thể bổ sung canonical metric, nhưng metric benchmark chính vẫn phải giữ nhất quán với các nghiên cứu đối chứng.**\n\n## 7.2. Giải thích chi tiết\n\nGiả sử tokenizer tạo:\n\n```text\nx ^ 2\n```\n\nvà:\n\n```text\nx ^ { 2 }\n```\n\nHai dãy có độ dài khác nhau. Exact Match:\n\n$$ \\mathbf{1}[\\hat{Y}=Y] $$\n\nsẽ bằng 0 nếu không canonicalize.\n\n### Tại sao benchmark thường nghiêm?\n\n- giúp metric đơn giản và tái lập;\n- tránh parser khác nhau;\n- giữ đúng annotation protocol;\n- không cần quyết định tương đương semantic.\n\n### Nhưng có hạn chế\n\n- phạt sự khác biệt presentation không ảnh hưởng render;\n- làm score phụ thuộc canonicalization;\n- có thể đánh giá thấp khả năng sử dụng thực tế.\n\n### Cách xử lý tốt\n\nBáo cáo:\n\n1. token Exact Match chính thức;\n2. normalized Exact Match nếu có;\n3. syntax validity;\n4. rendered equivalence trên subset.\n\nNormalizer phải:\n\n- deterministic;\n- công khai;\n- áp dụng đồng đều cho prediction và GT;\n- không dùng thông tin ground truth để sửa prediction.\n\n## 7.4. Không nên nói\n\n- “Chắc chắn giống vì toán học giống.”\n- “Chắc chắn khác trong mọi benchmark.”\n- “Có thể sửa prediction theo GT trước khi chấm.”\n\n## 7.5. Bằng chứng cần chỉ ra\n\n- Ví dụ token thực tế trong `caption.txt`.\n- Output của `ExpRateRecorder`.\n- Unit test normalizer nếu bổ sung.\n\n---"}, {"global_id": 38, "local_id": 8, "priority": "VÀNG", "title": "Augmentation nào thật sự được áp dụng trong code, với xác suất và tham số bao nhiêu?", "content": "## 8.1. Bản trả lời nhanh\n\n> **Code dataset chỉ có một augmentation được khai báo rõ là `ScaleAugmentation` với hệ số trong khoảng 0,7–1,4, và chỉ áp dụng khi `is_train` cùng `scale_aug=True`. Tuy nhiên cấu hình CROHME hiện tại đặt `scale_aug: false`, nên run theo config đó không dùng scale augmentation.**\n>\n> **`ScaleToLimitRange` không nên gọi là augmentation ngẫu nhiên; đó là preprocessing giữ kích thước trong giới hạn. Repo không cho thấy random flip, rotation, Gaussian noise hoặc stroke-width augmentation trong pipeline train chính.**\n\n## 8.2. Giải thích chi tiết\n\n### Phân biệt augmentation và preprocessing\n\n**Augmentation:**\n\n- ngẫu nhiên;\n- chỉ train;\n- tạo biến thể cùng nhãn.\n\n**Preprocessing:**\n\n- deterministic;\n- train/val/test;\n- đưa dữ liệu vào miền kích thước hợp lệ.\n\nTrong code:\n\n```python\nif is_train and scale_aug:\n    ScaleAugmentation(0.7, 1.4)\n```\n\nsau đó:\n\n```python\nif scale_to_limit:\n    ScaleToLimitRange(...)\n```\n\n### Cần xác nhận distribution của ScaleAugmentation\n\nPhải đọc chính xác implementation để biết:\n\n- lấy uniform hay distribution khác;\n- luôn áp dụng hay có xác suất;\n- scale isotropic hay anisotropic;\n- interpolation.\n\nKhông nên tự nói xác suất 50% nếu code không có Bernoulli.\n\n### Config hiện tại\n\n```yaml\nscale_aug: false\nscale_to_limit: true\n```\n\nVì vậy khi mô tả run M1–M5 phải lấy config lưu cùng run; config main có thể không phản ánh override trên Kaggle.\n\n### Vì sao điều này quan trọng?\n\nNếu demo có domain shift nét và scale nhưng train không augment, khả năng tổng quát ngoài benchmark có thể thấp.\n\n## 8.4. Không nên nói\n\n- “Có augmentation mạnh.”\n- “Dùng lật ngang, noise, rotation.”\n- “ScaleToLimitRange là augmentation.”\n- “Scale augmentation chắc chắn chạy trong M1–M5” nếu config run chưa đối chiếu.\n\n## 8.5. Bằng chứng cần chỉ ra\n\n- `dataset.py`.\n- `transforms.py`.\n- `config/crohme.yaml` của từng run trong `KetQua`.\n- Log hyperparameter được lưu cùng checkpoint.\n\n---"}, {"global_id": 39, "local_id": 9, "priority": "VÀNG", "title": "Vì sao một số augmentation như lật ngang có thể không phù hợp với biểu thức toán học?", "content": "## 9.1. Bản trả lời nhanh\n\n> **Augmentation chỉ hợp lệ khi phép biến đổi bảo toàn nhãn. Lật ngang thường không bảo toàn biểu thức: thứ tự trái–phải bị đảo, dấu ngoặc đổi hướng, ký hiệu bất đối xứng thay đổi và bố cục của hàm hoặc giới hạn bị phá. Nếu vẫn giữ nguyên LaTeX thì tạo cặp ảnh–nhãn sai.**\n>\n> **Chỉ nên dùng biến đổi bảo toàn ngữ nghĩa đã được kiểm chứng, như scale nhẹ, affine nhỏ, thay đổi độ dày nét hoặc nhiễu vừa phải.**\n\n## 9.2. Giải thích chi tiết\n\n### Điều kiện của augmentation hợp lệ\n\nVới phép biến đổi $T$:\n\n$$ Y(T(X)) = Y(X) $$\n\nNếu điều này không đúng, augmentation làm hỏng supervision.\n\n### Lật ngang gây gì?\n\n- chuỗi đọc trái sang phải bị đảo;\n- `(` thành hình giống `)`;\n- `<` thành `>`;\n- vị trí chỉ số có thể chuyển phía;\n- các macro không còn tương ứng;\n- phân bố không giống cách con người viết.\n\n### Lật dọc còn nguy hiểm hơn\n\n- superscript thành subscript;\n- tử và mẫu đổi vị trí;\n- cận trên thành cận dưới.\n\n### Những biến đổi có thể phù hợp hơn\n\n- scale isotropic nhẹ;\n- translation trong canvas;\n- shear/rotation rất nhỏ;\n- elastic distortion có giới hạn;\n- stroke width;\n- blur/noise nhẹ;\n- random erasing rất thận trọng;\n- synthetic handwriting styles.\n\nMỗi augmentation cần test label preservation và ablation.\n\n### Không phải augmentation càng mạnh càng tốt\n\nMột augmentation làm ảnh đa dạng nhưng lệch quy luật toán học có thể:\n\n- làm loss khó giảm;\n- giảm Exact Match;\n- khiến model học invariance sai;\n- xóa positional cues quan trọng.\n\n## 9.4. Không nên nói\n\n- “Flip luôn giúp tăng dữ liệu.”\n- “Ảnh toán học cũng giống ảnh vật thể nên dùng augmentation ImageNet.”\n- “Lật rồi đảo chuỗi LaTeX là đủ” — nhiều cấu trúc không đơn giản như đảo token.\n\n## 9.5. Bằng chứng cần chỉ ra\n\n- Ví dụ trực quan 5 công thức trước/sau flip.\n- Ablation từng augmentation.\n- Kiểm tra bằng renderer/parser xem nhãn có còn phù hợp.\n\n---"}, {"global_id": 40, "local_id": 10, "priority": "BẪY", "title": "Nếu cận trên hoặc cận dưới biến mất sau resize, lỗi nên được quy cho dataset, preprocessing hay mô hình?", "content": "## 10.1. Bản trả lời nhanh\n\n> **Không nên quy ngay cho một phía. Nếu cận tồn tại trong ảnh và nhãn gốc nhưng biến mất ở ảnh sau preprocessing, lỗi trực tiếp thuộc preprocessing; dataset chỉ góp phần nếu cấu trúc quá hiếm hoặc ảnh gốc đã quá nhỏ. Nếu cận vẫn rõ trong tensor nhưng model không sinh được, lỗi nghiêng về representation hoặc decoder.**\n>\n> **Cần chẩn đoán theo chuỗi bằng chứng: ảnh gốc → ảnh sau transform → feature map → beam output → token error.**\n\n## 10.2. Giải thích chi tiết\n\n### Ma trận quy trách nhiệm\n\n| Quan sát | Nguyên nhân chính cần nghi |\n|---|---|\n| Ảnh gốc không có/nhãn sai | Dataset annotation |\n| Ảnh gốc có, sau resize mất | Preprocessing |\n| Sau resize rõ, feature không phản ứng | Encoder/downsampling |\n| Feature có tín hiệu, decoder bỏ `_`/`^` | Decoder/language bias |\n| Train hầu như không có mẫu tương tự | Data imbalance |\n| Chỉ demo sai, benchmark subset tốt | Domain shift/integration |\n\n### Quy trình kiểm chứng\n\n1. Mở ảnh và caption gốc.\n2. Lưu ảnh sau từng transform.\n3. Zoom cận và đo foreground pixels.\n4. So sánh activation hoặc saliency vùng cận.\n5. Xem top-k beam:\n   - có hypothesis đúng cận nhưng score thấp không;\n   - hay tất cả hypothesis đều bỏ cận.\n6. Tính accuracy subset tích phân hai cận.\n7. Thử tăng resolution mà giữ nguyên checkpoint, sau đó retrain nếu cần.\n\n### Phân biệt nguyên nhân trực tiếp và nguyên nhân gốc\n\nVí dụ preprocessing xóa cận là nguyên nhân trực tiếp. Nhưng nguyên nhân gốc có thể là:\n\n- app resize khác train;\n- ảnh quá dài;\n- threshold không phù hợp;\n- thiết kế resolution không đủ.\n\nCâu trả lời tốt cần nêu cả hai tầng.\n\n## 10.4. Không nên nói\n\n- “Dataset không có.”\n- “Model không học.”\n- “Người dùng viết nhỏ.”\n- “Resize giữ tỷ lệ nên chắc chắn không mất.”\n\n## 10.5. Bằng chứng cần chỉ ra\n\n- Bộ ảnh forensic trước/sau.\n- Pixel/foreground statistics.\n- Activation map.\n- Token-level error và beam candidates.\n- Tần suất cấu trúc trong train.\n\n---"}], "extras": [{"title": "Phụ lục A — Checklist parity train/test/demo", "content": "- [ ] Cùng số kênh.\n- [ ] Cùng polarity.\n- [ ] Cùng range và dtype.\n- [ ] Cùng quy tắc resize.\n- [ ] Cùng cách giữ tỷ lệ.\n- [ ] Cùng padding và vị trí đặt ảnh.\n- [ ] Cùng mask.\n- [ ] Không có threshold riêng làm mất nét.\n- [ ] Test tensor parity bằng code.\n- [ ] Lưu ảnh trung gian cho mọi lỗi demo quan trọng."}, {"title": "Phụ lục B — Nguồn đối chiếu", "content": "- `tamer/datamodule/dataset.py`\n- `tamer/datamodule/transforms.py`\n- `tamer/datamodule/datamodule.py`\n- `tamer/datamodule/vocab.py`\n- `tamer/model/encoder.py`\n- `tamer/model/decoder.py`\n- các file preprocessing thực tế trong `App`"}]}, {"group_id": 5, "title": "Kiến trúc tổng thể của hệ thống", "intro": "# NHÓM 5 — KIẾN TRÚC TỔNG THỂ CỦA HỆ THỐNG\n\n> **Mục tiêu nhóm:** Có thể mô tả đúng pipeline trong repo từ tensor ảnh đến chuỗi LaTeX, không lẫn với symbol graph của chuyên đề cũ.\n\n## Câu chuyện kiến trúc phải thống nhất\n\nTên pipeline nên dùng:\n\n> **DenseNet visual encoder → feature-grid graph → Coordinate-Aware GAT → 2D positional encoding → Transformer decoder → LaTeX.**\n\nKhông dùng sơ đồ detector/symbol graph của chuyên đề cũ để mô tả code hiện tại.\n\n---", "questions": [{"global_id": 41, "local_id": 1, "priority": "ĐỎ", "title": "Hãy mô tả toàn bộ pipeline hiện tại từ ảnh đầu vào đến chuỗi LaTeX đầu ra.", "content": "## 1.1. Bản trả lời nhanh\n\n> **Ảnh raster một kênh và mask được đưa vào DenseNet. DenseNet downsample và trích xuất feature map, sau đó một convolution $1\\times1$ chiếu số kênh về `d_model=256`. Feature map được đổi từ `[B,D,H,W]` sang `[B,H,W,D]`, flatten thành $N=H\\times W$ node, xây graph lưới và chạy GAT có residual. Sau GAT, model thêm positional encoding 2D, rồi Transformer Decoder cross-attend vào memory ảnh và sinh token LaTeX.**\n>\n> **Khi train, decoder nhận target prefix và tối ưu cross-entropy cộng structure loss phụ trợ. Khi đánh giá, model dùng bidirectional beam search với beam size 10 và max length 150.**\n\n## 1.2. Giải thích chi tiết\n\n### Pipeline shape-aware\n\n```text\nInput image: [B,1,H0,W0]\nInput mask : [B,H0,W0]\n        ↓\nDenseNet-B\n        ↓\nVisual feature: [B,C,Hf,Wf]\nFeature mask  : [B,Hf,Wf]\n        ↓\n1×1 projection\n        ↓\n[B,256,Hf,Wf]\n        ↓ rearrange\n[B,Hf,Wf,256]\n        ↓ flatten\n[B,N,256], N=Hf×Wf\n        ↓\n8-connected adjacency + self-loop + padding mask\n        ↓\nGAT\n        ↓\nResidual: H + GAT(H)\n        ↓\nLayerNorm\n        ↓\n2D absolute positional encoding\n        ↓\nLayerNorm\n        ↓\nTransformer Decoder memory\n        ↓\nAutoregressive token distribution\n        ↓\nBeam search\n        ↓\nLaTeX token sequence\n```\n\n### Training path\n\nModel tạo target hai chiều trong TAMER, nhân đôi feature và mask để phục vụ bidirectional target. Loss chính:\n\n$$ \\mathcal{L}_{seq} = -\\sum_t \\log p(y_t \\mid y_{ \\lt t},X) $$\n\nNgoài ra decoder tạo `sim` và code tính:\n\n$$ \\mathcal{L} = \\mathcal{L}_{seq} + \\mathcal{L}_{struct} $$\n\nKhông nên gọi `struct_loss` là edge classification của graph nếu code không làm vậy.\n\n### Inference path\n\nEncoder chỉ chạy một lần. Decoder beam search giữ nhiều hypothesis, dùng các tham số:\n\n- beam size 10;\n- max length 150;\n- alpha 1.0;\n- temperature 1.0;\n- `early_stopping: false` trong config.\n\n### Sản phẩm cuối\n\nChuỗi index được đổi về token bằng vocabulary rồi join để lưu/hiển thị. Model không xuất bounding box hoặc graph ký hiệu.\n\n## 1.4. Không nên nói\n\n- “Ảnh → detector → symbol graph.”\n- “GAT thay Transformer Decoder.”\n- “Đầu ra là cây cú pháp.”\n- “Mỗi node là một ký hiệu.”\n\n## 1.5. Bằng chứng cần chỉ ra\n\n- `encoder.py`: DenseNet, projection, GAT, residual, PE.\n- `tamer.py`: encoder–decoder và beam search.\n- `decoder.py`: embedding, causal mask, cross-attention, projection.\n- `lit_tamer.py`: loss và evaluation.\n\n---"}, {"global_id": 42, "local_id": 2, "priority": "ĐỎ", "title": "CNN/DenseNet trong repo có nhiệm vụ gì và đầu ra có kích thước như thế nào?", "content": "## 2.1. Bản trả lời nhanh\n\n> **DenseNet biến ảnh pixel thành feature map thị giác có độ phân giải thấp hơn và số kênh giàu hơn. Nó học nét, góc, đường cong, hình dạng và ngữ cảnh cục bộ. Sau DenseNet, convolution $1\\times1$ chiếu số kênh về `d_model=256`; output encoder trước GAT có dạng `[B,Hf,Wf,256]`.**\n>\n> **$H_f,W_f$ phụ thuộc kích thước ảnh và các bước stride/pooling, không phải một hằng số. Theo cấu trúc hiện tại, spatial size giảm qua convolution stride 2, max pooling và hai transition pooling.**\n\n## 2.2. Giải thích chi tiết\n\nDenseNet dùng dense connectivity:\n\n$$ x_l=H_l([x_0,x_1,\\ldots,x_{l-1}]) $$\n\nMỗi block nối feature cũ với feature mới theo channel, giúp:\n\n- tái sử dụng đặc trưng;\n- cải thiện gradient flow;\n- giữ cả low-level và high-level cues.\n\nConfig:\n\n- growth rate 24;\n- `num_layers=16` cho mỗi dense block theo implementation;\n- convolution đầu vào 1 channel;\n- projection cuối về 256.\n\n### Kích thước không gian\n\nSpatial size giảm bởi:\n\n1. conv stride 2;\n2. max pool 2;\n3. transition 1 average pool 2;\n4. transition 2 average pool 2.\n\nXấp xỉ tổng downsampling khoảng 16 lần mỗi chiều, nhưng `ceil_mode=True` khiến công thức cần dùng ceil tại từng bước.\n\nNếu
