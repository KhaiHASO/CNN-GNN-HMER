 input $H_0 \\times W_0$, có thể biểu diễn gần đúng:\n\n$$ H_f \\approx \\left\\lceil\\frac{H_0}{16}\\right\\rceil, \\quad W_f \\approx \\left\\lceil\\frac{W_0}{16}\\right\\rceil $$\n\nCần dùng một forward hook để ghi shape thật.\n\n### Ý nghĩa của projection 1×1\n\nDenseNet output channel không nhất thiết bằng `d_model`. Convolution $1\\times1$:\n\n- không thay đổi spatial size;\n- trộn channel;\n- đưa feature về cùng chiều với GAT và decoder.\n\n## 2.4. Không nên nói\n\n- “DenseNet phát hiện từng symbol.”\n- “Output luôn có kích thước cố định.”\n- “Mỗi feature cell tương ứng đúng một pixel.”\n- “Downsampling không ảnh hưởng ký hiệu nhỏ.”\n\n## 2.5. Bằng chứng cần chỉ ra\n\n- `encoder.py`: `DenseNet`, `_Transition`, `feature_proj`.\n- Log shape cho 5 kích thước ảnh đại diện.\n\n---"}, {"global_id": 43, "local_id": 3, "priority": "ĐỎ", "title": "Node trong graph hiện tại là ký hiệu, bounding box, pixel hay một ô trên feature map?", "content": "## 3.1. Bản trả lời nhanh\n\n> **Node là một vector đặc trưng tại một ô của feature map sau DenseNet và projection. Nó không phải ký hiệu đã được phân đoạn, không phải bounding box và cũng không phải pixel ảnh gốc.**\n>\n> **Mỗi node có chiều 256 và receptive field bao phủ một vùng ảnh gốc. Một ký hiệu có thể trải trên nhiều node; một node cũng có thể chứa nét của nhiều ký hiệu gần nhau.**\n\n## 3.2. Giải thích chi tiết\n\nFeature map:\n\n$$ F \\in \\mathbb{R}^{B\\times H_f\\times W_f\\times D} $$\n\nFlatten row-major:\n\n$$ H \\in \\mathbb{R}^{B\\times N\\times D}, \\quad N=H_fW_f $$\n\nNode $i$ được ánh xạ từ tọa độ:\n\n$$ y=\\left\\lfloor\\frac{i}{W_f}\\right\\rfloor, \\quad x=i\\bmod W_f $$\n\nNode feature chứa representation CNN của vùng receptive field. Nó không có:\n\n- class symbol tường minh;\n- bounding box;\n- confidence detection;\n- edge label superscript;\n- ID ký hiệu.\n\n### Hệ quả\n\nKhông thể trực tiếp hỏi:\n\n> “Node này là chữ x hay số 2?”\n\ntrừ khi thêm probe hoặc visualization.\n\nGraph hiện tại là latent feature graph. Nó học representation hỗ trợ decoder, không cung cấp giải thích symbol-level.\n\n## 3.4. Không nên nói\n\n- “Node là pixel.”\n- “Node là ký hiệu.”\n- “Một node luôn tương ứng một ký hiệu.”\n- “Graph có ground-truth node label.”\n\n## 3.5. Bằng chứng cần chỉ ra\n\n- `feature.view(b, h*w, d)` trong `encoder.py`.\n- Không có symbol detector/bounding box trong pipeline.\n\n---"}, {"global_id": 44, "local_id": 4, "priority": "ĐỎ", "title": "Decoder nhận đầu vào gì từ encoder và sinh token theo cơ chế nào?", "content": "## 4.1. Bản trả lời nhanh\n\n> **Decoder nhận memory ảnh dạng `[B,Hf,Wf,D]` cùng mask. Nó flatten memory thành chuỗi $H_fW_f$ vector, embedding các target token, thêm word positional encoding và dùng causal self-attention cùng cross-attention tới memory ảnh. Cuối mỗi bước, linear projection tạo phân bố trên 113 token.**\n>\n> **Khi train, decoder dùng prefix ground truth; khi inference, beam search tự dùng token đã sinh.**\n\n## 4.2. Giải thích chi tiết\n\n### Memory ảnh\n\n```python\nsrc = rearrange(src, \"b h w d -> (h w) b d\")\nsrc_mask = rearrange(src_mask, \"b h w -> b (h w)\")\n```\n\n### Target branch\n\n- token embedding;\n- LayerNorm;\n- word positional encoding;\n- causal mask;\n- target padding mask.\n\nCausal mask đảm bảo bước $t$ không nhìn token tương lai.\n\n### Xác suất token\n\n$$ p(y_t \\mid y_{ \\lt t},X) = \\operatorname{softmax}(W_o z_t+b_o) $$\n\nvới vocabulary 113.\n\n### Cross-attention\n\nQuery đến từ trạng thái decoder; key/value đến từ memory ảnh. Decoder học alignment giữa token đang sinh và vùng feature.\n\n### Coverage/refinement\n\nConfig bật `cross_coverage` và `self_coverage`. Đây là phần TAMER hỗ trợ tinh chỉnh attention, không nên bỏ qua khi mô tả baseline.\n\n### Train–test gap\n\nTrain dùng ground-truth prefix, inference dùng prediction prefix. Sai token sớm có thể lan sang các token sau; đây là exposure bias của autoregressive decoding.\n\n## 4.4. Không nên nói\n\n- “Decoder đọc graph trực tiếp dưới dạng edge list.”\n- “Decoder sinh cả chuỗi một lần.”\n- “Beam search được dùng trong training loss.”\n- “Cross-attention tự động đảm bảo cú pháp.”\n\n## 4.5. Bằng chứng cần chỉ ra\n\n- `decoder.py`.\n- `tamer.py`.\n- `lit_tamer.py`.\n\n---"}, {"global_id": 45, "local_id": 5, "priority": "ĐỎ", "title": "Mô hình hiện tại có thật sự phát hiện và phân đoạn từng ký hiệu hay không?", "content": "## 5.1. Bản trả lời nhanh\n\n> **Không. Core recognizer hiện tại không có object detector, bounding box prediction, NMS hay loss detection. Nó mã hóa toàn ảnh thành feature map và sinh LaTeX end-to-end.**\n>\n> **Vì vậy không được báo cáo detection precision/recall/F1 hoặc nói model xây symbol graph, trừ khi bổ sung một detector độc lập và đánh giá riêng.**\n\n## 5.2. Giải thích chi tiết\n\nDấu hiệu của detector thường gồm:\n\n- box regression;\n- class logits theo box;\n- anchors/queries;\n- IoU;\n- NMS;\n- ground-truth bounding boxes;\n- detection loss.\n\nRepo core không có chuỗi đó.\n\nDenseNet không “phát hiện symbol” theo nghĩa object detection. Nó có thể học feature phản ứng với ký hiệu, nhưng không xuất vị trí tường minh.\n\n### End-to-end không phân đoạn\n\nƯu điểm:\n\n- tránh lỗi phân đoạn tích lũy;\n- không cần box annotation;\n- pipeline gọn.\n\nNhược điểm:\n\n- khó giải thích lỗi symbol;\n- không có node symbol rõ;\n- khó dùng edge relation tường minh;\n- khó tách symbol recognition và structure parsing.\n\n## 5.4. Không nên nói\n\n- “DenseNet tự tạo bounding box.”\n- “Node graph chính là symbol detector output.”\n- “F1 detection của model là ...” nếu chưa có.\n\n## 5.5. Bằng chứng cần chỉ ra\n\n- Danh sách module và loss trong repo.\n- Không có annotation bounding box trong dataloader.\n\n---"}, {"global_id": 46, "local_id": 6, "priority": "VÀNG", "title": "Vì sao dùng DenseNet hoặc backbone hiện tại thay vì ResNet, ViT hay CNN đơn giản hơn?", "content": "## 6.1. Bản trả lời nhanh\n\n> **DenseNet là backbone gốc mạnh và đã được dùng rộng trong HMER vì tái sử dụng feature, giữ gradient tốt và tạo feature map dày đặc cho ký hiệu nhỏ. Giữ DenseNet còn giúp cô lập tác động của GAT khi so M1–M5.**\n>\n> **Điều này không chứng minh DenseNet tối ưu hơn ResNet hoặc ViT. Muốn khẳng định, cần backbone ablation với cùng decoder, budget và preprocessing.**\n\n## 6.2. Giải thích chi tiết\n\n### Lý do phương pháp luận\n\nMục tiêu của luận văn là GAT/position. Nếu đồng thời đổi backbone:\n\n- khó biết cải thiện đến từ đâu;\n- mất baseline công bằng;\n- tăng không gian hyperparameter.\n\n### Lý do kỹ thuật\n\nDense connectivity:\n\n- feature reuse;\n- gradient flow;\n- low-level stroke cues vẫn truyền sâu;\n- phù hợp data tương đối nhỏ.\n\n### So với ResNet\n\nResNet dùng additive skip; có thể:\n\n- hiệu quả hơn;\n- dễ dùng pretrained weights;\n- có feature hierarchy khác.\n\nChưa có thí nghiệm nên không xếp hạng.\n\n### So với ViT\n\nViT:\n\n- global self-attention;\n- cần patch/token positional design;\n- thường cần dữ liệu/pretraining lớn;\n- có thể trùng vai trò với GAT.\n\n### So với CNN đơn giản\n\nCNN nhỏ:\n\n- nhanh hơn;\n- ít overfit;\n- nhưng có thể thiếu capacity.\n\n### Thí nghiệm công bằng\n\nGiữ:\n\n- output resolution;\n- d_model;\n- parameter count gần nhau;\n- decoder;\n- train budget;\n- seed;\n- preprocessing.\n\n## 6.4. Không nên nói\n\n- “DenseNet tốt nhất.”\n- “ResNet làm mất feature.”\n- “ViT không phù hợp HMER.”\n- “Dùng DenseNet vì paper dùng” mà không nói control rationale.\n\n## 6.5. Bằng chứng cần chỉ ra\n\n- Baseline M1.\n- Parameter count và shape.\n- Backbone ablation nếu có.\n\n---"}, {"global_id": 47, "local_id": 7, "priority": "VÀNG", "title": "Feature map được flatten hoặc sắp xếp thành chuỗi/graph theo thứ tự nào?", "content": "## 7.1. Bản trả lời nhanh\n\n> **Code rearrange feature thành `[B,H,W,D]` rồi dùng `view(B,H*W,D)`, nên node được sắp theo row-major: đi từ trái sang phải trong một hàng, rồi xuống hàng tiếp theo. Node index $i=yW+x$.**\n>\n> **Sau GAT, feature được reshape lại đúng $H\\times W$ trước khi thêm 2D positional encoding và đưa cho decoder.**\n\n## 7.2. Giải thích chi tiết\n\nÁnh xạ:\n\n$$ i=yW+x $$\n\nNgược lại:\n\n$$ y=\\lfloor i/W\\rfloor, \\quad x=i\\bmod W $$\n\nAdjacency dùng chính mapping này để tìm:\n\n- phải: $i+1$;\n- xuống: $i+W$;\n- chéo phải dưới: $i+W+1$;\n- chéo trái dưới: $i+W-1$.\n\nSau đó thêm cạnh ngược để graph đối xứng.\n\n### Tại sao thứ tự flatten quan trọng?\n\n- relative position index phụ thuộc mapping;\n- decoder flatten memory cũng theo row-major;\n- mask phải cùng thứ tự;\n- sai reshape sẽ nối nhầm node.\n\n### Cần unit test\n\nVới grid $2\\times3$, in node ID:\n\n```text\n0 1 2\n3 4 5\n```\n\nKiểm tra adjacency và relative direction bằng tay.\n\n## 7.4. Không nên nói\n\n- “Flatten tùy ý.”\n- “Thứ tự không quan trọng vì có PE.”\n- “Graph tự biết tọa độ mà không cần H,W.”\n\n## 7.5. Bằng chứng cần chỉ ra\n\n- `rearrange` và `view` trong `encoder.py`.\n- `_build_grid_adjacency`.\n- `decoder.py` flatten memory.\n\n---"}, {"global_id": 48, "local_id": 8, "priority": "VÀNG", "title": "Thông tin padding và mask được truyền qua encoder và decoder như thế nào?", "content": "## 8.1. Bản trả lời nhanh\n\n> **Mask ban đầu đánh dấu vùng padding của ảnh. DenseNet downsample mask song song với các bước stride/pooling. Encoder dùng mask đã giảm kích thước để xóa cạnh tới node padding trong adjacency. Decoder flatten mask thành `memory_key_padding_mask`, nên cross-attention không xem vùng padding như memory hợp lệ. Target có mask riêng dựa trên PAD token.**\n>\n> **Self-loop được tái áp dụng cả cho node padding để tránh một hàng attention toàn $-\\infty$ gây NaN, nhưng decoder vẫn mask các node đó ở memory.**\n\n## 8.2. Giải thích chi tiết\n\n### Image mask\n\nQuy ước code:\n\n- 0: valid;\n- 1: padding.\n\nMask được lấy mẫu cách 2 sau conv/pool để theo spatial feature.\n\n### Graph mask\n\nAdjacency ban đầu giống nhau cho mọi sample cùng shape. Sau đó:\n\n- xóa hàng của node padding;\n- xóa cột của node padding;\n- tái thêm diagonal self-loop.\n\nMục tiêu:\n\n- valid node không nhận message từ padding;\n- tránh softmax trên hàng không có cạnh.\n\n### Decoder memory mask\n\n```python\nmemory_key_padding_mask = src_mask\n```\n\nCross-attention bỏ memory padding.\n\n### Target mask\n\n```python\ntgt_pad_mask = tgt == PAD_IDX\n```\n\nCausal mask và padding mask làm hai việc khác nhau:\n\n- causal: không nhìn tương lai;\n- padding: không nhìn token giả.\n\n### Rủi ro cần kiểm tra\n\n- downsample mask bằng slicing có khớp chính xác `ceil_mode` không;\n- self-loop padding có tạo feature không mong muốn trước decoder mask không;\n- BatchNorm/CNN vẫn xử lý pixel pad trước mask.\n\n## 8.4. Không nên nói\n\n- “Mask được dùng từ pixel đầu tiên để CNN bỏ padding hoàn toàn.”\n- “Self-loop padding là lỗi chắc chắn.”\n- “Causal mask và padding mask là một.”\n\n## 8.5. Bằng chứng cần chỉ ra\n\n- `datamodule.py`.\n- `DenseNet.forward`.\n- `_build_grid_adjacency`.\n- `decoder.py`.\n\n---"}, {"global_id": 49, "local_id": 9, "priority": "VÀNG", "title": "Điểm nghẽn tính toán và bộ nhớ lớn nhất của pipeline nằm ở module nào?", "content": "## 9.1. Bản trả lời nhanh\n\n> **Ứng viên lớn nhất là attention có tensor bậc hai theo số node: GAT tạo score `[B,heads,N,N]`, và Transformer decoder cross-attend giữa token và $N$ memory positions. Dù graph logic chỉ có tối đa 8 láng giềng, implementation hiện vẫn tính ma trận $N\\times N$ rồi mask, nên chưa tận dụng sparse computation.**\n>\n> **Beam search còn nhân chi phí decoder theo beam size 10. Muốn kết luận định lượng phải profile peak VRAM và thời gian từng module.**\n\n## 9.2. Giải thích chi tiết\n\n### GAT complexity\n\n$N=H_fW_f$.\n\nAttention score:\n\n$$ O(BKN^2) $$\n\nbộ nhớ gần:\n\n$$ B\\times K\\times N\\times N $$\n\nDù số edge hợp lệ $E\\approx9N$, code dense vẫn cấp phát toàn cặp.\n\n### Decoder\n\nSelf-attention target:\n\n$$ O(L^2) $$\n\nCross-attention:\n\n$$ O(LN) $$\n\nBeam search gần tăng theo beam size, dù có cache hay batching.\n\n### CNN\n\nDenseNet có nhiều convolution và activation, đặc biệt ở high-resolution stage. Khi train, activation phải giữ cho backward.\n\n### Cách profile\n\n- `torch.profiler`;\n- `torch.cuda.max_memory_allocated`;\n- NVTX range;\n- batch theo aspect ratio;\n- benchmark input ngắn/dài.\n\nBáo cáo:\n\n| Module | ms/sample | Peak VRAM | % time |\n|---|---:|---:|---:|\n| Preprocess | | | |\n| DenseNet | | | |\n| Graph build | | | |\n| GAT | | | |\n| Decoder greedy | | | |\n| Decoder beam 10 | | | |\n\n### Hướng tối ưu\n\n- sparse GAT edge list;\n- local-window tensor;\n- flash attention nếu phù hợp;\n- cache relative index;\n- dynamic beam;\n- quantization;\n- lower-resolution có kiểm soát.\n\n## 9.4. Không nên nói\n\n- “Graph thưa nên GAT là $O(N)$ trong code hiện tại.”\n- “DenseNet chắc chắn là bottleneck.”\n- “Beam search không ảnh hưởng latency.”\n\n## 9.5. Bằng chứng cần chỉ ra\n\n- Shape `e=[B,K,N,N]` trong `gat.py`.\n- Profile thực tế trên GPU dùng triển khai.\n\n---"}, {"global_id": 50, "local_id": 10, "priority": "BẪY", "title": "Nếu không có symbol detector, có được gọi graph hiện tại là Symbol Layout Graph hay không?", "content": "## 10.1. Bản trả lời nhanh\n\n> **Không nên. Symbol Layout Graph hàm ý node là ký hiệu và edge là quan hệ bố cục giữa ký hiệu. Graph hiện tại có node là feature cell và edge là lân cận grid. Tên chính xác là feature-grid graph, spatial feature graph hoặc 8-connected graph trên feature map.**\n>\n> **Gọi sai sẽ khiến hội đồng hỏi bounding box, node label và edge relation mà code không có.**\n\n## 10.2. Giải thích chi tiết\n\n### Điều kiện để gọi Symbol Layout Graph\n\nThông thường cần:\n\n- symbol instances;\n- bounding box hoặc stroke grouping;\n- node identity;\n- relation label như right/sup/sub/above/below/inside;\n- graph construction theo geometry của symbol.\n\nGraph hiện tại chỉ có:\n\n- tọa độ grid;\n- feature vector;\n- 8-neighbor;\n- self-loop;\n- relative direction 9 trạng thái.\n\nNó có thể hỗ trợ học layout một cách ẩn, nhưng không phải layout graph tường minh.\n\n### Tên gọi nên thống nhất\n\nTrong luận văn và slide:\n\n> **Feature-Grid Graph trên feature map DenseNet**\n\nLần đầu định nghĩa:\n\n> Mỗi vị trí không gian trên feature map là một node; các node kề theo 8 hướng được nối cạnh.\n\n### Symbol-level graph là hướng phát triển\n\nCó thể nói:\n\n> Trong tương lai, detector/segmenter sẽ tạo symbol nodes và relation classifier tạo semantic edges.\n\n## 10.4. Không nên nói\n\n- “Symbol graph nhưng node là feature.”\n- “Edge above/below” khi chỉ có dy/dx.\n- “GAT phân loại quan hệ symbol.”\n\n## 10.5. Bằng chứng cần chỉ ra\n\n- `encoder.py`, `gat.py`.\n- So sánh sơ đồ chuyên đề cũ và repo mới.\n\n---"}], "extras": [{"title": "Phụ lục — Shape table nên có trong slide", "content": "| Bước | Shape |\n|---|---|\n| Ảnh | `[B,1,H0,W0]` |\n| Mask ảnh | `[B,H0,W0]` |\n| DenseNet output | `[B,C,Hf,Wf]` |\n| Projection | `[B,256,Hf,Wf]` |\n| Grid feature | `[B,Hf,Wf,256]` |\n| Node feature | `[B,N,256]` |\n| Adjacency | `[B,N,N]` |\n| Decoder memory | `[Hf*Wf,B,256]` |\n| Token logits | `[B,L,113]` |"}, {"title": "Nguồn đối chiếu", "content": "- `tamer/model/encoder.py`\n- `tamer/model/gat.py`\n- `tamer/model/decoder.py`\n- `tamer/model/tamer.py`\n- `tamer/lit_tamer.py`\n- `config/crohme.yaml`"}]}, {"group_id": 6, "title": "Graph, GNN, GAT và thuật toán xây dựng đồ thị", "intro": "# NHÓM 6 — GRAPH, GNN, GAT VÀ THUẬT TOÁN XÂY DỰNG ĐỒ THỊ\n\n> **Mục tiêu nhóm:** Hiểu chính xác graph là gì, được tạo ra thế nào, message passing hoạt động ra sao và giới hạn của thiết kế hiện tại.\n\n## Định nghĩa graph chính xác\n\nGraph của repo là **8-connected feature-grid graph**:\n\n- node: feature cell sau DenseNet;\n- edge: neighborhood hình học;\n- node count: $N=H_fW_f$;\n- semantic relation: không được gán tường minh;\n- implementation attention: dense $N\\times N$ rồi mask.\n\n---", "questions": [{"global_id": 51, "local_id": 1, "priority": "ĐỎ", "title": "Graph trong repo được xây dựng từ feature map theo thuật toán cụ thể nào?", "content": "## 1.1. Bản trả lời nhanh\n\n> **Sau DenseNet và projection, feature có shape `[B,H,W,D]`. Code flatten thành $N=H\\times W$ node theo row-major. Nó tạo ma trận kề cho một grid 8-connected: phải, xuống, chéo phải xuống, chéo trái xuống, rồi thêm cạnh ngược để có đủ tám hướng; cuối cùng thêm self-loop. Adjacency được nhân bản cho batch và xóa các cạnh đi/đến node padding theo mask.**\n\n## 1.2. Giải thích chi tiết\n\n### Thuật toán\n\n1. Tạo index:\n\n$$ i=0,\\ldots,N-1 $$\n\n2. Xác định cạnh phải khi $x \\lt W-1$:\n\n$$ (i,i+1) $$\n\n3. Cạnh xuống khi $y \\lt H-1$:\n\n$$ (i,i+W) $$\n\n4. Chéo phải xuống:\n\n$$ (i,i+W+1) $$\n\n5. Chéo trái xuống:\n\n$$ (i,i+W-1) $$\n\n6. Thêm reverse edges.\n7. Thêm $(i,i)$.\n8. Expand thành `[B,N,N]`.\n9. Mask row/column của padding.\n10. Tái thêm self-loop để tránh NaN.\n\n### Vì sao chỉ tạo bốn loại rồi reverse?\n\nĐó là cách tránh thêm trùng. Sau reverse, node nội bộ có tối đa tám neighbor cộng self.\n\n### Hạn chế\n\n- ma trận dense $N\\times N$;\n- topology cố định theo grid;\n- không dựa nội dung;\n- không có long-range edge;\n- padding self-loop vẫn tồn tại.\n\n## 1.4. Không nên nói\n\n- “Graph được học tự động.”\n- “Edge nối theo semantic relation.”\n- “Graph fully connected.”\n- “Adjacency thưa về cấp phát bộ nhớ.”\n\n## 1.5. Bằng chứng cần chỉ ra\n\n- `_build_grid_adjacency()` trong `encoder.py`.\n\n---"}, {"global_id": 52, "local_id": 2, "priority": "ĐỎ", "title": "Mỗi node chứa những thành phần đặc trưng nào?", "content": "## 2.1. Bản trả lời nhanh\n\n> **Node ban đầu chứa vector visual feature 256 chiều từ DenseNet sau convolution $1\\times1$. Trong M3–M5, absolute positional encoding được thêm sau GAT, nên đầu vào GAT là visual feature thuần. Trong M4/M5, hướng tương đối không nối vào node feature mà đi vào attention logits qua bảng bias 9 trạng thái.**\n\n## 2.2. Giải thích chi tiết\n\nNode $h_i$ có nguồn từ receptive field ảnh. Nó mã hóa ngầm:\n\n- nét;\n- góc;\n- texture;\n- shape;\n- local context.\n\nNó không chứa tường minh:\n\n- symbol class;\n- bounding box;\n- width/height ký hiệu;\n- relation label;\n- raw $(x,y)$ concatenated, theo code M4 hiện tại.\n\n### Absolute position\n\nSau GAT:\n\n$$ z_i=\\operatorname{LN}(h_i'+PE(x_i,y_i)) $$\n\n### Relative position\n\nTrong attention:\n\n$$ e_{ij}^{(k)} = e_{ij,\\text{content}}^{(k)} + b_{k,r_{ij}} $$\n\nVì vậy phải phân biệt:\n\n- node feature;\n- node absolute position;\n- edge relative direction.\n\n## 2.4. Không nên nói\n\n- “Node chứa class symbol.”\n- “Node chứa bounding box.”\n- “Tọa độ được concatenate vào feature” nếu code không làm.\n\n## 2.5. Bằng chứng cần chỉ ra\n\n- `feature_proj`, `view` và `pos_enc_2d` trong `encoder.py`.\n- `rel_bias` trong `gat.py`.\n\n---"}, {"global_id": 53, "local_id": 3, "priority": "ĐỎ", "title": "Hai node được nối cạnh khi thỏa điều kiện gì?", "content": "## 3.1. Bản trả lời nhanh\n\n> **Hai node được nối nếu tọa độ grid của chúng lệch tối đa một ô theo mỗi trục và không đồng thời bằng 0, tức là hàng xóm 8 hướng; self-loop nối node với chính nó. Cạnh chỉ hợp lệ khi node không phải padding, ngoại trừ self-loop được tái thêm để giữ softmax ổn định.**\n\n## 3.2. Giải thích chi tiết\n\nVới tọa độ $(x_i,y_i)$ và $(x_j,y_j)$:\n\n$$ |\\Delta x|\\le1,\\quad|\\Delta y|\\le1 $$\n\nvà với neighbor:\n\n$$ (\\Delta x,\\Delta y) e(0,0) $$\n\nSelf-loop là trường hợp $(0,0)$.\n\n### Không có điều kiện về feature similarity\n\nAdjacency không hỏi:\n\n- cosine similarity;\n- cùng symbol;\n- khoảng cách Euclidean ảnh gốc;\n- confidence.\n\nAttention weight mới dùng feature để quyết định mức đóng góp.\n\n### Padding\n\nNếu $M_i=1$ hoặc $M_j=1$, cạnh thường bị xóa. Self-loop được thêm lại cho tất cả node.\n\n## 3.4. Không nên nói\n\n- “Edge được tạo nếu attention cao.”\n- “Edge chỉ nối cùng ký hiệu.”\n- “Padding node hoàn toàn không đi qua GAT” — nó vẫn có self-loop nội bộ.\n\n## 3.5. Bằng chứng cần chỉ ra\n\n- Adjacency code và mask.\n\n---"}, {"global_id": 54, "local_id": 4, "priority": "ĐỎ", "title": "Vì sao chọn lưới 8 láng giềng thay vì 4 láng giềng, k-NN hoặc fully connected graph?", "content": "## 4.1. Bản trả lời nhanh\n\n> **8-neighbor bổ sung tương tác chéo, phù hợp các quan hệ xiên như số mũ và chỉ số, trong khi vẫn giữ topology cục bộ. So với 4-neighbor, đường truyền chéo ngắn hơn; so với fully connected, nó áp đặt local inductive bias và tránh mọi node tương tác logic với nhau; so với k-NN, grid không cần tính khoảng cách và ổn định theo shape.**\n>\n> **Tuy nhiên repo chưa có ablation giữ nguyên mọi thứ rồi chỉ đổi 4/8/k-NN, nên đây là lý do thiết kế chứ chưa phải bằng chứng 8-neighbor tối ưu.**\n\n## 4.2. Giải thích chi tiết\n\n### 4-neighbor\n\nƯu:\n\n- ít edge;\n- đơn giản;\n- directional rõ.\n\nNhược:\n\n- node chéo cần hai hop;\n- có thể kém với superscript/subscript xiên.\n\n### 8-neighbor\n\nƯu:\n\n- diagonal one-hop;\n- mỗi node nội bộ có neighborhood vuông $3\\times3$;\n- tương thích 9-state bias.\n\nNhược:\n\n- thêm edge;\n- diagonal có thể trộn vùng không liên quan;\n- vẫn rất local.\n\n### k-NN\n\nTrên grid đều, k-NN gần giống neighborhood theo khoảng cách. Nếu dùng feature-space k-NN:\n\n- graph phụ thuộc nội dung;\n- chi phí xây graph;\n- có nguy cơ nối sai sớm.\n\n### Fully connected\n\nƯu:\n\n- global interaction một layer.\n\nNhược:\n\n- mất local bias;\n- $O(N^2)$ edge logic;\n- dễ học shortcut;\n- trùng với self-attention.\n\n### Cần thí nghiệm\n\n| Graph | Same GAT | Same params | Same seed |\n|---|---|---|---|\n| 4-neighbor | ✓ | ✓ | ✓ |\n| 8-neighbor | ✓ | ✓ | ✓ |\n| radius-2 | ✓ | ✓ | ✓ |\n| k-NN | ✓ | ✓ | ✓ |\n\n## 4.4. Không nên nói\n\n- “8-neighbor chắc chắn tốt nhất.”\n- “Fully connected không thể học.”\n- “k-NN luôn chậm.”\n\n## 4.5. Bằng chứng cần chỉ ra\n\n- M4 code.\n- Ablation connectivity cần bổ sung.\n\n---"}, {"global_id": 55, "local_id": 5, "priority": "ĐỎ", "title": "Graph là có hướng hay vô hướng; có self-loop hay không?", "content": "## 5.1. Bản trả lời nhanh\n\n> **Ma trận kề được xây đối xứng: mỗi cạnh phải/xuống/chéo đều được thêm cạnh ngược, nên về topology nó là graph vô hướng được biểu diễn bằng hai directed entries. Graph có self-loop cho mọi node.**\n>\n> **Attention $\\alpha_{ij}$ và $\\alpha_{ji}$ vẫn có thể khác vì softmax theo neighborhood của từng node, nên message passing có tính định hướng dù adjacency đối xứng.**\n\n## 5.2. Giải thích chi tiết\n\nAdjacency:\n\n$$ A_{ij}=A_{ji}=1 $$\n\nNhưng attention:\n\n$$ \\alpha_{ij} = \\frac{\\exp e_{ij}} {\\sum_{k\\in\\mathcal{N}(i)}\\exp e_{ik}} $$\n\nvà:\n\n$$ \\alpha_{ji} = \\frac{\\exp e_{ji}} {\\sum_{k\\in\\mathcal{N}(j)}\\exp e_{jk}} $$\n\nkhông bắt buộc bằng nhau.\n\n### Vai trò self-loop\n\n- giữ thông tin của node;\n- tránh neighborhood rỗng;\n- tránh softmax toàn $-\\infty$;\n- relative state trung tâm có index riêng.\n\nResidual bên ngoài GAT còn thêm một đường giữ feature khác.\n\n## 5.4. Không nên nói\n\n- “Vô hướng nên attention hai chiều bằng nhau.”\n- “Không cần self-loop vì có residual.”\n- “Self-loop là cạnh semantic.”\n\n## 5.5. Bằng chứng cần chỉ ra\n\n- Các assignment đối xứng và diagonal trong adjacency.\n\n---"}, {"global_id": 56, "local_id": 6, "priority": "ĐỎ", "title": "Một lớp GAT cập nhật node embedding theo công thức và trực giác nào?", "content": "## 6.1. Bản trả lời nhanh\n\n> **Đầu tiên node được chiếu tuyến tính và chia thành nhiều head. Với mỗi cặp node kề, model tính attention logit từ feature của node nguồn và node đích, cộng relative direction bias, qua LeakyReLU, mask cạnh không tồn tại và softmax trên các láng giềng. Output là tổng có trọng số của value feature từ các neighbor.**\n\n## 6.2. Giải thích chi tiết\n\nVới head $k$:\n\n$$ z_i^{(k)}=W^{(k)}h_i $$\n\nLogit nội dung:\n\n$$ e_{ij,\\text{content}}^{(k)} = a_1^\\top z_i^{(k)} + a_2^\\top z_j^{(k)} $$\n\nThêm bias:\n\n$$ e_{ij}^{(k)} = \\operatorname{LeakyReLU} \\left( e_{ij,\\text{content}}^{(k)} + b_{k,r_{ij}} \\right) $$\n\nMask và chuẩn hóa:\n\n$$ \\alpha_{ij}^{(k)} = \\frac{\\exp e_{ij}^{(k)}} {\\sum_{m\\in\\mathcal{N}(i)}\\exp e_{im}^{(k)}} $$\n\nUpdate:\n\n$$ h_i'= \\operatorname{Concat}_{k=1}^{K} \\sum_{j\\in\\mathcal{N}(i)} \\alpha_{ij}^{(k)}z_j^{(k)} $$\n\nEncoder dùng residual:\n\n$$ \\tilde h_i=h_i+\\operatorname{GAT}(h)_i $$\n\n### Trực giác\n\nMỗi node hỏi:\n\n> Trong vùng $3\\times3$ quanh mình, feature nào cần được ưu tiên để làm rõ representation hiện tại?\n\nKhông nên diễn giải $\\alpha$ trực tiếp là “xác suất node j là số mũ”.\n\n## 6.4. Không nên nói\n\n- “GAT phân loại edge.”\n- “Attention weight là xác suất quan hệ toán học.”\n- “Một layer nhìn toàn graph.”\n\n## 6.5. Bằng chứng cần chỉ ra\n\n- `GATLayer.forward`.\n- `_compute_attention_scores`.\n- residual trong encoder.\n\n---"}, {"global_id": 57, "local_id": 7, "priority": "ĐỎ", "title": "Attention coefficient trong GAT biểu diễn điều gì và được chuẩn hóa trên tập láng giềng ra sao?", "content": "## 7.1. Bản trả lời nhanh\n\n> **$\\alpha_{ij}$ là trọng số tương đối mà node $i$ dành cho feature của node $j$ trong một head và một lần forward. Nó được softmax theo chiều node đích sau khi các cặp không có cạnh bị đặt $-\\infty$, nên tổng trọng số trên neighborhood của $i$ bằng 1 trước dropout.**\n>\n> **Nó không phải xác suất ground-truth của một quan hệ và không nên được xem là lời giải thích tuyệt đối.**\n\n## 7.2. Giải thích chi tiết\n\nTrước dropout:\n\n$$ \\sum_{j\\in\\mathcal{N}(i)} \\alpha_{ij}^{(k)} =1 $$\n\nSau dropout attention, tổng có thể không còn đúng 1 trong một sample train, tùy scaling của dropout.\n\n### Phụ thuộc\n\nCoefficient phụ thuộc:\n\n- feature hiện tại;\n- head;\n- relative direction bias;\n- neighborhood;\n- model parameters;\n- train/eval mode.\n\n### Boundary effect\n\nNode ở biên có ít neighbor hơn, nên phân phối softmax trên tập nhỏ hơn. Padding cũng thay đổi neighborhood theo sample.\n\n### Interpretability caution\n\nAttention visualization hữu ích để tạo giả thuyết, nhưng attention weight không tự chứng minh causal importance. Có thể kiểm tra bằng:\n\n- edge ablation;\n- attention rollout;\n- gradient attribution;\n- perturb neighbor feature.\n\n## 7.4. Không nên nói\n\n- “Attention cao nghĩa là node quan trọng thật.”\n- “Tổng attention sau dropout luôn bằng 1.”\n- “Mọi head học cùng quan hệ.”\n\n## 7.5. Bằng chứng cần chỉ ra\n\n- Softmax dimension `-1`.\n- Attention dropout.\n- Perturbation experiment.\n\n---"}, {"global_id": 58, "local_id": 8, "priority": "VÀNG", "title": "Số head trong GAT ảnh hưởng thế nào đến năng lực biểu diễn và chi phí tính toán?", "content": "## 8.1. Bản trả lời nhanh\n\n> **Nhiều head cho phép học nhiều kiểu tổng hợp hoặc ưu tiên hướng khác nhau. Nhưng với `out_features` cố định, tăng head làm `head_dim=out_features/heads` nhỏ hơn; đồng thời attention tensor và bias có thêm chiều head, tăng bộ nhớ/chi phí. Nhiều head cũng không bảo đảm tốt hơn, như M5 8 head thấp hơn M4 4 head khi đồng thời tăng depth.**\n\n## 8.2. Giải thích chi tiết\n\nVới $D=256$:\n\n- 4 head → 64 chiều/head;\n- 8 head → 32 chiều/head.\n\nTrade-off:\n\n- nhiều subspaces;\n- mỗi subspace hẹp hơn;\n- attention matrix tăng theo $K$;\n- optimization phức tạp hơn.\n\nBộ nhớ score:\n\n$$ O(BKN^2) $$\n\n### Không thể tách head effect từ M4–M5\n\nM4 và M5 đồng thời đổi:\n\n- layer;\n- head;\n- có thể training dynamics.\n\nMuốn kết luận head:\n\n- 1L4H vs 1L8H;\n- cùng seed, dropout, d_model;\n- parameter count báo cáo.\n\n## 8.4. Không nên nói\n\n- “Nhiều head luôn tốt.”\n- “Head tương ứng cố định với trên/dưới/trái/phải.”\n- “M5 chứng minh 8 head xấu” khi depth cũng đổi.\n\n## 8.5. Bằng chứng cần chỉ ra\n\n- `head_dim`.\n- Ablation giữ nguyên layer.\n\n---"}, {"global_id": 59, "local_id": 9, "priority": "VÀNG", "title": "Vì sao dùng GAT thay vì GCN, GraphSAGE hoặc graph transformer?", "content": "## 9.1. Bản trả lời nhanh\n\n> **GAT phù hợp giả thuyết vì nó học trọng số khác nhau cho từng neighbor và cho phép cộng relative directional bias trực tiếp vào attention logits. GCN dùng aggregation chuẩn hóa tương đối cố định; GraphSAGE tập trung hàm aggregate/sample neighbor; graph transformer mạnh hơn nhưng thường phức tạp và dễ mất local bias.**\n>\n> **Đây là rationale, chưa phải bằng chứng GAT tốt hơn nếu chưa có baseline cùng budget.**\n\n## 9.2. Giải thích chi tiết\n\n### GCN\n\n$$ H'=\\sigma(\\hat D^{-1/2}\\hat A\\hat D^{-1/2}HW) $$\n\nNeighbor weights chủ yếu do degree normalization.\n\n### GraphSAGE\n\nCó thể mean/max/LSTM aggregate, hữu ích graph lớn và inductive sampling. Grid hiện nhỏ và cố định nên sampling không phải nhu cầu chính.\n\n### GAT\n\n- adaptive neighbor weights;\n- multi-head;\n- relative bias tự nhiên;\n- phù hợp 8-neighbor.\n\n### Graph transformer\n\n- global hoặc edge-aware attention;\n- capacity lớn;\n- có thể thay decoder/encoder rộng hơn;\n- cần dữ liệu và compute;\n- khó cô lập đóng góp.\n\n### Baseline cần có nếu muốn khẳng định\n\n- GCN cùng layers/d_model;\n- local self-attention;\n- GAT no bias;\n- coordinate-aware GAT.\n\n## 9.4. Không nên nói\n\n- “GCN không có trọng số.”\n- “GraphSAGE chỉ dùng social network.”\n- “Graph transformer luôn overfit.”\n\n## 9.5. Bằng chứng cần chỉ ra\n\n- Công thức và implementation.\n- So sánh thực nghiệm nếu bổ sung.\n\n---"}, {"global_id": 60, "local_id": 10, "priority": "VÀNG", "title": "Độ phức tạp của graph thay đổi thế nào theo chiều cao và chiều rộng feature map?", "content": "## 10.1. Bản trả lời nhanh\n\n> **Số node $N=HW$. Số edge logic của grid 8 hướng cộng self tăng tuyến tính, xấp xỉ $9N$ entries có hướng ở vùng nội bộ. Nhưng implementation dùng adjacency và attention dense $N\\times N$, nên bộ nhớ và tính toán attention tăng bậc hai theo $HW$.**\n\n## 10.2. Giải thích chi tiết\n\n### Edge logic\n\nSố undirected edges:\n\n- ngang: $H(W-1)$;\n- dọc: $(H-1)W$;\n- chéo: $2(H-1)(W-1)$;\n- self: $HW$.\n\nNếu biểu diễn hai hướng, số entry neighbor xấp xỉ:\n\n$$ 2[H(W-1)+(H-1)W+2(H-1)(W-1)]+HW $$\n\nTăng $O(HW)$.\n\n### Dense implementation\n\nAdjacency:\n\n$$ A\\in\\mathbb{R}^{N\\times N} $$\n\nAttention per head:\n\n$$ E\\in\\mathbb{R}^{N\\times N} $$\n\nTăng:\n\n$$ O((HW)^2) $$\n\nNếu tăng gấp đôi H và W, $N$ tăng 4 lần, $N^2$ tăng 16 lần.\n\n### Hướng tối ưu\n\n- edge index;\n- scatter softmax;\n- sparse attention;\n- neighborhood tensor `[B,N,9,D]`;\n- window gather;\n- cache relative index.\n\n## 10.4. Không nên nói\n\n- “Complexity là $O(N)$.”\n- “8-neighbor tự động làm implementation sparse.”\n- “Tăng resolution gấp đôi chỉ tăng chi phí gấp đôi.”\n\n## 10.5. Bằng chứng cần chỉ ra\n\n- Shapes trong `gat.py`.\n- Memory profile theo H,W.\n\n---"}, {"global_id": 61, "local_id": 11, "priority": "VÀNG", "title": "Graph grid có mô hình hóa trực tiếp quan hệ superscript, subscript, above và below hay không?", "content": "## 11.1. Bản trả lời nhanh\n\n> **Không. Nó chỉ mã hóa hướng tương đối một ô: trên, dưới, trái, phải, chéo và self. Không có edge label “superscript”, “subscript”, “numerator” hay “denominator”. Những quan hệ toán học chỉ có thể được học ngầm qua feature, nhiều hop và decoder.**\n\n## 11.2. Giải thích chi tiết\n\nRelative state mô tả geometry:\n\n$$ (\\Delta x,\\Delta y)\\in\\{-1,0,1\\}^2 $$\n\nGeometry không đồng nhất semantics.\n\nVí dụ node ở phía trên có thể thuộc:\n\n- số mũ;\n- tử số;\n- cận trên;\n- ký hiệu khác ở dòng trên;\n- nhiễu.\n\nMuốn semantic graph cần:\n\n- symbol instances;\n- relation labels;\n- relation classifier;\n- graph supervision.\n\n### Cách nói an toàn\n\n> **M4 đưa directional inductive bias, không đưa semantic relation supervision.**\n\n## 11.4. Không nên nói\n\n- “Bias trên chính là superscript.”\n- “9 trạng thái là 9 quan hệ toán học.”\n- “Graph hiểu tử/mẫu tường minh.”\n\n## 11.5. Bằng chứng cần chỉ ra\n\n- `rel_indices` chỉ dựa dx,dy.\n\n---"}, {"global_id": 62, "local_id": 12, "priority": "VÀNG", "title": "Thông tin tọa độ tuyệt đối và vị trí tương đối được đưa vào GAT như thế nào?", "content": "## 12.1. Bản trả lời nhanh\n\n> **Trong M3–M5, absolute 2D positional encoding không đi vào GAT; nó được cộng sau GAT. Relative position được đưa vào bên trong GAT bằng bảng bias học được `[num_heads,9]`, tra theo $\\Delta x,\\Delta y$ đã clamp về $-1,0,1$ và cộng vào attention logits trước LeakyReLU/softmax.**\n\n## 12.2. Giải thích chi tiết\n\n### Absolute position\n\n$$ PE_i=PE(x_i,y_i) $$\n\nSau residual GAT:\n\n$$ z_i=\\operatorname{LN}(\\tilde h_i+PE_i) $$\n\nMục tiêu thiết kế: giữ tọa độ tuyệt đối rõ cho decoder.\n\n### Relative direction\n\nIndex:\n\n$$ r_{ij}=3(\\Delta y+1)+(\\Delta x+1) $$\n\nnằm 0–8.\n\nBias:\n\n$$ b_{k,r_{ij}} $$\n\nkhác theo head.\n\n### Điểm cần chú ý\n\nCode tính relative index cho mọi cặp node rồi clamp, nhưng adjacency mask chỉ giữ neighbor. Vì vậy các cặp xa không thực sự attention, dù chúng cũng nhận một index đã clamp trước khi mask.\n\n### Không có distance magnitude\n\nMột neighbor grid luôn lệch 1 hoặc 0. Bias không mã hóa khoảng cách 2,3,... vì graph chỉ local.\n\n## 12.4. Không nên nói\n\n- “Absolute coordinate concatenate vào node.”\n- “Relative bias mã hóa khoảng cách xa.”\n- “PE trước GAT trong M4.”\n\n## 12.5. Bằng chứng cần chỉ ra\n\n- `encoder.py`: PE sau GAT.\n- `gat.py`: `rel_bias`, `rel_indices`.\n\n---"}, {"global_id": 63, "local_id": 13, "priority": "BẪY", "title": "Nếu graph chỉ nối các ô lân cận, làm sao thông tin giữa hai vùng xa nhau có thể tương tác?", "content": "## 13.1. Bản trả lời nhanh\n\n> **Qua nhiều cơ chế: một lớp GAT truyền một hop, nhiều lớp truyền nhiều hop; DenseNet trước đó đã có receptive field lớn; và Transformer Decoder cross-attend toàn bộ feature map nên có thể kết hợp vùng xa. Vì vậy graph không phải kênh global duy nhất.**\n>\n> **Tuy nhiên M4 chỉ một GAT layer nên phần GAT trực tiếp chỉ local; không được nói một layer GAT truyền toàn graph.**\n\n## 13.2. Giải thích chi tiết\n\nSau $L$ layer, receptive field graph tối đa khoảng $L$ hop:\n\n$$ h_i^{(L)} \\text{ phụ thuộc } \\mathcal{N}^{L}(i) $$\n\nNhưng:\n\n- CNN feature mỗi node đã bao phủ vùng ảnh rộng;\n- decoder có global memory access;\n- autoregressive context liên kết các token.\n\n### Vì sao M4 1 layer vẫn có thể hoạt động?\n\nGAT chỉ làm local refinement, không phải thay toàn bộ global reasoning.\n\n### Hướng nếu cần long-range\n\n- dilated edges;\n- hierarchical graph;\n- pooling/coarsening;\n- global virtual node;\n- sparse long-range links;\n- alternating local GAT và global attention.\n\n## 13.4. Không nên nói\n\n- “Một layer GAT nhìn toàn ảnh.”\n- “Hai vùng xa không bao giờ tương tác.”\n- “Phải tăng nhiều GAT layer mới có global context.”\n\n## 13.5. Bằng chứng cần chỉ ra\n\n- Layer count từng model.\n- Decoder cross-attention.\n- Receptive field analysis.\n\n---"}, {"global_id": 64, "local_id": 14, "priority": "BẪY", "title": "GAT có thật sự 'hiểu cấu trúc toán học' hay chỉ học tương quan cục bộ trên feature map?", "content": "## 14.1. Bản trả lời nhanh\n\n> **Bằng chứng hiện tại chỉ cho phép nói GAT học representation và tương quan không gian cục bộ có ích cho nhiệm vụ sinh LaTeX. Không có supervision edge semantic hoặc probe chứng minh nó hiểu khái niệm tử số, mẫu số hay số mũ.**\n>\n> **“Hiểu cấu trúc” nên được dùng thận trọng và phải gắn với metric/analysis cụ thể.**\n\n## 14.2. Giải thích chi tiết\n\n### Ba mức tuyên bố\n\n1. **Representation level:** GAT làm thay đổi feature theo neighborhood — đã có code.\n2. **Task level:** một số metric thay đổi — có bảng thực nghiệm.\n3. **Semantic understanding:** node/edge mã hóa quan hệ toán học — chưa được chứng minh.\n\n### Cần gì để chứng minh mạnh hơn?\n\n- probe dự đoán relation từ embedding;\n- attention alignment với symbol relations;\n- accuracy riêng cấu trúc;\n- intervention: xóa edge hướng trên và xem superscript giảm;\n- tree/graph annotation;\n- counterfactual examples cùng glyph khác bố cục.\n\n### Cách nói trước hội đồng\n\n> **Em không dùng “hiểu” theo nghĩa nhận thức. Em nói GAT cung cấp inductive bias và học biểu diễn không gian hỗ trợ decoder.**\n\n## 14.4. Không nên nói\n\n- “GAT hiểu toán như con người.”\n- “Attention map là bằng chứng hiểu semantics.”\n- “MED thấp chứng minh hiểu cấu trúc.”\n\n## 14.5. Bằng chứng cần chỉ ra\n\n- Ablation.\n- Probe/intervention nếu bổ sung.\n\n---"}], "extras": [{"title": "Phụ lục — Bảng so sánh graph", "content": "| Thiết kế | Node | Edge | Global? | Semantic edge? |\n|---|---|---|---|---|\n| 4-grid | feature cell | 4 hướng | Không trong 1 layer | Không |\n| 8-grid M4 | feature cell | 8 hướng + self | Không trong 1 layer | Không |\n| k-NN feature | feature cell | gần trong feature space | Tùy k | Không |\n| Fully connected | feature cell | mọi cặp | Có | Không |\n| Symbol Layout Graph | symbol | quan hệ symbol | Tùy | Có thể có |"}, {"title": "Nguồn đối chiếu", "content": "- `tamer/model/encoder.py`\n- `tamer/model/gat.py`\n- `tamer/model/pos_enc.py`\n- `tamer/model/decoder.py`"}]}, {"group_id": 7, "title": "M1–M5 và các thí nghiệm ablation", "intro": "# NHÓM 7 — M1–M5 VÀ CÁC THÍ NGHIỆM ABLATION\n\n> **Mục tiêu nhóm:** Giải thích được từng phiên bản, giả thuyết thay đổi, kết quả và kết luận khoa học mà không phóng đại.\n\n---\n\n## 0. Bảng kết quả gốc cần học thuộc\n\n### 0.1. Kết quả theo từng tập kiểm thử\n\n| Mô hình | CROHME 2014 ExpRate | ≤1 | ≤2 | MED | CROHME 2016 ExpRate | ≤1 | ≤2 | MED | CROHME 2019 ExpRate | ≤1 | ≤2 | MED |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n| M1 | **51,12** | **69,98** | **77,69** | 1,99 | 50,65 | **67,92** | 76,02 | 2,21 | **48,54** | **68,14** | 77,23 | 2,40 |\n| M2 | 49,39 | 66,53 | 75,25 | 2,22 | 47,43 | 64,95 | 74,72 | 2,45 | 46,71 | 66,89 | 75,90 | 2,62 |\n| M3 | 48,88 | 66,73 | 75,35 | 2,19 | **50,74** | 66,96 | 75,85 | 2,19 | 47,87 | 67,81 | **77,98** | **2,02** |\n| M4 | 49,90 | 67,44 | 77,18 | **1,98** | 49,17 | 67,13 | **75,76** | **2,13** | 47,87 | 67,72 | 76,90 | 2,08 |\n| M5 | 46,65 | 63,99 | 73,43 | 2,48 | 45,68 | 63,03 | 73,23 | 2,53 | 37,70 | 58,97 | 70,14 | 2,93 |\n\n### 0.2. Trung bình ba tập\n\n| Mô hình | Avg ExpRate | Avg ≤1 | Avg ≤2 | Mean Edit Distance |\n|---|---:|---:|---:|---:|\n| M1 | **50,10** | **68,68** | **76,98** | 2,20 |\n| M2 | 47,84 | 66,12 | 75,29 | 2,21 |\n| M3 | 49,17 | 67,17 | 76,40 | 2,14 |\n| M4 | 48,98 | 67,43 | 76,61 | **2,06** |\n| M5 | 43,35 | 62,00 | 72,27 | 2,65 |\n\n### 0.3. Bốn kết luận phải giữ nguyên\n\n1. **M1 có ExpRate trung bình cao nhất.**\n2. **M4 có Mean Edit Distance trung bình thấp nhất.**\n3. **M3 chỉ nhỉnh hơn M1 về ExpRate trên CROHME 2016; không thắng M1 trên toàn bộ benchmark.**\n4. **M5 thấp rõ rệt trên tất cả các metric tổng hợp.**\n\n---", "questions": [{"global_id": 65, "local_id": 1, "priority": "ĐỎ", "title": "M1 là baseline gì và mục đích tồn tại của M1 trong nghiên cứu là gì?", "content": "## 1.1. Bản trả lời nhanh\n\n> **M1 là baseline DenseNet–Transformer không có GAT. DenseNet trích xuất feature map, positional encoding được đưa vào encoder memory, rồi Transformer Decoder sinh LaTeX. Mục đích của M1 là tạo nhóm đối chứng để đo tác động thực sự của GAT và các thiết kế vị trí ở M2–M5.**\n>\n> **Nếu không có M1, em không thể biết thay đổi kết quả đến từ GAT hay chỉ do backbone, decoder, dữ liệu hoặc cách đánh giá.**\n\n## 1.2. Giải thích chi tiết\n\nM1 trả lời câu hỏi:\n\n> Với cùng dữ liệu và decoder, mô hình không có graph refinement đạt kết quả bao nhiêu?\n\nPipeline khái quát:\n\n```text\nImage\n→ DenseNet\n→ projected feature map\n→ 2D positional encoding\n→ Transformer Decoder\n→ LaTeX\n```\n\nM1 phải được giữ ổn định về:\n\n- dataset;\n- vocabulary;\n- preprocessing;\n- optimizer;\n- số epoch;\n- checkpoint criterion;\n- decoding;\n- beam size;\n- seed;\n- metric.\n\nM1 không phải một mô hình “yếu để làm nền”. Kết quả cho thấy M1 là baseline rất mạnh và vẫn có ExpRate trung bình tốt nhất. Điều này làm nghiên cứu đáng tin hơn vì các biến thể GAT phải vượt qua một đối chứng thực sự cạnh tranh.\n\n## 1.3. Câu hỏi truy tiếp\n\n**“Nếu M1 vẫn cao nhất, tại sao không dừng ở M1?”**\n\n> M1 phù hợp mục tiêu tối đa hóa Exact Match hiện tại. Tuy nhiên luận văn còn nghiên cứu cách message passing và positional information ảnh hưởng representation. M4 giảm Mean Edit Distance, M2–M3 cho thấy thứ tự PE quan trọng, và M5 cung cấp negative result về scale-up. Giá trị nghiên cứu không chỉ là chọn số cao nhất.\n\n## 1.4. Không nên nói\n\n- “M1 không hiểu cấu trúc.”\n- “M1 chỉ là CNN đơn giản.”\n- “M1 kém hơn GAT.”\n- “Baseline tồn tại chỉ để làm M4 đẹp hơn.”\n\n---"}, {"global_id": 66, "local_id": 2, "priority": "ĐỎ", "title": "M2 thay đổi module nào so với M1 và giả thuyết ban đầu là gì?", "content": "## 2.1. Bản trả lời nhanh\n\n> **M2 chèn GAT vào encoder sau khi feature đã được cộng positional encoding, tức PE đi vào message passing. Cấu hình được mô tả là GAT 2 lớp, 8 head. Giả thuyết ban đầu là GAT sẽ tổng hợp ngữ cảnh lân cận và hỗ trợ cấu trúc 2D tốt hơn baseline.**\n>\n> **Kết quả ngược kỳ vọng: Avg ExpRate giảm từ 50,10% xuống 47,84%, còn MED gần như không cải thiện. Điều này bác bỏ cách tích hợp GAT ngây thơ trong thiết lập đã thử.**\n\n## 2.2. Giải thích chi tiết\n\nM2 có thể mô tả:\n\n$$ H_{\\text{M2}} = \\operatorname{GAT}(F+PE) $$\n\nSau đó decoder nhận memory đã qua GAT.\n\nGiả thuyết ban đầu:\n\n- feature lân cận bổ sung ngữ cảnh;\n- GAT học neighbor importance;\n- biểu thức 2D được biểu diễn tốt hơn.\n\nQuan sát:\n\n$$ \\Delta\\text{ExpRate}_{M2-M1} = 47,84-50,10 = -2,26 $$\n\nđiểm phần trăm trung bình.\n\nKhông nên giải thích bằng một nguyên nhân chắc chắn. Các khả năng gồm:\n\n- PE tuyệt đối bị trộn trong message passing;\n- GAT làm quá mượt feature;\n- optimizer chưa phù hợp;\n- nhiều layer/head hơn mức cần thiết;\n- dropout;\n- parameter count và training budget;\n- biến thể code khác giữa các run.\n\n## 2.3. Kết luận khoa học\n\n> **Việc chỉ thêm GAT không bảo đảm cải thiện. Vị trí chèn và cách mã hóa vị trí là biến thiết kế quan trọng.**\n\n---"}, {"global_id": 67, "local_id": 3, "priority": "ĐỎ", "title": "M3 khác M2 chính xác ở vị trí đưa positional encoding như thế nào?", "content": "## 3.1. Bản trả lời nhanh\n\n> **M2 cộng positional encoding trước GAT, còn M3 cho GAT xử lý visual feature trước rồi mới cộng PE trước decoder. Các phần còn lại được kỳ vọng giữ giống nhau.**\n>\n> **M3 tăng Avg ExpRate từ 47,84% lên 49,17% và giảm MED từ 2,21 xuống 2,14 so với M2. Vì vậy trong thiết lập này, PE sau GAT hiệu quả hơn PE trước GAT.**\n\n## 3.2. Công thức so sánh\n\nM2:\n\n$$ Z_{M2} = \\operatorname{GAT}(F+PE) $$\n\nM3:\n\n$$ Z_{M3} = \\operatorname{GAT}(F)+PE $$\n\nTrực giác:\n\n- GAT ở M3 tập trung tổng hợp visual feature;\n- PE tuyệt đối được giữ như tín hiệu tọa độ rõ ràng cho decoder;\n- absolute position không bị neighbor mixing.\n\n## 3.3. Điều kiện để ablation M2–M3 sạch\n\nPhải xác nhận từ code/config từng run rằng các yếu tố khác giống nhau:\n\n- adjacency;\n- GAT layer/head;\n- d_model;\n- dropout;\n- optimizer;\n- seed;\n- epoch;\n- checkpoint;\n- beam search.\n\nNếu không có commit riêng, không được nói M2–M3 chỉ khác đúng một dòng dựa trên README.\n\n## 3.4. Kết luận đúng mức\n\nĐược nói:\n\n> **PE sau GAT tốt hơn PE trước GAT trong cấu hình đã thử.**\n\nChưa được nói:\n\n- mọi GNN đều phải đặt PE sau;\n- đã chứng minh PE bị “xóa”;\n- M3 tốt hơn M1 nói chung.\n\n---"}, {"global_id": 68, "local_id": 4, "priority": "ĐỎ", "title": "M4 bổ sung những thành phần nào liên quan đến tọa độ và relative position?", "content": "## 4.1. Bản trả lời nhanh\n\n> **M4 dùng graph lưới 8 hướng có self-loop, thêm relative directional bias 9 trạng thái vào attention logits của từng head, giữ absolute 2D PE sau GAT, và dùng cấu hình gọn 1 GAT layer, 4 head.**\n>\n> **Chín trạng thái tương ứng với $\\Delta x,\\Delta y\\in\\{-1,0,1\\}$: tám hướng lân cận và vị trí self.**\n\n## 4.2. Công thức relative state\n\nVới node $i,j$:\n\n$$ r_{ij} = 3(\\Delta y+1)+(\\Delta x+1) $$\n\nnên:\n\n$$ r_{ij}\\in\\{0,\\ldots,8\\} $$\n\nMỗi head $k$ có bias:\n\n$$ b_{k,r_{ij}} $$\n\nAttention logit:\n\n$$ e_{ij}^{(k)} = e_{ij,\\text{content}}^{(k)} + b_{k,r_{ij}} $$\n\nM4 không concatenate tọa độ tuyệt đối vào node. Nó tách:\n\n- relative direction trong GAT;\n- absolute PE sau GAT.\n\n## 4.3. Kết quả\n\nM4:\n\n- Avg ExpRate 48,98%;\n- Avg MED 2,06, tốt nhất;\n- không vượt M1 về Exact Match.\n\nCách diễn giải:\n\n> M4 tạo chuỗi gần ground truth hơn trung bình, nhưng chưa làm nhiều mẫu đạt khoảng cách 0 hơn M1.\n\n## 4.4. Hạn chế ablation\n\nM4 thay nhiều biến so với M3:\n\n- connectivity;\n- relative bias;\n- layer;\n- head.\n\nKhông thể quy toàn bộ chênh lệch cho relative bias.\n\n---"}, {"global_id": 69, "local_id": 5, "priority": "ĐỎ", "title": "M5 tăng độ sâu hoặc độ rộng ở đâu so với M4?", "content": "## 5.1. Bản trả lời nhanh\n\n> **M5 giữ hướng coordinate-aware nhưng tăng từ 1 GAT layer, 4 head ở M4 lên 2 GAT layer, 8 head. Với `d_model=256`, head dimension giảm từ 64 xuống 32 khi số head tăng.**\n>\n> **Kết quả không cải thiện mà giảm mạnh: Avg ExpRate 43,35% và MED 2,65. Điều này cho thấy tăng capacity/message-passing depth không mặc định tốt hơn.**\n\n## 5.2. Những gì thay đổi\n\n| Thuộc tính | M4 | M5 |\n|---|---:|---:|\n| GAT layers | 1 | 2 |\n| Heads | 4 | 8 |\n| d_model | 256 | 256 |\n| Head dimension | 64 | 32 |\n| Relative bias | Có | Có |\n| PE sau GAT | Có | Có |\n\nCần xác nhận dropout và mọi config khác từ run.\n\n## 5.3. Các giả thuyết giải thích\n\n- over-smoothing;\n- overfitting;\n- optimization khó;\n- attention dropout qua hai tầng;\n- head dimension quá nhỏ;\n- relative bias qua nhiều layer;\n- seed variance;\n- checkpoint/training budget chưa tối ưu.\n\nĐây là **giả thuyết**, không phải kết luận đã chứng minh.\n\n---"}, {"global_id": 70, "local_id": 6, "priority": "ĐỎ", "title": "Bảng cấu hình M1–M5 cần những cột nào để hội đồng nhìn là hiểu ngay?", "content": "## 6.1. Bản trả lời nhanh\n\n> **Bảng phải cho thấy mỗi phiên bản khác ở đâu và những yếu tố nào được giữ nguyên. Tối thiểu cần: backbone, loại node, connectivity, GAT on/off, PE trước/sau, relative bias, số layer/head, d_model, dropout, parameter count, optimizer, epoch, seed, checkpoint criterion và decoding.**\n\n## 6.2. Mẫu bảng đề xuất\n\n| Thuộc tính | M1 | M2 | M3 | M4 | M5 |\n|---|---|---|---|---|---|\n| Backbone | DenseNet | DenseNet | DenseNet | DenseNet | DenseNet |\n| Node | — | Feature cell | Feature cell | Feature cell | Feature cell |\n| Graph | — | Cần xác nhận | Cần xác nhận | 8-neighbor+self | 8-neighbor+self |\n| GAT | Không | Có | Có | Có | Có |\n| Absolute PE | Trước decoder | Trước GAT | Sau GAT | Sau GAT | Sau GAT |\n| Relative bias | Không | Không | Không | 9-state | 9-state |\n| GAT layers | 0 | 2 | 2 | 1 | 2 |\n| Heads | 0 | 8 | 8 | 4 | 8 |\n| d_model | 256 | 256 | 256 | 256 | 256 |\n| Dropout |  |  |  |  |  |\n| Params |  |  |  |  |  |\n| Seed |  |  |  |  |  |\n| Best epoch |  |  |  |  |  |\n\nCác ô trống phải điền từ log, không đoán.\n\n## 6.3. Vì sao cần parameter count?\n\nNếu M4/M5 có nhiều tham số hơn M1, hội đồng có thể hỏi cải thiện do graph hay capacity. Parameter count giúp kiểm soát lập luận.\n\n---"}, {"global_id": 71, "local_id": 7, "priority": "ĐỎ", "title": "Vì sao phải giữ nguyên dataset, preprocessing và quy trình đánh giá khi so sánh M1–M5?", "content": "## 7.1. Bản trả lời nhanh\n\n> **Ablation nhằm đo tác động của một thay đổi. Nếu đồng thời đổi dữ liệu, preprocessing, checkpoint criterion hoặc beam size, chênh lệch metric bị confound và không thể quy cho GAT/PE.**\n>\n> **Do đó mọi model phải dùng cùng split, vocabulary, preprocessing, seed policy, train budget và evaluation script.**\n\n## 7.2. Nguyên tắc kiểm soát biến\n\nMuốn ước lượng tác động của biến $A$:\n\n$$ \\Delta_A = \\operatorname{Metric}(A=1) - \\operatorname{Metric}(A=0) $$\n\ncác biến khác phải giữ nguyên hoặc được randomize có hệ thống.\n\n### Những yếu tố dễ gây confound\n\n- data version;\n- validation/test role;\n- augmentation;\n- image resolution;\n- optimizer;\n- learning rate;\n- max epoch;\n- seed;\n- beam size;\n- normalization;\n- vocabulary;\n- checkpoint selection.\n\n### Repo hiện có rủi ro\n\n- CROHME 2014 dùng validation;\n- code main có thể không đúng code từng run;\n- M4 đổi nhiều biến;\n- mới có một seed.\n\nPhải ghi rõ để không phóng đại ablation.\n\n---"}, {"global_id": 72, "local_id": 8, "priority": "ĐỎ", "title": "Kết luận chính của toàn bộ chuỗi ablation M1–M5 là gì?", "content": "## 8.1. Bản trả lời nhanh\n\n> **Thứ nhất, thêm GAT theo cách ngây thơ không cải thiện: M2 thấp hơn M1. Thứ hai, vị trí PE quan trọng: M3 tốt hơn M2 khi chuyển PE ra sau GAT. Thứ ba, cấu hình coordinate-aware gọn M4 đạt Mean Edit Distance tốt nhất nhưng không thắng Exact Match. Thứ tư, scale-up lên M5 làm giảm mạnh.**\n>\n> **Vì vậy kết luận không phải “GAT tốt hơn Transformer”, mà là hiệu quả GAT phụ thuộc mạnh vào thiết kế vị trí, relative bias và độ sâu.**\n\n## 8.2. Kết luận theo RQ\n\n- **RQ1:** GAT có tự động giúp không? → Không.\n- **RQ2:** PE order có ảnh hưởng không? → Có, PE sau tốt hơn PE trước trong run hiện có.\n- **RQ3:** Coordinate-aware compact design có ích không? → Có lợi cho MED, chưa có lợi cho Avg ExpRate.\n- **RQ4:** GAT sâu/rộng hơn có tốt hơn không? → Không trong cấu hình đã thử.\n\n## 8.3. Giá trị của negative result\n\nM2 và M5 chỉ ra:\n\n- tích hợp sai có thể làm baseline giảm;\n- capacity lớn hơn không đảm bảo tổng quát;\n- cần thiết kế và kiểm chứng, không ghép module theo trực giác.\n\n---"}, {"global_id": 73, "local_id": 9, "priority": "VÀNG", "title": "Vì sao đưa positional encoding trước GAT có thể làm giảm hiệu quả?", "content": "## 9.1. Bản trả lời nhanh\n\n> **Khi PE được cộng trước GAT, message passing trộn cả visual feature lẫn tọa độ tuyệt đối giữa các node lân cận. Điều này có thể làm tín hiệu vị trí của từng node kém phân biệt hơn hoặc khiến attention tối ưu khó hơn.**\n>\n> **Kết quả M2–M3 phù hợp với giả thuyết này, nhưng chưa đo trực tiếp nên phải gọi là “có thể” chứ không khẳng định đã chứng minh position blurring.**\n\n## 9.2. Minh họa\n\nGiả sử:\n\n$$ h_i=f_i+p_i $$\n\nGAT tạo:\n\n$$ h_i' = \\sum_j\\alpha_{ij}W(f_j+p_j) $$\n\nThành phần position sau aggregation:\n\n$$ \\sum_j\\alpha_{ij}Wp_j $$\n\nkhông còn chỉ là $p_i$.\n\n### Cách kiểm chứng\n\n- linear probe dự đoán $(x,y)$ từ embedding trước/sau GAT;\n- cosine similarity PE;\n- attention alignment;\n- kiểm tra decoder localization;\n- so nhiều seed.\n\n---"}, {"global_id": 74, "local_id": 10, "priority": "VÀNG", "title": "Vì sao đưa positional encoding sau GAT có thể phục hồi kết quả?", "content": "## 10.1. Bản trả lời nhanh\n\n> **GAT trước PE cho phép message passing xử lý visual feature thuần. Sau đó mỗi node được gắn lại absolute position riêng trước decoder, nên decoder nhận cả feature đã làm giàu cục bộ và tọa độ không bị neighbor mixing.**\n>\n> **M3 phục hồi phần lớn khoảng giảm của M2, nhưng vẫn chưa vượt M1 trung bình, nên PE order là một phần của lời giải chứ chưa đủ bảo đảm cải thiện.**\n\n## 10.2. Công thức\n\n$$ \\tilde h_i = h_i+\\operatorname{GAT}(h)_i $$\n\n$$ z_i = \\operatorname{LN}(\\tilde h_i+PE_i) $$\n\nResidual giữ feature gốc; PE gắn sau giúp decoder phân biệt node.\n\n### Hạn chế\n\n- PE sau không sửa được feature đã mất do downsampling;\n- GAT vẫn có thể over-smooth visual component;\n- decoder vẫn phải học structure;\n- kết quả còn phụ thuộc optimizer và data.\n\n---"}, {"global_id": 75, "local_id": 11, "priority": "VÀNG", "title": "Relative position bias trong M4 được định nghĩa theo bao nhiêu trạng thái hoặc khoảng cách?", "content": "## 11.1. Bản trả lời nhanh\n\n> **M4 dùng 9 trạng thái dựa trên $\\Delta x,\\Delta y\\in\\{-1,0,1\\}$: tám hướng lân cận và self. Đây là direction category, không phải khoảng cách nhiều mức. Mỗi attention head có một bảng bias riêng cho 9 trạng thái.**\n\n## 11.2. Bản đồ trạng thái\n\nCó thể trình bày:\n\n```text\n0 1 2\n3 4 5\n6 7 8\n```\n\nTùy quy ước trục trong code, index giữa là self; các index còn lại là các hướng.\n\nCông thức:\n\n$$ r=3(\\Delta y+1)+(\\Delta x+1) $$\n\n### Điều không được nói\n\n- 9 quan hệ toán học;\n- 9 khoảng cách;\n- có relation “superscript” riêng.\n\n---"}, {"global_id": 76, "local_id": 12, "priority": "VÀNG", "title": "Vì sao M4 có thể giảm edit distance nhưng không tăng exact match?", "content": "## 12.1. Bản trả lời nhanh\n\n> **Exact Match chỉ nhận giá trị 1 khi toàn bộ chuỗi đúng. Nếu M4 giảm một mẫu từ 4 lỗi xuống 1 lỗi thì edit distance cải thiện, nhưng mẫu vẫn bị ExpRate tính 0.**\n>\n> **Do đó M4 có thể làm nhiều prediction “gần đúng hơn” mà chưa đủ chuyển chúng thành chuỗi hoàn toàn đúng.**\n\n## 12.2. Ví dụ\n\nGround truth:\n\n```latex\n\\frac { x + 1 } { y }\n```\n\nM1 sai 4 token; M4 chỉ thiếu một `}`.\n\n- ExpRate cả hai mẫu: 0.\n- Edit distance M4 thấp hơn.\n\n### Cần xem phân bố\n\nNếu M4 tốt thật theo mức độ lỗi, histogram có thể cho thấy:\n\n- ít mẫu distance lớn;\n- nhiều mẫu dồn về 1–2;\n- nhưng số distance 0 chưa tăng.\n\nNên báo cáo count:\n\n| Distance | M1 | M4 |\n|---:|---:|---:|\n| 0 | | |\n| 1 | | |\n| 2 | | |\n| 3–5 | | |\n| >5 | | |\n\n---"}, {"global_id": 77, "local_id": 13, "priority": "VÀNG", "title": "Vì sao mô hình sâu hơn như M5 không nhất thiết tốt hơn?", "content": "## 13.1. Bản trả lời nhanh\n\n> **Nhiều layer tăng receptive field graph và capacity nhưng cũng tăng khó tối ưu, nguy cơ over-smoothing, overfitting và tích lũy dropout. Với `d_model` cố định, tăng head làm mỗi head hẹp hơn. Dataset nhỏ và graph local có thể không cần mô hình lớn hơn.**\n>\n> **Kết quả M5 chỉ cho thấy cấu hình 2L8H hiện tại kém hơn M4; chưa chứng minh nguyên nhân duy nhất là over-smoothing.**\n\n## 13.2. Các cơ chế có thể xảy ra\n\n### Over-smoothing\n\nEmbedding các node trở nên giống nhau:\n\n$$ \\operatorname{cos}(h_i,h_j)\\uparrow $$\n\n### Overfitting\n\nTrain loss giảm nhưng validation metric kém.\n\n### Optimization\n\n- gradient khó;\n- learning rate chưa phù hợp;\n- scheduler không giảm trong 100 epoch nếu milestone là 300/350.\n\n### Head dimension\n\n- M4: 64/head;\n- M5: 32/head.\n\n### Dropout\n\nAttention dropout ở nhiều layer làm luồng message bất ổn hơn.\n\n### Cách kiểm chứng\n\n- train/val curves;\n- node similarity theo layer;\n- 1L8H và 2L4H;\n- nhiều seed;\n- parameter-matched baseline.\n\n---"}, {"global_id": 78, "local_id": 14, "priority": "VÀNG", "title": "Có thể tách ảnh hưởng của số layer, số head, d_model và dropout bằng thí nghiệm nào?", "content": "## 14.1. Bản trả lời nhanh\n\n> **Dùng factorial hoặc one-factor-at-a-time ablation. Giữ ba yếu tố cố định và chỉ đổi một yếu tố, chạy nhiều seed. Tối thiểu cần 1L4H, 1L8H, 2L4H, 2L8H với cùng d_model/dropout; sau đó đổi d_model và dropout riêng.**\n\n## 14.2. Ma trận tối thiểu\n\n| Run | Layers | Heads | d_model | Dropout |\n|---|---:|---:|---:|---:|\n| A | 1 | 4 | 256 | 0,2 |\n| B | 1 | 8 | 256 | 0,2 |\n| C | 2 | 4 | 256 | 0,2 |\n| D | 2 | 8 | 256 | 0,2 |\n| E | 1 | 4 | 128 | 0,2 |\n| F | 1 | 4 | 512 | 0,2 |\n| G | 1 | 4 | 256 | 0,0 |\n| H | 1 | 4 | 256 | 0,4 |\n\nMỗi run ít nhất 3 seed.\n\n### Phân tích tương tác\n\nFactorial design cho biết layer × head có interaction hay không. Chỉ so M4 với M5 không tách được.\n\n---"}, {"global_id": 79, "local_id": 15, "priority": "BẪY", "title": "Nếu M3 chỉ tốt hơn M1 trên một test set nhưng thấp hơn ở hai test set khác, có được gọi M3 là tốt hơn không?", "content": "## 15.1. Bản trả lời nhanh\n\n> **Không được gọi M3 tốt hơn một cách tổng quát. Chỉ được nói M3 đạt ExpRate cao hơn M1 trên CROHME 2016 với chênh lệch 0,09 điểm phần trăm, nhưng thấp hơn trên 2014, 2019 và thấp hơn trung bình.**\n>\n> **Với một run duy nhất, chênh lệch 0,09 còn có thể nằm trong dao động seed.**\n\n## 15.2. Cách viết đúng\n\n> **M3 phục hồi đáng kể so với M2 và đạt kết quả tương đương baseline; lợi ích chưa ổn định xuyên tập kiểm thử.**\n\nKhông viết:\n\n> **M3 vượt baseline.**\n\n### Cần nhiều seed\n\nNếu mean ± std chồng nhau, không thể gọi khác biệt có ý nghĩa.\n\n---"}, {"global_id": 80, "local_id": 16, "priority": "BẪY", "title": "Nếu nhiều thay đổi được đưa vào M4 cùng lúc, làm sao biết thành phần nào thật sự tạo ra cải thiện?", "content": "## 16.1. Bản trả lời nhanh\n\n> **Không thể biết chắc từ bảng hiện tại. M4 đồng thời đổi connectivity, relative bias, số layer và số head nên có confounding. Muốn tách phải xây ablation tuần tự giữ nguyên các yếu tố còn lại.**\n>\n> **Đây là hạn chế thực nghiệm phải thừa nhận, không nên quy Mean Edit Distance tốt hơn riêng cho relative bias.**\n\n## 16.2. Chuỗi ablation đề xuất\n\n| Bước | Graph | Bias | Layers | Heads | Mục đích |\n|---|---|---|---:|---:|---|\n| A | 4-neighbor | Không | 2 | 8 | M3 control |\n| B | 8-neighbor | Không | 2 | 8 | Connectivity |\n| C | 8-neighbor | Có | 2 | 8 | Relative bias |\n| D | 8-neighbor | Có | 1 | 8 | Depth |\n| E | 8-neighbor | Có | 1 | 4 | Heads |\n\n### Kết luận hiện tại phải dùng\n\n> **Gói thiết kế M4 đạt MED tốt nhất. Thành phần đóng góp chính xác cần thí nghiệm tách biến.**\n\n---"}], "extras": [{"title": "Phụ lục A — Bản trả lời tổng hợp khoảng hai phút", "content": "> **M1 là baseline DenseNet–Transformer không GAT và hiện có Avg ExpRate tốt nhất 50,10%. M2 chèn GAT 2 lớp 8 head sau khi feature đã có PE; kết quả giảm còn 47,84%, cho thấy naive insertion không hiệu quả. M3 chuyển PE ra sau GAT, phục hồi lên 49,17% và giảm MED còn 2,14, nên thứ tự PE có ảnh hưởng rõ.**\n>\n> **M4 dùng 8-neighbor graph, relative directional bias 9 trạng thái, PE sau GAT và cấu hình gọn 1 lớp 4 head. Nó không vượt baseline về Exact Match nhưng có MED tốt nhất 2,06, nghĩa là prediction gần ground truth hơn trung bình. M5 tăng lên 2 lớp 8 head nhưng giảm mạnh còn 43,35% ExpRate, cho thấy tăng capacity không tự động tốt hơn.**\n>\n> **Kết luận của chuỗi ablation không phải GAT tốt hơn Transformer. Kết luận là hiệu quả của GAT phụ thuộc vào cách đưa vị trí và độ sâu; PE sau GAT tốt hơn PE trước trong thiết lập đã thử; cấu hình M4 có trade-off tốt về error severity; còn M5 là negative result. M4 thay nhiều biến cùng lúc nên cần ablation tách connectivity, bias, layer và head trước khi quy nguyên nhân.**"}, {"title": "Phụ lục B — Checklist bằng chứng", "content": "- [ ] Config và commit riêng cho M1–M5.\n- [ ] Parameter count.\n- [ ] Best epoch và checkpoint hash.\n- [ ] Cùng data/preprocessing/beam.\n- [ ] Ít nhất 3 seed.\n- [ ] Histogram edit distance.\n- [ ] Ablation tách 4/8-neighbor.\n- [ ] Bias on/off.\n- [ ] 1L/2L và 4H/8H riêng.\n- [ ] Node similarity để kiểm tra over-smoothing.\n- [ ] Linear probe vị trí để kiểm tra PE blurring."}]}, {"group_id": 8, "title": "Huấn luyện và hyperparameter", "intro": "# NHÓM 8 — HUẤN LUYỆN VÀ HYPERPARAMETER\n\n> **Mục tiêu nhóm:** Nắm rõ cấu hình train thực tế, lý do chọn siêu tham số và cách nhận diện underfitting, overfitting, bất ổn tối ưu.\n\n---\n\n## 0. Cấu hình mặc định đang thể hiện trong repo\n\n| Thành phần | Giá trị |\n|---|---|\n| Seed | 7 |\n| Deterministic | `true` |\n| GPU | 1 |\n| Precision | 16-bit mixed precision |\n| Max epochs | 100 |\n| Validation frequency | Mỗi 2 epoch |\n| Checkpoint monitor | `val_ExpRate` |\n| Train batch size | 8 |\n| Eval batch size | 2 |\n| Optimizer thực tế | Adadelta |\n| Learning rate | 1,0 |\n| Epsilon | $10^{-6}$ |\n| Weight decay | $10^{-4}$ |\n| Scheduler | MultiStepLR |\n| Milestones | 300, 350 |\n| Gamma | 0,1 |\n| Gradient accumulation | Không thấy cấu hình, mặc định 1 nếu không override |\n| Early stopping | Không thấy callback active |\n| d_model | 256 |\n| Decoder layers | 3 |\n| Decoder heads | 8 |\n| Decoder dropout | 0,3 |\n| GAT dropout | 0,2 trong config chính |\n| Beam size | 10 |\n| Max decode length | 150 |\n\n> **Cảnh báo:** Đây là cấu hình đang commit. Báo cáo M1–M5 phải lấy config và log lưu cùng từng run, vì notebook/Kaggle có thể override.\n\n---", "questions": [{"global_id": 81, "local_id": 1, "priority": "ĐỎ", "title": "Optimizer, learning rate, scheduler và weight decay thực tế trong repo là gì?", "content": "## 1.1. Bản trả lời nhanh\n\n> **Code `configure_optimizers()` hiện dùng Adadelta với learning rate lấy từ config, mặc định 1,0; epsilon $10^{-6}$ và weight decay $10^{-4}$. Scheduler là MultiStepLR, gamma 0,1 tại milestone 300 và 350. AdamW có xuất hiện trong code nhưng đang bị comment, nên không phải optimizer thực tế của run theo code hiện tại.**\n>\n> **Với max epoch 100, milestone 300/350 không bao giờ được chạm nếu không có override; do đó learning rate thực tế có thể giữ nguyên suốt run. Đây là điểm cần nêu và kiểm tra log.**\n\n## 1.2. Công thức cập nhật và vai trò\n\nAdadelta điều chỉnh bước cập nhật theo lịch sử bình phương gradient và update. Trực giác:\n\n- không yêu cầu thiết kế decay schedule phức tạp ngay từ đầu;\n- từng tham số có effective step size thích nghi;\n- từng được dùng trong nhiều hệ HMER encoder–decoder.\n\nWeight decay thêm regularization:\n\n$$ \\theta \\leftarrow \\theta-\\eta\\lambda\\theta $$\n\nvới:\n\n$$ \\lambda=10^{-4} $$\n\n### Scheduler\n\nMultiStepLR:\n\n$$ \\eta_t = \\eta_0\\gamma^{m(t)} $$\n\ntrong đó $m(t)$ là số milestone đã vượt.\n\nNhưng nếu:\n\n$$ t_{\\max}=100 \\lt 300 $$\n\nthì:\n\n$$ m(t)=0 $$\n\nvà scheduler không giảm LR.\n\n## 1.3. Điều phải xác minh\n\n- Log learning rate từng epoch.\n- Run M1–M5 có max epoch >350 hay không.\n- Notebook có override milestones không.\n- Best checkpoint ở epoch nào.\n- Có resume training làm epoch global vượt 300 không.\n\n## 1.4. Không nên nói\n\n- “Optimizer là AdamW.”\n- “Scheduler giảm LR khi validation không cải thiện.”\n- “Learning rate đã giảm ở epoch 30/35.”\n- “Adadelta chắc chắn tốt nhất.”\n\n---"}, {"global_id": 82, "local_id": 2, "priority": "ĐỎ", "title": "Batch size train, validation và gradient accumulation được thiết lập ra sao?", "content": "## 2.1. Bản trả lời nhanh\n\n> **Config hiện đặt train batch size 8 và eval batch size 2. Tuy nhiên dataloader còn gom batch động theo kích thước ảnh để kiểm soát tổng diện tích, nên số expression thực tế trong một batch có thể phụ thuộc shape và giới hạn bộ nhớ. Repo không thấy cấu hình gradient accumulation, nên mặc định là 1 nếu Lightning không được override ở lệnh chạy.**\n\n## 2.2. Batch size danh nghĩa và batch động\n\nTrong HMER, ảnh có width rất khác nhau. Nếu chỉ dùng batch count cố định:\n\n- batch ảnh dài dễ OOM;\n- batch ảnh ngắn lãng phí VRAM ít hơn.\n\nRepo sort/gom theo diện tích và giới hạn:\n\n$$ A_{\\max}\\times B $$\n\nnên “batch size 8” là giới hạn tối đa hoặc tham số mục tiêu, không nhất thiết mọi step đều có đúng 8 expression.\n\n### Effective batch size\n\nNếu có gradient accumulation $G$:\n\n$$ B_{\\text{effective}} = B_{\\text{per GPU}}\\times N_{\\text{GPU}}\\times G $$\n\nVới config hiện thấy:\n\n$$ 8\\times1\\times1=8 $$\n\nnhưng phải kiểm tra run logs.\n\n### Validation batch 2\n\nBeam search và memory ảnh làm evaluation tốn VRAM, nên batch nhỏ hơn train có thể hợp lý.\n\n## 2.3. Câu hỏi truy tiếp\n\n**“Batch nhỏ có làm kết quả kém không?”**\n\n> Có thể làm gradient nhiễu hơn, nhưng không thể quy toàn bộ kết quả thấp cho batch size. Adadelta, BatchNorm behavior, gradient variance và data ordering đều liên quan. Cần thử accumulation hoặc batch khác trong controlled experiment.\n\n## 2.4. Không nên nói\n\n- “Mọi batch đúng 8 mẫu.”\n- “Không có accumulation chắc chắn.”\n- “Batch nhỏ là nguyên nhân chính.”\n- “Hai GPU thì batch tự động gấp đôi” nếu DDP/config chưa xác nhận.\n\n---"}, {"global_id": 83, "local_id": 3, "priority": "ĐỎ", "title": "Checkpoint tốt nhất được chọn theo metric nào và vì sao?", "content": "## 3.1. Bản trả lời nhanh\n\n> **Checkpoint được monitor theo `val_ExpRate`, mode `max`, giữ top 1. Lý do hợp lý là ExpRate là metric mục tiêu cuối cùng: toàn chuỗi LaTeX phải đúng.**\n>\n> **Nhưng repo hiện dùng `test_folder: 2014` cho cả validation và test, nên chọn checkpoint theo CROHME 2014 làm score 2014 không còn hoàn toàn độc lập. Đây là model-selection contamination cần sửa hoặc khai báo.**\n\n## 3.2. Vì sao không chọn train loss?\n\nLoss:\n\n- differentiable;\n- dùng để tối ưu;\n- không đồng nhất với Exact Match.\n\nMột model loss thấp hơn có thể phân bố xác suất tốt hơn nhưng beam output vẫn không tăng exact sequence.\n\nCheckpoint theo ExpRate phù hợp mục tiêu application, nhưng metric có thể dao động mạnh. Có thể cân nhắc:\n\n- val ExpRate chính;\n- val loss phụ;\n- Mean Edit Distance phụ;\n- patience/smoothing nếu nhiều seed.\n\n## 3.3. Rủi ro selection bias\n\nNếu mỗi model chọn checkpoint tốt nhất trên cùng test benchmark, rồi so score đó:\n\n- score bị optimistic;\n- đặc biệt khi đánh giá nhiều epoch;\n- càng nhiều trial, selection bias càng cao.\n\nProtocol tốt:\n\n- validation nội bộ;\n- test một lần sau chốt.\n\n## 3.4. Không nên nói\n\n- “Checkpoint chọn theo validation loss.”\n- “2014 hoàn toàn untouched.”\n- “Top checkpoint cao nhất chắc chắn tổng quát nhất.”\n\n---"}, {"global_id": 84, "local_id": 4, "priority": "ĐỎ", "title": "Số epoch tối đa, early stopping và tần suất đánh giá được cấu hình thế nào?", "content": "## 4.1. Bản trả lời nhanh\n\n> **Config hiện đặt tối đa 100 epoch và chạy validation mỗi 2 epoch. Repo không thấy EarlyStopping callback active; có các dòng liên quan patience/ReduceLROnPlateau nhưng không phải scheduler đang chạy. Vì vậy model thường train tới max epoch, đồng thời giữ checkpoint có `val_ExpRate` cao nhất.**\n>\n> **Nếu run thực tế có 150 epoch hoặc early stopping khác, phải lấy từ log của run, không lấy từ chuyên đề cũ hoặc trí nhớ.**\n\n## 4.2. Phân biệt ba cơ chế\n\n### Max epochs\n\nGiới hạn cứng số epoch.\n\n### Checkpointing\n\nLưu model tốt nhất nhưng không dừng train.\n\n### Early stopping\n\nDừng khi metric không cải thiện trong patience.\n\nRepo hiện có checkpointing, chưa thấy early stopping active.\n\n### Validation every 2 epochs\n\nNếu max 100:\n\n- tối đa khoảng 50 lần validation;\n- best checkpoint nằm ở một trong các mốc đó;\n- metric giữa hai mốc không được đo.\n\n## 4.3. Có phải 100 epoch là ít?\n\nKhông thể kết luận chỉ từ số epoch. Cần xem:\n\n- train loss còn giảm không;\n- val ExpRate plateau chưa;\n- LR có thay đổi không;\n- overfit gap;\n- gradient norm;\n- best epoch.\n\n100 epoch với LR không decay có thể khác hoàn toàn 100 epoch với schedule tốt.\n\n## 4.4. Không nên nói\n\n- “Có early stopping 20 epoch.”\n- “Train 100 epoch vì model đã hội tụ.”\n- “Nhiều epoch luôn tốt hơn.”\n- “150 epoch chắc chắn là run thực tế” nếu log không có.\n\n---"}, {"global_id": 85, "local_id": 5, "priority": "VÀNG", "title": "Vì sao chọn optimizer hiện tại thay vì AdamW hoặc SGD?", "content": "## 5.1. Bản trả lời nhanh\n\n> **Lý do thực tế là Adadelta kế thừa từ pipeline HMER/TAMER và cho phép tối ưu ổn định với learning rate danh nghĩa lớn mà không cần momentum schedule phức tạp. Tuy nhiên repo chưa có optimizer ablation, nên em không được nói Adadelta tốt hơn AdamW hoặc SGD.**\n>\n> **Cách trả lời khoa học là: em giữ optimizer của baseline để cô lập tác động kiến trúc; optimizer comparison là hướng bổ sung.**\n\n## 5.2. So sánh khái quát\n\n### Adadelta\n\n- adaptive per-parameter;\n- ít phụ thuộc absolute gradient scale;\n- lịch sử dùng trong HMER.\n\n### AdamW\n\n- momentum bậc nhất và bậc hai;\n- decoupled weight decay;\n- phổ biến với Transformer;\n- cần tune LR/warmup.\n\n### SGD\n\n- đơn giản;\n- có thể tổng quát tốt;\n- thường cần schedule và momentum kỹ;\n- khó hơn với transformer hybrid nếu không tune.\n\n### Thiết kế so sánh\n\nCùng:\n\n- seed;\n- epochs;\n- batch;\n- schedule budget;\n- weight decay search;\n- best validation criterion.\n\nKhông so một AdamW chưa tune với Adadelta đã tune.\n\n## 5.3. Không nên nói\n\n- “AdamW không phù hợp GAT.”\n- “SGD không train được Transformer.”\n- “Adadelta không cần learning rate.”\n- “Giữ optimizer cũ là bằng chứng tối ưu.”\n\n---"}, {"global_id": 86, "local_id": 6, "priority": "VÀNG", "title": "Mixed precision/FP16 được dùng như thế nào và có kiểm soát overflow hay không?", "content": "## 6.1. Bản trả lời nhanh\n\n> **Trainer đặt precision 16, nên Lightning/PyTorch chạy automatic mixed precision: nhiều phép tính dùng FP16, còn một số state và phép nhạy cảm được giữ FP32 tùy backend. Gradient scaling thường được framework dùng để giảm underflow và phát hiện overflow.**\n>\n> **Tuy nhiên muốn khẳng định không có overflow, em phải kiểm tra log scaler, skipped steps, NaN/Inf và gradient. Chỉ bật FP16 không chứng minh tính ổn định.**\n\n## 6.2. Lợi ích\n\n- giảm VRAM;\n- tăng throughput trên T4;\n- cho batch/resolution lớn hơn.\n\n### Rủi ro\n\n- underflow gradient;\n- overflow attention logits;\n- NaN softmax;\n- loss scaling dao động;\n- giảm chính xác số học.\n\n### Điểm nhạy cảm\n\n- softmax;\n- attention score;\n- LayerNorm;\n- loss;\n- GAT dense logits có `-inf`.\n\nFramework thường xử lý nhiều phần, nhưng cần profile.\n\n### Bằng chứng nên có\n\n- không NaN/Inf trong loss;\n- số skipped optimizer steps;\n- dynamic scale curve;\n- so một run FP32 ngắn;\n- reproducibility.\n\n## 6.3. Không nên nói\n\n- “FP16 làm chính xác giảm chắc chắn.”\n- “FP16 giống FP32 hoàn toàn.”\n- “Có GradScaler nên không thể overflow.”\n- “SOTA đều dùng FP32” nếu chưa kiểm chứng từng paper.\n\n---"}, {"global_id": 87, "local_id": 7, "priority": "VÀNG", "title": "Teacher forcing, label smoothing hoặc dropout có được sử dụng không?", "content": "## 7.1. Bản trả lời nhanh\n\n> **Teacher forcing được dùng theo nghĩa decoder train nhận chuỗi target đã dịch phải/trái làm prefix ground truth. Repo không thấy label smoothing trong cross-entropy hiện tại. Dropout có ở DenseNet, decoder và GAT; config chính lần lượt khoảng 0,2, 0,3 và 0,2.**\n>\n> **Beam search chỉ dùng evaluation, không thay teacher forcing trong training.**\n\n## 7.2. Teacher forcing\n\nTraining tối ưu:\n\n$$ p(y_t\\mid y_{ \\lt t}^{GT},X) $$\n\nInference dùng:\n\n$$ p(y_t\\mid \\hat y_{ \\lt t},X) $$\n\nKhoảng cách này gây exposure bias.\n\n### Label smoothing\n\nNếu dùng:\n\n$$ q(y)= (1-\\epsilon)\\mathbf{1}[y=y^*] + \\frac{\\epsilon}{V} $$\n\nNhưng code hiện chưa thấy `label_smoothing`.\n\n### Dropout\n\n- DenseNet dropout trong dense layer;\n- Transformer dropout;\n- attention/GAT dropout.\n\nDropout quá cao có thể:\n\n- regularize;\n- nhưng làm message passing mất ổn định.\n\n## 7.3. Không nên nói\n\n- “Không có teacher forcing.”\n- “Có label smoothing 0,1.”\n- “Dropout chỉ ở decoder.”\n- “Teacher forcing là lỗi của model.”\n\n---"}, {"global_id": 88, "local_id": 8, "priority": "VÀNG", "title": "Random seed được cố định ở đâu và kết quả có lặp lại ổn định không?", "content": "## 8.1. Bản trả lời nhanh\n\n> **Config đặt seed 7 và deterministic true; Lightning có thể seed Python, NumPy và PyTorch khi gọi đúng utility. Tuy nhiên một seed duy nhất không chứng minh kết quả ổn định. CUDA, dataloader workers, AMP và một số kernel vẫn có thể gây sai khác nếu chưa cấu hình đầy đủ.**\n>\n> **Muốn kết luận lặp lại, phải chạy ít nhất 3–5 seed và báo cáo mean ± standard deviation.**\n\n## 8.2. Các nguồn nondeterminism\n\n- cuDNN kernels;\n- multi-worker dataloader;\n- operation atomic;\n- AMP;\n- graph construction cache;\n- shuffle;\n- checkpoint resume;\n- package versions.\n\n### Artifact tái lập\n\n- seed;\n- deterministic flags;\n- CUDA/cuDNN version;\n- PyTorch/Lightning version;\n- GPU;\n- commit hash;\n- data checksum.\n\n### Báo cáo\n\n$$ \\bar{x} = \\frac{1}{K}\\sum_{k=1}^{K}x_k $$\n\n$$ s = \\sqrt{ \\frac{1}{K-1} \\sum_k(x_k-\\bar{x})^2 } $$\n\n## 8.3. Không nên nói\n\n- “Có seed nên kết quả chắc chắn giống.”\n- “Một run là đủ.”\n- “Chênh 0,09% chắc chắn có ý nghĩa.”\n- “Deterministic true xử lý mọi nondeterminism.”\n\n---"}, {"global_id": 89, "local_id": 9, "priority": "BẪY", "title": "Có thể giải thích mọi kết quả thấp bằng GPU yếu hoặc số epoch ít hay không?", "content": "## 9.1. Bản trả lời nhanh\n\n> **Không. GPU chủ yếu ảnh hưởng thời gian, batch và resolution; nó không tự quyết định accuracy nếu protocol tương đương. Số epoch ít chỉ là nguyên nhân khi curve cho thấy model chưa hội tụ. Kết quả thấp còn có thể do kiến trúc, data, optimizer, LR schedule, preprocessing, vocabulary, decoding hoặc seed.**\n>\n> **Đổ mọi thứ cho phần cứng là giải thích không có bằng chứng.**\n\n## 9.2. Khi nào GPU gián tiếp ảnh hưởng?\n\n- buộc batch nhỏ;\n- buộc resolution thấp;\n- giới hạn beam;\n- giảm số trial;\n- dùng FP16;\n- không chạy nhiều seed.\n\nNhưng mỗi tác động phải đo.\n\n### Khi nào “train chưa đủ epoch” hợp lý?\n\n- train và val metric còn tăng;\n- loss chưa plateau;\n- best epoch sát max epoch;\n- LR schedule chưa kích hoạt;\n- train thêm tạo cải thiện lặp lại.\n\n### Khi nào không hợp lý?\n\n- val metric đã giảm;\n- gap train–val tăng;\n- loss giảm nhưng exact không tăng;\n- model overfit.\n\n## 9.3. Không nên nói\n\n- “Do T4 yếu.”\n- “Thêm GPU sẽ tăng ExpRate.”\n- “Train 400 epoch chắc chắn đạt paper.”\n- “FP16 là nguyên nhân chính” khi chưa có FP32 control.\n\n---"}, {"global_id": 90, "local_id": 10, "priority": "BẪY", "title": "Train loss tiếp tục giảm nhưng ExpRate không tăng có thể do những nguyên nhân nào?", "content": "## 10.1. Bản trả lời nhanh\n\n> **Cross-entropy là metric mềm theo xác suất từng token, còn ExpRate là quyết định cứng toàn chuỗi. Loss có thể giảm vì model tự tin hơn ở các token đã đúng hoặc sửa một phần lỗi, nhưng nhiều chuỗi vẫn còn ít nhất một token sai nên Exact Match không đổi.**\n>\n> **Ngoài ra có thể do overfitting, exposure bias, beam search, class imbalance, calibration hoặc loss phụ trợ không đồng hướng với ExpRate.**\n\n## 10.2. Các cơ chế\n\n### Metric mismatch\n\nMột mẫu từ 5 lỗi xuống 1 lỗi:\n\n- loss giảm;\n- edit distance giảm;\n- ExpRate vẫn 0.\n\n### Confidence without correction\n\nModel tăng xác suất token đúng ở vị trí dễ, nhưng vị trí khó vẫn sai.\n\n### Overfitting\n\n- train loss giảm;\n- val loss/ExpRate không tăng hoặc giảm.\n\n### Sequence-level mismatch\n\nTeacher-forced loss không tối ưu trực tiếp beam Exact Match.\n\n### Auxiliary loss trade-off\n\nStructure loss có thể giảm nhưng không chuyển thành sequence exact.\n\n### Decoding bottleneck\n\n- beam size;\n- length normalization;\n- EOS bias;\n- max length.\n\n### Cách chẩn đoán\n\n- train/val loss riêng;\n- token accuracy;\n- histogram edit distance;\n- sequence length bins;\n- calibration;\n- oracle beam accuracy;\n- loss component curves.\n\n## 10.3. Oracle beam test\n\nNếu ground truth xuất hiện trong top-k beam nhưng top-1 sai:\n\n- encoder/decoder có candidate đúng;\n- ranking/decoding là vấn đề.\n\nNếu không xuất hiện:\n\n- representation/model probability còn yếu.\n\n## 10.4. Không nên nói\n\n- “Loss giảm nên model chắc chắn tốt hơn.”\n- “ExpRate không tăng vì metric quá khắt khe” rồi bỏ qua.\n- “Chỉ cần train tiếp.”\n- “Overfitting” khi chưa xem validation curve.\n\n---"}], "extras": [{"title": "Phụ lục A — Bản trả lời tổng hợp khoảng hai phút", "content": "> **Cấu hình repo hiện dùng Adadelta, learning rate 1,0, epsilon $10^{-6}$, weight decay $10^{-4}$ và MultiStepLR milestone 300/350. Max epoch lại là 100 nên nếu không override, scheduler thực tế không giảm LR. Train batch danh nghĩa 8, eval 2, không thấy gradient accumulation và không thấy EarlyStopping callback active; validation chạy mỗi 2 epoch và top checkpoint được chọn theo `val_ExpRate`.**\n>\n> **Trainer dùng FP16 mixed precision. Framework thường dùng gradient scaling nhưng em phải kiểm tra log overflow/NaN trước khi khẳng định ổn định. Training dùng teacher forcing; chưa thấy label smoothing; dropout tồn tại ở DenseNet, decoder và GAT. Seed 7 và deterministic true giúp tái lập nhưng một seed không đủ chứng minh ổn định.**\n>\n> **Em không giải thích kết quả thấp bằng GPU yếu hoặc ít epoch nếu chưa có curve. GPU chỉ ảnh hưởng gián tiếp qua batch, resolution và số trial. Train loss giảm nhưng ExpRate không tăng có thể do mismatch giữa token-level loss và sequence exact, overfitting, exposure bias hoặc decoding. Do đó em cần log learning rate, gradient, loss components, nhiều seed và oracle beam analysis.**"}, {"title": "Phụ lục B — Checklist log bắt buộc", "content": "- [ ] Config cuối sau override.\n- [ ] Commit hash.\n- [ ] Data checksum.\n- [ ] GPU, CUDA, PyTorch, Lightning.\n- [ ] Epoch/step.\n- [ ] Learning rate theo epoch.\n- [ ] Train loss, structure loss, val loss.\n- [ ] Val ExpRate, ≤1, ≤2, MED.\n- [ ] Gradient norm và NaN/Inf.\n- [ ] AMP scale/skipped steps nếu truy được.\n- [ ] Best checkpoint hash.\n- [ ] Seed và nhiều run."}]}, {"group_id": 9, "title": "Metric và quy trình đánh giá", "intro": "# NHÓM 9 — METRIC VÀ QUY TRÌNH ĐÁNH GIÁ\n\n> **Mục tiêu nhóm:** Trả lời chính xác “đo cái gì”, “đo trên đơn vị nào”, “cao hay thấp thì tốt” và “metric được tính trong code ra sao”.\n\n---\n\n## 0. Bảng nhớ nhanh\n\n| Metric | Đơn vị | Tốt hơn khi | Ý nghĩa |\n|---|---|---|---|\n| ExpRate / Exact Match | Biểu thức | Cao | Tỷ lệ toàn chuỗi đúng hoàn toàn |\n| ≤1 error | Biểu thức | Cao | Tỷ lệ có token edit distance không quá 1 |\n| ≤2 errors | Biểu thức | Cao | Tỷ lệ có token edit distance không quá 2 |\n| Mean Edit Distance | Phép chỉnh sửa token / biểu thức | Thấp | Mức sai trung bình |\n| Cross-entropy loss | Token/probability | Thấp trong cùng protocol | Mục tiêu tối ưu, không phải accuracy |\n| Symbol Accuracy | Token/ký hiệu | Cao | Độ đúng cục bộ, cần định nghĩa alignment |\n| Syntax Error Rate | Chuỗi | Thấp | Tỷ lệ output không hợp lệ theo parser/rule |\n| Detection F1 | Bounding box | Cao | Chỉ phù hợp nếu có detector và GT box |\n\n---", "questions": [{"global_id": 91, "local_id": 1, "priority": "ĐỎ", "title": "ExpRate/Exact Match được định nghĩa chính xác như thế nào?", "content": "## 1.1. Bản trả lời nhanh\n\n> **ExpRate là tỷ lệ biểu thức có chuỗi token dự đoán trùng hoàn toàn với chuỗi token ground truth theo protocol đánh giá. Với $N$ mẫu:**\n>\n> $$\n>\n> \\operatorname{ExpRate}\n> =\n> \\frac{1}{N}\n> \\sum_{i=1}^{N}\n> \\mathbf{1}[\\hat Y_i=Y_i]\n>\n$$\n>\n> **Cao hơn là tốt hơn. Chỉ cần sai, thiếu hoặc thừa một token thì mẫu đó có Exact Match bằng 0.**\n\n## 1.2. Giải thích chi tiết\n\nĐơn vị quan sát là **toàn biểu thức**, không phải ký hiệu.\n\nVí dụ ground truth:\n\n```latex\n\\frac { x } { y }\n```\n\nDự đoán thiếu một `}`:\n\n```latex\n\\frac { x } { y\n```\n\nMẫu bị tính sai hoàn toàn trong ExpRate.\n\n### ExpRate không đo gì?\n\n- không đo tương đương đại số;\n- không phản ánh số lỗi trong một mẫu sai;\n- không cho biết lỗi ở encoder hay decoder;\n- không cho biết syntax hợp lệ;\n- không đo confidence.\n\n### Vì sao đây là metric chính?\n\nĐối với HMER, một sai khác nhỏ có thể đổi nghĩa:\n\n```latex\nx ^ { 2 }\n```\n\nkhác:\n\n```latex\nx _ { 2 }\n```\n\nExact Match buộc model đúng cả ký hiệu và cấu trúc tuần tự hóa.\n\n## 1.3. Không nên nói\n\n- “ExpRate là accuracy từng token.”\n- “Sai một token vẫn được tính một phần.”\n- “ExpRate đo biểu thức tương đương toán học.”\n- “ExpRate cao chứng minh model hiểu toán.”\n\n---"}, {"global_id": 92, "local_id": 2, "priority": "ĐỎ", "title": "Một mẫu sai một token có được tính là đúng một phần trong ExpRate hay không?", "content": "## 2.1. Bản trả lời nhanh\n\n> **Không. Trong ExpRate, một mẫu chỉ có giá trị 1 hoặc 0. Sai một token, thiếu một token hoặc thừa một token đều làm mẫu bằng 0. Mức gần đúng chỉ được phản ánh ở ≤1 error, ≤2 errors hoặc edit distance.**\n\n## 2.2. Minh họa\n\nGround truth:\n\n```text\nx ^ { 2 }\n```\n\nPrediction:\n\n```text\nx _ { 2 }\n```\n\nEdit distance token bằng 1, nhưng:\n\n$$ \\mathbf{1}[\\hat Y=Y]=0 $$\n\nTrong tổng metric:\n\n- ExpRate: mẫu sai;\n- ≤1: mẫu đúng điều kiện;\n- ≤2: mẫu đúng điều kiện;\n- edit distance: 1.\n\n### Vì sao cần nhiều metric?\n\nNếu chỉ ExpRate, hai prediction sai 1 token và sai 20 token đều bằng 0. Edit distance bổ sung mức độ nghiêm trọng.\n\n---"}, {"global_id": 93, "local_id": 3, "priority": "ĐỎ", "title": "Edit distance trong repo được tính theo token hay theo ký tự?", "content": "## 3.1. Bản trả lời nhanh\n\n> **Trong pipeline hiện tại, prediction và ground truth được chuyển thành danh sách token rồi truyền vào `editdistance.eval`, nên khoảng cách được tính theo token, không phải từng ký tự của chuỗi LaTeX đã join.**\n>\n> **Một macro như `\\frac` được tính là một token nếu vocabulary xem nó là một token.**\n\n## 3.2. Định nghĩa Levenshtein\n\nKhoảng cách nhỏ nhất gồm:\n\n- insertion;\n- deletion;\n- substitution.\n\nGọi:\n\n$$ d(\\hat Y,Y)
