 $$\n\nlà số phép chỉnh sửa token nhỏ nhất để biến prediction thành ground truth.\n\nVí dụ:\n\n```text\nGT   : \\frac { x } { y }\nPred : \\sqrt { x } { y }\n```\n\nNếu `\\frac` và `\\sqrt` là token đơn, substitution count là 1.\n\n### Tại sao phải xác nhận kiểu dữ liệu?\n\nNếu code join thành string trước khi gọi edit distance, macro có thể bị tính từng ký tự. Vì vậy phải chỉ ra biến thực tế là list token trong evaluation.\n\n### Hạn chế\n\nToken edit distance xem mọi token có cost bằng nhau:\n\n- sai `{` cost 1;\n- sai `\\int` cost 1;\n- sai một biến cost 1.\n\nNó không phản ánh mức độ semantic khác nhau.\n\n## 3.3. Không nên nói\n\n- “Edit distance là số ký tự sai.”\n- “Một macro luôn tương đương nhiều lỗi.”\n- “Edit distance đo tree structure.”\n- “Distance 1 nghĩa là sai một ký hiệu vật lý” — có thể là token cấu trúc.\n\n---"}, {"global_id": 94, "local_id": 4, "priority": "ĐỎ", "title": "Mean Edit Distance càng cao hay càng thấp càng tốt, và vì sao?", "content": "## 4.1. Bản trả lời nhanh\n\n> **Càng thấp càng tốt. Mean Edit Distance là trung bình số phép chèn, xóa hoặc thay token để biến output thành ground truth:**\n>\n> $$\n>\n> \\operatorname{MED}\n> =\n> \\frac{1}{N}\n> \\sum_{i=1}^{N}\n> d(\\hat Y_i,Y_i)\n>\n$$\n>\n> **MED bằng 0 nghĩa là tất cả biểu thức đúng hoàn toàn.**\n\n## 4.2. Cách diễn giải đúng\n\nM4 có MED 2,06 và M1 có 2,20:\n\n- trung bình M4 cần ít hơn 0,14 phép chỉnh sửa token/mẫu;\n- không có nghĩa mỗi mẫu M4 tốt hơn;\n- không có nghĩa M4 có nhiều exact matches hơn;\n- không chứng minh lỗi cấu trúc cụ thể giảm.\n\n### MED bị ảnh hưởng bởi outlier\n\nMột số mẫu cực dài và sai nhiều có thể kéo mean lên.\n\nNên báo cáo thêm:\n\n- median;\n- P90/P95;\n- histogram;\n- normalized edit distance:\n\n$$ d_{\\text{norm}} = \\frac{d(\\hat Y,Y)} {\\max(|\\hat Y|,|Y|)} $$\n\nNếu benchmark chính dùng raw MED, normalized chỉ là metric phụ.\n\n## 4.3. Không nên nói\n\n- “MED cao là tốt.”\n- “M4 chính xác nhất vì MED thấp.”\n- “Chênh 0,14 chắc chắn có ý nghĩa thống kê.”\n- “MED trực tiếp đo cấu trúc.”\n\n---"}, {"global_id": 95, "local_id": 5, "priority": "ĐỎ", "title": "Các chỉ số ≤1 error và ≤2 errors được tính như thế nào?", "content": "## 5.1. Bản trả lời nhanh\n\n> **Chúng là tỷ lệ biểu thức có token edit distance không vượt ngưỡng 1 hoặc 2:**\n>\n> $$\n>\n> R_{\\le k}\n> =\n> \\frac{1}{N}\n> \\sum_i\n> \\mathbf{1}[d(\\hat Y_i,Y_i)\\le k]\n>\n$$\n>\n> **Càng cao càng tốt. ExpRate chính là trường hợp khoảng cách bằng 0.**\n\n## 5.2. Quan hệ giữa các metric\n\nLuôn có:\n\n$$ R_{0} \\le R_{\\le1} \\le R_{\\le2} $$\n\nTrong đó:\n\n$$ R_0=\\operatorname{ExpRate} $$\n\n### Ý nghĩa\n\n- khoảng cách 0: đúng hoàn toàn;\n- khoảng cách 1: chỉ cần một chỉnh sửa;\n- khoảng cách 2: chỉ cần tối đa hai chỉnh sửa.\n\n### Không phải “accuracy 1 lỗi”\n\nNó không nói token nào sai hoặc lỗi có làm đổi nghĩa nặng hay nhẹ.\n\n### Từ bảng có thể suy count gần đúng\n\nVí dụ M4 Avg:\n\n- ExpRate 48,98%;\n- ≤1 67,43%;\n- ≤2 76,61%.\n\nTỷ lệ distance đúng 1 gần:\n\n$$ 67,43-48,98=18,45\\% $$\n\nTỷ lệ distance đúng 2 gần:\n\n$$ 76,61-67,43=9,18\\% $$\n\nĐây là phép suy từ tỷ lệ trung bình, cần cẩn thận vì average theo dataset không đồng nhất với gộp sample.\n\n## 5.3. Không nên nói\n\n- “≤1 là Symbol Accuracy.”\n- “≤2 nghĩa là sai hai ký tự.”\n- “Mọi lỗi ≤2 đều chấp nhận được trong ứng dụng.”\n\n---"}, {"global_id": 96, "local_id": 6, "priority": "ĐỎ", "title": "Kết quả được đánh giá sau khi normalize LaTeX hay trên chuỗi thô?", "content": "## 6.1. Bản trả lời nhanh\n\n> **Code hiện cho thấy prediction và ground truth được đổi từ index về token rồi so trực tiếp. Chưa thấy một bước canonicalize LaTeX semantic được gọi trước ExpRate/edit distance. Vì vậy cách nói an toàn là đánh giá trên token sequence theo định dạng đã chuẩn hóa sẵn trong dataset.**\n>\n> **Muốn khẳng định các biểu diễn tương đương được gộp, phải chỉ ra hàm normalizer cụ thể.**\n\n## 6.2. Ba lớp cần phân biệt\n\n1. Caption đã được chuẩn hóa khi tạo dataset.\n2. Tokenizer đọc caption.\n3. Evaluation-time normalization.\n\nRepo chứng minh rõ lớp 2; lớp 1 cần script nguồn; lớp 3 chưa thấy.\n\n### Hệ quả\n\nNếu prediction:\n\n```latex\nx ^ 2\n```\n\nvà GT:\n\n```latex\nx ^ { 2 }\n```\n\nthì có thể bị xem khác nếu token sequence khác.\n\n### Protocol cần viết\n\n- có bỏ SOS/EOS/PAD trước so không;\n- whitespace;\n- braces;\n- alias macro;\n- invalid tokens;\n- EOS early;\n- padding.\n\n## 6.3. Không nên nói\n\n- “Đánh giá trên LaTeX render.”\n- “Tất cả biểu diễn tương đương được normalize.”\n- “Chuỗi thô ký tự” nếu thực tế là token list.\n\n---"}, {"global_id": 97, "local_id": 7, "priority": "VÀNG", "title": "Symbol Accuracy khác ExpRate ở đâu và khi nào hai chỉ số có thể mâu thuẫn?", "content": "## 7.1. Bản trả lời nhanh\n\n> **Symbol Accuracy đo mức đúng ở cấp token/ký hiệu sau alignment, còn ExpRate đo toàn biểu thức. Symbol Accuracy có thể cao nhưng ExpRate thấp vì mỗi biểu thức chỉ cần sai một token là bị Exact Match tính sai.**\n>\n> **Repo hiện không dùng Symbol Accuracy như metric chính; nếu báo cáo phải định nghĩa alignment và denominator chính xác.**\n\n## 7.2. Ví dụ\n\n100 biểu thức, mỗi biểu thức 20 token. Model sai đúng 1 token trong mỗi biểu thức:\n\n- token accuracy xấp xỉ 95%;\n- ExpRate = 0%.\n\n### Định nghĩa có thể dùng\n\nTừ edit distance:\n\n$$ \\operatorname{TokenAccuracy} = 1- \\frac{\\sum_i d(\\hat Y_i,Y_i)} {\\sum_i |Y_i|} $$\n\nNhưng giá trị có thể âm nếu prediction rất dài, nên cần clamp hoặc định nghĩa khác.\n\nHoặc sau Levenshtein alignment:\n\n$$ \\frac{\\text{correct aligned tokens}} {\\text{GT tokens}} $$\n\nPhải công bố công thức.\n\n### Symbol Accuracy không đồng nghĩa visual symbol recognition\n\nToken gồm `{`, `}`, `\\frac`, nên “symbol” có thể là LaTeX token, không phải glyph detector class.\n\n## 7.3. Không nên nói\n\n- “Repo đạt Symbol Accuracy 80,3%” nếu script/log không có.\n- “Symbol Accuracy cao nghĩa là cấu trúc đúng.”\n- “Mỗi token là một symbol trên ảnh.”\n\n---"}, {"global_id": 98, "local_id": 8, "priority": "VÀNG", "title": "Loss khác metric đánh giá như thế nào; loss thấp có đồng nghĩa ExpRate cao không?", "content": "## 8.1. Bản trả lời nhanh\n\n> **Loss là hàm khả vi tối ưu xác suất token, còn ExpRate là quyết định rời rạc toàn chuỗi sau decoding. Loss thấp thường là tín hiệu tốt trong cùng protocol nhưng không bảo đảm ExpRate cao.**\n>\n> **Model có thể giảm loss bằng cách tăng confidence ở token đã đúng mà không sửa token sai quyết định Exact Match.**\n\n## 8.2. Cross-entropy\n\n$$ \\mathcal{L}_{CE} = -\\sum_t\\log p(y_t^{GT}\\mid y_{ \\lt t}^{GT},X) $$\n\nRepo còn có structure loss phụ.\n\n### Metric sau decoding\n\n$$ \\hat Y = \\operatorname{BeamSearch}(p_\\theta) $$\n\nsau đó so sequence.\n\n### Nguyên nhân không đồng biến hoàn toàn\n\n- teacher forcing versus autoregressive inference;\n- beam ranking;\n- calibration;\n- length bias;\n- auxiliary loss;\n- class imbalance;\n- exact-match discontinuity.\n\n### Chỉ so loss khi nào?\n\n- cùng loss definition;\n- cùng vocabulary;\n- cùng data;\n- cùng masking;\n- cùng reduction;\n- cùng sequence length treatment.\n\nKhông so raw loss giữa hai codebase khác nhau rồi xếp hạng accuracy.\n\n## 8.3. Không nên nói\n\n- “Loss thấp nhất là model tốt nhất.”\n- “Loss 0,2 tương đương 80% accuracy.”\n- “Train loss giảm chứng minh tổng quát.”\n\n---"}, {"global_id": 99, "local_id": 9, "priority": "VÀNG", "title": "Syntax Error Rate phải được định nghĩa bằng parser, quy tắc ngoặc hay bộ kiểm tra nào?", "content": "## 9.1. Bản trả lời nhanh\n\n> **Syntax Error Rate chỉ có ý nghĩa khi định nghĩa một validator cụ thể. Có thể dùng parser/renderer LaTeX trong môi trường sandbox hoặc một grammar checker token-level. Chỉ kiểm tra cân bằng ngoặc là chưa đủ để gọi toàn bộ chuỗi hợp lệ.**\n>\n> **Repo hiện không thấy Syntax Error Rate là metric chính, nên không được báo cáo con số nếu chưa có script tái lập.**\n\n## 9.2. Công thức\n\n$$ \\operatorname{SER} = \\frac{\\#\\text{output bị validator từ chối}} {N} $$\n\nCàng thấp càng tốt.\n\n### Các cấp kiểm tra\n\n1. token hợp lệ;\n2. braces cân bằng;\n3. macro đúng số argument;\n4. parser chấp nhận;\n5. renderer compile thành công.\n\nMột chuỗi có braces cân bằng vẫn có thể sai:\n\n```latex\n\\frac { x }\n```\n\n### Validator cần đảm bảo\n\n- timeout;\n- sandbox;\n- không cho lệnh nguy hiểm;\n- version cố định;\n- cùng preamble;\n- log reason.\n\n### Tách syntax và semantic\n\nChuỗi hợp lệ:\n\n```latex\nx _ { 2 }\n```\n\nnhưng GT là:\n\n```latex\nx ^ { 2 }\n```\n\nSyntax đúng, recognition sai.\n\n## 9.3. Không nên nói\n\n- “Thiếu ngoặc là mọi loại syntax error.”\n- “Render được thì nhận dạng đúng.”\n- “Syntax Error Rate 14,6%” nếu không truy được script.\n\n---"}, {"global_id": 100, "local_id": 10, "priority": "VÀNG", "title": "F1-score phù hợp với module nào và có phù hợp với recognizer không có detector hay không?", "content": "## 10.1. Bản trả lời nhanh\n\n> **F1 phù hợp cho detection, segmentation hoặc classification mất cân bằng khi có TP, FP, FN được định nghĩa rõ. Core recognizer hiện không có symbol detector hoặc bounding box output, nên detection F1 không phải metric chính phù hợp.**\n>\n> **Có thể dùng token-level F1 cho một số token, nhưng phải định nghĩa task riêng và không thay ExpRate.**\n\n## 10.2. Công thức\n\n$$ P=\\frac{TP}{TP+FP} $$\n\n$$ R=\\frac{TP}{TP+FN} $$\n\n$$ F1=\\frac{2PR}{P+R} $$\n\n### Với detector cần\n\n- ground-truth box;\n- predicted box;\n- IoU threshold;\n- class matching;\n- NMS;\n- micro/macro averaging.\n\nRepo không có các đầu ra này.\n\n### Token F1\n\nCó thể đo per-token presence, nhưng bỏ thứ tự và structure nếu chỉ dùng bag-of-token. Không phù hợp thay thế sequence metric.\n\n## 10.3. Không nên nói\n\n- “F1 của GAT là ...”\n- “F1 detection áp dụng vì feature map có node.”\n- “F1 cao nghĩa là LaTeX đúng.”\n\n---"}, {"global_id": 101, "local_id": 11, "priority": "VÀNG", "title": "Kết quả dùng greedy decoding hay beam search; beam size bao nhiêu?", "content": "## 11.1. Bản trả lời nhanh\n\n> **Evaluation hiện dùng bidirectional beam search, không phải greedy. Config đặt beam size 10, max length 150, alpha 1, temperature 1 và `early_stopping: false`.**\n>\n> **Vì decoding ảnh hưởng score, mọi model phải dùng cùng beam config.**\n\n## 11.2. Greedy versus beam\n\nGreedy:\n\n$$ \\hat y_t=\\arg\\max p(y_t\\mid\\hat y_{ \\lt t},X) $$\n\nBeam giữ $K$ hypothesis có score cao nhất.\n\n### Beam không bảo đảm tối ưu toàn cục\n\n- search vẫn hữu hạn;\n- length normalization ảnh hưởng;\n- EOS bias;\n- candidate pruning.\n\n### Bidirectional TAMER\n\nModel có thể sinh theo hai hướng và kết hợp/rerank tùy implementation. Phải mô tả đúng code, không chỉ nói “beam search thường”.\n\n### Ablation nên có\n\n- greedy;\n- beam 5;\n- beam 10;\n- beam 20;\n- latency;\n- oracle beam accuracy.\n\n## 11.3. Không nên nói\n\n- “Beam search luôn tốt hơn.”\n- “Beam 10 nghĩa là accuracy tăng 10 lần.”\n- “Training dùng beam.”\n- “Mọi paper dùng cùng beam.”\n\n---"}, {"global_id": 102, "local_id": 12, "priority": "BẪY", "title": "x^2 và x^{2} nên được xem là cùng một dự đoán hay hai dự đoán khác nhau?", "content": "## 12.1. Bản trả lời nhanh\n\n> **Theo semantic/rendering chúng có thể tương đương, nhưng theo Exact Match token-level chúng chỉ giống nếu protocol normalizer canonicalize về cùng dạng. Với repo hiện tại chưa thấy evaluation normalizer, nên nếu sequence khác thì bị tính khác.**\n>\n> **Luận văn phải báo cáo metric benchmark theo protocol và có thể thêm normalized metric phụ.**\n\n## 12.2. Nguyên tắc\n\nKhông tự sửa prediction theo GT.\n\nNormalizer phải:\n\n- deterministic;\n- áp dụng cả hai phía;\n- công khai;\n- không thay đổi semantic;\n- có unit test.\n\n### Không được canonicalize đại số\n\nKhông biến:\n\n```latex\nx+1\n```\n\nvà:\n\n```latex\n1+x\n```\n\nthành giống nhau trong recognition benchmark, dù có thể tương đương trong đại số giao hoán.\n\n---"}, {"global_id": 103, "local_id": 13, "priority": "BẪY", "title": "Có nên báo cáo kết quả tốt nhất của một lần chạy hay trung bình nhiều seed?", "content": "## 13.1. Bản trả lời nhanh\n\n> **Nên báo cáo mean ± standard deviation của nhiều seed, ít nhất cho M1, M3, M4 và M5. Một best run có thể là dao động may mắn và làm chênh lệch nhỏ như 0,09 điểm phần trăm trở nên không đáng tin.**\n>\n> **Có thể ghi best run để tái lập checkpoint, nhưng kết luận chính nên dựa trên phân bố nhiều run.**\n\n## 13.2. Báo cáo đề xuất\n\n$$ \\bar x\\pm s $$\n\nkèm:\n\n- số seed;\n- seed list;\n- best/worst;\n- confidence interval;\n- test protocol.\n\n### Khi tài nguyên hạn chế\n\n- chạy 3 seed model chính;\n- run ngắn pilot cho phần còn lại;\n- thừa nhận single-run limitation.\n\n### Không dùng test để chọn seed tốt nhất\n\nNếu train nhiều seed rồi chỉ báo cáo seed cao nhất trên test, đó là test selection bias.\n\n## 13.3. Không nên nói\n\n- “Một seed là kết quả chính thức.”\n- “Deterministic nên không cần nhiều seed.”\n- “Best checkpoint của best seed là estimate không thiên lệch.”\n\n---"}, {"global_id": 104, "local_id": 14, "priority": "BẪY", "title": "Một mô hình có edit distance tốt nhất nhưng ExpRate thấp hơn thì nên kết luận mô hình nào tốt hơn?", "content": "## 14.1. Bản trả lời nhanh\n\n> **Không có câu trả lời tuyệt đối; phụ thuộc mục tiêu. Nếu ưu tiên công thức hoàn toàn đúng, M1 tốt hơn theo Avg ExpRate. Nếu ưu tiên giảm số token cần sửa, M4 tốt hơn theo MED.**\n>\n> **Cách kết luận đúng là có trade-off, không gọi một model tốt nhất chung.**\n\n## 14.2. Theo ứng dụng\n\n### Tự động nhập công thức không hậu kiểm\n\nƯu tiên Exact Match.\n\n### Công cụ gợi ý có người sửa\n\nMED thấp có giá trị vì giảm effort chỉnh sửa.\n\n### Hệ thống chấm bài\n\nMột lỗi nhỏ vẫn có thể đổi nghĩa; cần exact/semantic check.\n\n### Cách chọn model\n\nĐịnh nghĩa utility:\n\n$$ U = w_0R_0 + w_1R_{\\le1} - w_dd - w_t\\text{latency} $$\n\nTrọng số tùy ứng dụng.\n\n### Kết luận hiện tại\n\n- M1: best exact average.\n- M4: best average error severity.\n- Chưa có significance test và latency comparison.\n\n## 14.3. Không nên nói\n\n- “M4 tốt nhất.”\n- “M1 tốt nhất mọi mặt.”\n- “MED quan trọng hơn Exact Match.”\n- “Hai metric mâu thuẫn nên bỏ một.”\n\n---"}], "extras": [{"title": "Phụ lục A — Bản trả lời tổng hợp khoảng hai phút", "content": "> **Metric chính là ExpRate: tỷ lệ toàn bộ chuỗi token trùng ground truth. Sai một token thì mẫu bằng 0. Để đo gần đúng, repo dùng token-level Levenshtein distance; ≤1 và ≤2 là tỷ lệ mẫu có distance tối đa 1 hoặc 2, còn Mean Edit Distance càng thấp càng tốt.**\n>\n> **Code hiện đánh giá trên token sequence theo định dạng dataset, chưa thấy semantic LaTeX normalizer. Vì vậy hai chuỗi render tương đương vẫn có thể bị tính khác. Loss là cross-entropy/structure loss khả vi, không đồng nghĩa ExpRate. Symbol Accuracy, Syntax Error Rate và F1 chỉ được dùng nếu có công thức và script rõ; core repo không có detector nên detection F1 không phù hợp.**\n>\n> **Evaluation dùng bidirectional beam search với beam size 10 và max length 150. Kết quả nên báo cáo nhiều seed. Với M1 và M4, kết luận đúng là trade-off: M1 có Exact Match trung bình cao nhất, M4 có MED thấp nhất. Không gọi một model tốt nhất nếu không nêu metric và mục tiêu ứng dụng.**"}, {"title": "Phụ lục B — Checklist metric", "content": "- [ ] Xác nhận list token trước `editdistance.eval`.\n- [ ] Xác nhận cách loại SOS/EOS/PAD.\n- [ ] Tài liệu normalization.\n- [ ] Cùng beam config.\n- [ ] Count distance 0/1/2/>2.\n- [ ] Histogram và median distance.\n- [ ] Syntax validator nếu báo cáo SER.\n- [ ] Nhiều seed và confidence interval.\n- [ ] Không dùng Symbol Accuracy/F1 không có script."}]}, {"group_id": 10, "title": "Phân tích kết quả giữa các dataset và mô hình", "intro": "# NHÓM 10 — PHÂN TÍCH KẾT QUẢ GIỮA CÁC DATASET VÀ MÔ HÌNH\n\n> **Mục tiêu nhóm:** Biết đọc bảng kết quả, tách quan sát khỏi giả thuyết và đưa ra cách kiểm chứng nguyên nhân.\n\n---\n\n## 0. Quy tắc ba tầng khi phân tích kết quả\n\nMọi câu trả lời nên theo cấu trúc:\n\n1. **Quan sát:** con số nào cao/thấp.\n2. **Diễn giải giới hạn:** metric đó nói được gì.\n3. **Giả thuyết và phép kiểm chứng:** vì sao có thể xảy ra và cần thí nghiệm gì.\n\nVí dụ:\n\n> **Quan sát:** M4 có Mean Edit Distance trung bình 2,06, thấp hơn M1 là 2,20.  \n> **Diễn giải:** prediction của M4 cần ít phép sửa token hơn trung bình.  \n> **Giới hạn:** M4 vẫn có Avg ExpRate thấp hơn M1.  \n> **Kiểm chứng:** xem histogram distance, cấu trúc lỗi và nhiều seed.\n\n---", "questions": [{"global_id": 105, "local_id": 1, "priority": "ĐỎ", "title": "Mô hình nào có ExpRate cao nhất trên từng test set và trung bình toàn bộ?", "content": "## 1.1. Bản trả lời nhanh\n\n> **Trên CROHME 2014, M1 cao nhất với 51,12%. Trên CROHME 2016, M3 cao nhất với 50,74%, chỉ nhỉnh hơn M1 50,65% đúng 0,09 điểm phần trăm. Trên CROHME 2019, M1 cao nhất với 48,54%. Trung bình ba tập, M1 cao nhất với 50,10%.**\n\n## 1.2. Bảng xếp hạng\n\n| Phạm vi | Mô hình cao nhất | ExpRate |\n|---|---|---:|\n| CROHME 2014 | M1 | 51,12% |\n| CROHME 2016 | M3 | 50,74% |\n| CROHME 2019 | M1 | 48,54% |\n| Trung bình | M1 | 50,10% |\n\n### Diễn giải đúng\n\n- M1 thắng hai trong ba tập và thắng trung bình.\n- M3 có một kết quả cục bộ tốt trên 2016.\n- Chênh lệch 0,09 điểm phần trăm chưa đủ gọi có ý nghĩa nếu chỉ một seed.\n- M4 không phải model có Exact Match tốt nhất.\n\n## 1.3. Không nên nói\n\n- “M3 vượt baseline.”\n- “M4 chính xác nhất.”\n- “M1 thắng mọi dataset.”\n- “0,09% là cải thiện chắc chắn.”\n\n---"}, {"global_id": 106, "local_id": 2, "priority": "ĐỎ", "title": "Mô hình nào có Mean Edit Distance thấp nhất?", "content": "## 2.1. Bản trả lời nhanh\n\n> **Trên CROHME 2014 và 2016, M4 thấp nhất lần lượt 1,98 và 2,13. Trên CROHME 2019, M3 thấp nhất với 2,02. Xét trung bình, M4 thấp nhất với 2,06.**\n\n## 2.2. Bảng\n\n| Phạm vi | Model MED thấp nhất | MED |\n|---|---|---:|\n| 2014 | M4 | 1,98 |\n| 2016 | M4 | 2,13 |\n| 2019 | M3 | 2,02 |\n| Trung bình | M4 | 2,06 |\n\n### Lưu ý\n\nM1 MED 1,99 trên 2014 chỉ kém M4 0,01. Không có nhiều seed thì chênh lệch này có thể chỉ là dao động.\n\n### Kết luận đúng\n\n> **M4 có error severity trung bình tốt nhất, không đồng nghĩa Exact Match tốt nhất.**\n\n---"}, {"global_id": 107, "local_id": 3, "priority": "ĐỎ", "title": "Kết quả chính mà luận văn có thể khẳng định chắc chắn từ bảng M1–M5 là gì?", "content": "## 3.1. Bản trả lời nhanh\n\n> **Có bốn quan sát chắc chắn trong các run hiện có: M1 có Avg ExpRate cao nhất; M2 thấp hơn M1; M3 phục hồi so với M2; M4 có Avg MED thấp nhất; M5 giảm mạnh.**\n>\n> **Từ đó có thể kết luận thứ tự PE và độ sâu GAT ảnh hưởng kết quả. Chưa thể khẳng định GAT tốt hơn baseline, relative bias một mình tạo cải thiện, hoặc nguyên nhân M5 là over-smoothing.**\n\n## 3.2. Phân biệt observation và causal claim\n\n### Quan sát trực tiếp\n\n- metric từng run;\n- ranking;\n- chênh lệch.\n\n### Suy luận được hỗ trợ\n\n- PE sau tốt hơn PE trước trong M2–M3 nếu các yếu tố khác giống.\n- Scale-up M5 không hiệu quả trong cấu hình hiện tại.\n\n### Chưa chứng minh\n\n- PE blurring;\n- over-smoothing;\n- relative bias là nguyên nhân riêng;\n- cải thiện cấu trúc semantic;\n- significance.\n\n### Câu chốt\n\n> **Bảng chứng minh sensitivity to design, không chứng minh superiority of GAT.**\n\n---"}, {"global_id": 108, "local_id": 4, "priority": "ĐỎ", "title": "Vì sao không được kết luận một mô hình tốt nhất chỉ dựa trên một metric?", "content": "## 4.1. Bản trả lời nhanh\n\n> **Mỗi metric đo một mục tiêu khác nhau. ExpRate đo số biểu thức đúng hoàn toàn; MED đo số token cần sửa trung bình; latency và parameter count đo khả năng triển khai. Một model có thể thắng metric này nhưng thua metric khác.**\n>\n> **Vì vậy phải nói “tốt nhất theo ExpRate” hoặc “tốt nhất theo MED”, không nói chung chung “tốt nhất”.**\n\n## 4.2. Ví dụ M1 và M4\n\n- M1 Avg ExpRate: 50,10%.\n- M4 Avg ExpRate: 48,98%.\n- M1 MED: 2,20.\n- M4 MED: 2,06.\n\nNếu ứng dụng yêu cầu output tự động không sửa:\n\n- ưu tiên M1.\n\nNếu có người hậu kiểm:\n\n- M4 có thể giảm số thao tác sửa.\n\n### Còn thiếu các metric triển khai\n\n- inference time;\n- VRAM;\n- parameter count;\n- syntax validity;\n- robustness;\n- confidence.\n\n## 4.3. Không nên nói\n\n- “MED là metric quan trọng nhất.”\n- “Exact Match là metric duy nhất có ý nghĩa.”\n- “M4 tốt nhất.”\n- “M1 tốt nhất mọi mặt.”\n\n---"}, {"global_id": 109, "local_id": 5, "priority": "ĐỎ", "title": "Vì sao cùng một mô hình lại cao trên CROHME 2016 nhưng thấp trên 2014 hoặc 2019?", "content": "## 5.1. Bản trả lời nhanh\n\n> **Một model tương tác với phân bố của từng test set. Các năm có thể khác về độ dài, loại cấu trúc, token hiếm, người viết, kích thước ảnh và mức giống train. Thiết kế GAT/PE có thể hợp hơn với một phân bố nhưng không ổn định trên phân bố khác.**\n>\n> **Hiện chưa có thống kê đầy đủ, nên đây là nhóm giả thuyết; không được nói 2016 dễ hơn chỉ vì M3 cao.**\n\n## 5.2. Các cơ chế có thể\n\n### Covariate shift\n\n$$ P_{2014}(X)\\ne P_{2016}(X)\\ne P_{2019}(X) $$\n\n### Label/structure shift\n\n$$ P_{2014}(Y)\\ne P_{2016}(Y)\\ne P_{2019}(Y) $$\n\n### Conditional shift\n\nCùng cấu trúc nhưng cách viết khác:\n\n$$ P(X\\mid Y) $$\n\n### Model-selection effect\n\nCROHME 2014 được dùng validation trong config hiện tại, nên score và ranking có thể chịu selection bias khác 2016/2019.\n\n### Seed variance\n\nMột run duy nhất có thể đổi ranking nhỏ.\n\n## 5.3. Cách kiểm chứng\n\n- length distribution;\n- structure frequency;\n- token frequency;\n- image statistics;\n- writer metadata;\n- matched subsets;\n- nhiều seed;\n- per-category accuracy.\n\n---"}, {"global_id": 110, "local_id": 6, "priority": "VÀNG", "title": "Khác biệt độ dài biểu thức giữa các test set có thể ảnh hưởng kết quả thế nào?", "content": "## 6.1. Bản trả lời nhanh\n\n> **Biểu thức dài có nhiều cơ hội sai token hơn, nhiều cấu trúc lồng hơn và chịu exposure bias lâu hơn. Vì Exact Match yêu cầu toàn chuỗi đúng, xác suất đúng thường giảm nhanh theo độ dài. Max decode length 150 còn có thể cắt các mẫu rất dài.**\n\n## 6.2. Trực giác xác suất\n\nNếu xác suất đúng token trung bình là $p$ và giả sử độc lập đơn giản:\n\n$$ P(\\text{toàn chuỗi đúng})\\approx p^L $$\n\nKhi $L$ tăng, Exact Match giảm ngay cả khi token accuracy không đổi.\n\nVí dụ với $p=0,98$:\n\n$$ 0,98^{10}\\approx0,817 $$\n\n$$ 0,98^{50}\\approx0,364 $$\n\nĐây chỉ là minh họa vì token không độc lập.\n\n### Các tác động khác\n\n- nhiều braces;\n- nhiều EOS risk;\n- beam search space lớn;\n- memory cross-attention dài;\n- nested context.\n\n### Phép phân tích\n\nTính ExpRate theo bin độ dài và chuẩn hóa khi so các dataset.\n\n---"}, {"global_id": 111, "local_id": 7, "priority": "VÀNG", "title": "Phân bố loại cấu trúc như phân số, căn, chỉ số và tích phân có thể gây chênh lệch ra sao?", "content": "## 7.1. Bản trả lời nhanh\n\n> **Mỗi cấu trúc đòi hỏi loại quan hệ khác nhau. Phân số cần tách tử–mẫu; căn cần xác định phạm vi; chỉ số và cận cần nhận ký hiệu nhỏ; tích phân có cận kết hợp cả token và vị trí. Nếu một test set có nhiều cấu trúc hiếm hoặc lồng hơn, model có thể giảm.**\n>\n> **Nhưng phải đếm cấu trúc trước khi dùng nó giải thích chênh lệch.**\n\n## 7.2. Các failure mode\n\n| Cấu trúc | Failure mode |\n|---|---|\n| Fraction | đảo tử/mẫu, thiếu braces |\n| Root | kết thúc phạm vi sai |\n| Superscript | mất ký hiệu nhỏ, nhầm `_` |\n| Subscript | nhầm `^`, dính baseline |\n| Integral bounds | mất cận hoặc nội dung cận |\n| Nested | sai closing order |\n\n### Phân tích cần làm\n\n- expression-level subset;\n- occurrence count;\n- nesting depth;\n- matched length;\n- M1 versus M4 per structure.\n\nKhông được gộp mọi mẫu có `^` thành “số mũ”, vì có thể là cận trên.\n\n---"}, {"global_id": 112, "local_id": 8, "priority": "VÀNG", "title": "Tần suất token hiếm hoặc ký hiệu dễ nhầm ảnh hưởng thế nào đến từng test set?", "content": "## 8.1. Bản trả lời nhanh\n\n> **Token hiếm nhận ít cập nhật gradient nên xác suất và calibration thường kém hơn. Nếu test set có tỷ lệ token hiếm hoặc cặp hình dạng dễ nhầm cao, Exact Match có thể giảm. Một token hiếm sai cũng làm cả biểu thức sai.**\n>\n> **Cần tính tần suất train của mỗi token và error rate có điều kiện, không chỉ liệt kê ví dụ.**\n\n## 8.2. Phân tích đề xuất\n\nVới token $v$:\n\n$$ f_{\\text{train}}(v) $$\n\nvà error rate:\n\n$$ E(v) = P(v\\text{ bị sai}\\mid v\\text{ xuất hiện trong GT}) $$\n\nChia frequency bin:\n\n- 1–5;\n- 6–20;\n- 21–100;\n- >100.\n\n### Confusion cần alignment\n\nVí dụ:\n\n- `1` / `l`;\n- `0` / `O`;\n- `x` / `\\times`;\n- `-` / fraction bar;\n- `c` / `(`.\n\nKhông được suy confusion chỉ từ string bag; cần Levenshtein alignment hoặc parser.\n\n---"}, {"global_id": 113, "local_id": 9, "priority": "VÀNG", "title": "Làm sao phân biệt cải thiện thật với dao động ngẫu nhiên do seed?", "content": "## 9.1. Bản trả lời nhanh\n\n> **Chạy nhiều seed với cùng protocol, báo cáo mean ± standard deviation và confidence interval. Nếu chênh lệch giữa model nhỏ hơn độ biến thiên run-to-run, không nên gọi là cải thiện ổn định.**\n>\n> **Chênh 0,09 điểm phần trăm M3–M1 trên 2016 đặc biệt cần kiểm tra.**\n\n## 9.2. Thiết kế\n\n- ít nhất 3 seed, tốt hơn 5;\n- cùng seed list cho mọi model;\n- paired comparison;\n- lưu checkpoint/config.\n\n### Paired difference\n\nVới cùng seed $s$:\n\n$$ \\Delta_s = M3_s-M1_s $$\n\nPhân tích mean/std của $\\Delta_s$ tốt hơn so hai tập run không ghép.\n\n### Bootstrap trên test samples\n\nNgoài seed variance, bootstrap estimate uncertainty do finite test set.\n\n### Hai nguồn uncertainty\n\n1. training randomness;\n2. sampling uncertainty của test.\n\nCần phân biệt.\n\n---"}, {"global_id": 114, "local_id": 10, "priority": "VÀNG", "title": "Cần báo cáo độ lệch chuẩn hoặc khoảng tin cậy trong trường hợp nào?", "content": "## 10.1. Bản trả lời nhanh\n\n> **Độ lệch chuẩn cần khi có nhiều lần train với seed khác nhau. Khoảng tin cậy bootstrap có thể báo cáo cho metric trên một test set ngay cả với một checkpoint, nhưng nó chỉ phản ánh uncertainty do sample, không phản ánh training variance.**\n>\n> **Khi so các model chênh lệch nhỏ, cả hai loại uncertainty đều quan trọng.**\n\n## 10.2. Báo cáo đề xuất\n\n```text\nExpRate = 49,20 ± 0,35 (3 seeds)\n95% bootstrap CI = [48,1; 50,3]\n```\n\nKhông nên nhầm:\n\n- std với CI;\n- CI sample với seed variability.\n\n### Khi một run duy nhất\n\nCó thể bootstrap paired prediction, nhưng phải ghi rõ:\n\n> **Single-checkpoint confidence interval; không bao gồm training randomness.**\n\n---"}, {"global_id": 115, "local_id": 11, "priority": "VÀNG", "title": "Nếu M4 giảm lỗi trung bình nhưng Exact Match không tăng, điều đó nói gì về phân bố lỗi?", "content": "## 11.1. Bản trả lời nhanh\n\n> **Nó gợi ý mass của phân bố lỗi dịch từ khoảng cách lớn về khoảng cách nhỏ, nhưng số mẫu ở distance 0 không tăng. Có thể nhiều mẫu từ 3–5 lỗi xuống 1–2 lỗi.**\n>\n> **Muốn xác nhận phải xem histogram hoặc CDF edit distance, không chỉ mean.**\n\n## 11.2. Các kịch bản\n\n### Kịch bản A\n\n- exact giảm nhẹ;\n- distance 1 tăng nhiều;\n- tail >5 giảm.\n\nĐây là near-correct trade-off.\n\n### Kịch bản B\n\n- vài outlier cực lớn được sửa;\n- phần lớn mẫu không đổi.\n\nMean giảm nhưng ảnh hưởng application có thể khác.\n\n### Kịch bản C\n\n- sequence ngắn tốt hơn;\n- sequence dài tệ hơn;\n- mean tổng che subgroup.\n\n### Phép kiểm tra\n\n- count distance 0/1/2/3–5/>5;\n- median/P90;\n- paired per-sample delta:\n\n$$ \\Delta d_i=d_{M4,i}-d_{M1,i} $$\n\n---"}, {"global_id": 116, "local_id": 12, "priority": "VÀNG", "title": "Có thể dùng histogram edit distance để giải thích kết quả như thế nào?", "content": "## 12.1. Bản trả lời nhanh\n\n> **Histogram cho biết metric trung bình được tạo bởi nhóm gần đúng hay outlier. Ta có thể thấy model nào có nhiều exact, nhiều distance 1–2, hoặc tail lỗi lớn. CDF còn cho thấy trực tiếp tỷ lệ ≤k.**\n\n## 12.2. Biểu đồ nên làm\n\n### Histogram\n\nBins:\n\n- 0;\n- 1;\n- 2;\n- 3;\n- 4–5;\n- 6–10;\n- >10.\n\n### CDF\n\n$$ F(k)=P(d\\le k) $$\n\n- $F(0)$ là ExpRate;\n- $F(1)$ là ≤1;\n- $F(2)$ là ≤2.\n\n### Paired delta plot\n\n- $\\Delta d \\lt 0$: M4 tốt hơn M1;\n- $\\Delta d=0$: bằng nhau;\n- $\\Delta d \\gt 0$: M4 tệ hơn.\n\n### Stratify\n\n- theo dataset;\n- độ dài;\n- cấu trúc;\n- scale ảnh.\n\n---"}, {"global_id": 117, "local_id": 13, "priority": "BẪY", "title": "Có được nói test set 2019 khó hơn chỉ vì ExpRate thấp hơn không?", "content": "## 13.1. Bản trả lời nhanh\n\n> **Không. Chỉ được nói các model hiện tại đạt ExpRate thấp hơn trên 2019. Độ khó là thuộc tính tương tác giữa dataset và model; cần nhiều model, matched analysis và thống kê phân bố trước khi xếp hạng.**\n\n## 13.2. Bằng chứng mạnh hơn cần có\n\n- đa số model cùng giảm;\n- độ dài/cấu trúc phức tạp hơn;\n- rare token cao;\n- image quality khác;\n- CI không chồng đáng kể;\n- matched subsets vẫn thấp.\n\n### Cách nói đúng\n\n> **CROHME 2019 là tập mà các cấu hình hiện tại cho kết quả thấp hơn, đặc biệt M5. Nguyên nhân chưa được xác định.**\n\n---"}, {"global_id": 118, "local_id": 14, "priority": "BẪY", "title": "Có được quy toàn bộ suy giảm của M5 cho over-smoothing khi chưa có phép đo node similarity không?", "content": "## 14.1. Bản trả lời nhanh\n\n> **Không. Over-smoothing chỉ là một giả thuyết. M5 đồng thời tăng layer và head; suy giảm còn có thể do optimization, overfitting, dropout, head dimension, scheduler hoặc seed.**\n>\n> **Muốn chứng minh over-smoothing cần đo mức giống nhau của node embedding theo layer và liên hệ với performance.**\n\n## 14.2. Phép đo\n\nMean pairwise cosine:\n\n$$ S^{(l)} = \\frac{1}{N(N-1)} \\sum_{i\\ne j} \\cos(h_i^{(l)},h_j^{(l)}) $$\n\nNếu $S^{(l)}$ tăng mạnh và spatial discriminability giảm, có bằng chứng hỗ trợ.\n\nCó thể dùng:\n\n- rank/effective rank;\n- feature variance;\n- coordinate linear probe;\n- edge perturbation;\n- compare 2L no-dropout.\n\n### Câu kết luận đúng\n\n> **Kết quả M5 nhất quán với một số cơ chế như over-smoothing, nhưng chưa phân biệt được nguyên nhân.**\n\n---"}, {"global_id": 119, "local_id": 15, "priority": "BẪY", "title": "Có được nói GAT tốt hơn CNN/Transformer nếu M1 vẫn cao hơn trên nhiều tập không?", "content": "## 15.1. Bản trả lời nhanh\n\n> **Không. Dữ liệu hiện tại không hỗ trợ tuyên bố GAT tốt hơn về Exact Match. M1 cao nhất trung bình và trên hai test set. Chỉ có thể nói GAT thay đổi trade-off; M4 giảm MED và M3 cho thấy PE order quan trọng.**\n\n## 15.2. Tuyên bố hợp lệ\n\n- “M4 có MED thấp hơn M1.”\n- “M3 nhỉnh hơn M1 trên 2016.”\n- “GAT integration chưa tạo cải thiện Exact Match ổn định.”\n- “Design của GAT rất nhạy với PE/depth.”\n\n### Muốn nói GAT tốt hơn cần\n\n- cùng budget;\n- nhiều seed;\n- significance;\n- thắng metric mục tiêu;\n- không cherry-pick;\n- parameter/latency analysis.\n\n---"}, {"global_id": 120, "local_id": 16, "priority": "BẪY", "title": "Khi kết quả không ủng hộ giả thuyết ban đầu, nên trình bày thế nào để vẫn có giá trị khoa học?", "content": "## 16.1. Bản trả lời nhanh\n\n> **Trình bày giả thuyết ban đầu, thiết kế kiểm chứng, kết quả thực tế và giới hạn một cách trung thực. Negative result có giá trị nếu nó bác bỏ một giả định hợp lý và rút ra điều kiện thiết kế cụ thể.**\n>\n> **Không đổi metric sau khi thấy kết quả hoặc bịa nguyên nhân.**\n\n## 16.2. Mẫu trình bày\n\n> **Giả thuyết:** thêm GAT sẽ tăng Exact Match.  \n> **Quan sát:** M2 giảm; M3 phục hồi; M4 chỉ cải thiện MED; M5 giảm mạnh.  \n> **Kết luận:** GAT không tự động cải thiện và phụ thuộc PE/depth.  \n> **Giới hạn:** một seed, M4 confounded.  \n> **Thí nghiệm tiếp:** tách bias/layer/head, nhiều seed.\n\n### Vì sao vẫn có giá trị?\n\n- ngăn người khác lặp thiết kế thất bại;\n- làm rõ boundary conditions;\n- tạo insight;\n- tăng tính trung thực;\n- hướng thí nghiệm tiếp theo.\n\n### Không biến negative result thành chiến thắng giả\n\nKhông nói:\n\n> “M4 tốt nhất vì em chọn MED.”\n\nMà nói:\n\n> “Giả thuyết Exact Match chưa được xác nhận; phát hiện phụ là error severity giảm.”\n\n---"}], "extras": [{"title": "Phụ lục A — Bản trả lời tổng hợp khoảng hai phút", "content": "> **M1 có ExpRate cao nhất trên 2014, 2019 và trung bình; M3 chỉ cao nhất trên 2016 với chênh lệch 0,09 điểm. M4 có MED thấp nhất trên 2014, 2016 và trung bình, còn M3 thấp nhất trên 2019. Vì vậy không có một model tốt nhất trên mọi metric.**\n>\n> **Bảng cho phép khẳng định M2 thấp hơn baseline, M3 phục hồi so với M2, M4 giảm mức lỗi trung bình và M5 giảm mạnh. Nó chưa cho phép khẳng định PE blurring, over-smoothing hoặc relative bias là nguyên nhân duy nhất. Chênh lệch theo năm có thể do độ dài, cấu trúc, token hiếm và writer distribution, nhưng phải thống kê trước.**\n>\n> **Để phân tích thuyết phục, em sẽ chạy nhiều seed, bootstrap CI, histogram/CDF edit distance, paired per-sample analysis và error breakdown theo độ dài/cấu trúc. Khi giả thuyết không được ủng hộ, em báo cáo đó là negative result và rút ra điều kiện thiết kế, không đổi metric để tuyên bố thắng.**"}, {"title": "Phụ lục B — Biểu đồ nên chuẩn bị", "content": "- [ ] Bar chart ExpRate từng model × dataset.\n- [ ] Bar chart MED từng model × dataset.\n- [ ] Histogram/CDF edit distance.\n- [ ] Paired delta M4–M1.\n- [ ] ExpRate theo length bin.\n- [ ] Accuracy theo structure.\n- [ ] Token frequency versus error.\n- [ ] Mean ± std nhiều seed.\n- [ ] Bootstrap CI."}]}, {"group_id": 11, "title": "Phân tích lỗi, demo, nét viết quằn và tích phân có cận", "intro": "# NHÓM 11 — PHÂN TÍCH LỖI, DEMO, NÉT VIẾT QUẰN VÀ TÍCH PHÂN CÓ CẬN\n\n> **Mục tiêu nhóm:** Chuẩn bị cho các câu hỏi thực chiến về demo thất bại, chữ viết xấu, lỗi encoder/decoder và dữ liệu ngoài phân bố.\n\n---\n\n## 0. Nguyên tắc forensic khi demo sai\n\nKhông trả lời bằng một nguyên nhân duy nhất. Luôn đi theo chuỗi:\n\n```text\nGround truth/data coverage\n→ raw image\n→ preprocessing\n→ tensor model input\n→ DenseNet feature\n→ GAT feature\n→ decoder beam\n→ output token\n```\n\nMột lỗi cuối cùng có thể đến từ nhiều tầng. Câu trả lời có điểm là câu chỉ ra **cách phân biệt** các nguyên nhân.\n\n---", "questions": [{"global_id": 121, "local_id": 1, "priority": "ĐỎ", "title": "Vì sao ảnh trong test set nhận dạng tốt nhưng ảnh người dùng tự vẽ trên demo có thể nhận dạng kém?", "content": "## 1.1. Bản trả lời nhanh\n\n> **Test set và demo có thể khác phân bố. CROHME đã được render, crop và chuẩn hóa theo một protocol; ảnh demo có thể khác về nền, polarity, antialiasing, độ dày nét, margin, tỷ lệ, thiết bị và phong cách viết. Ngoài ra pipeline app có thể không giống dataloader.**\n>\n> **Do đó demo kém có thể là domain shift, preprocessing mismatch hoặc giới hạn model. Muốn tách phải đưa một ảnh CROHME qua đúng API demo và so tensor/output với đường dataloader.**\n\n## 1.2. Các dạng domain shift\n\n### Appearance shift\n\n- nét chuột versus bút cảm ứng;\n- anti-aliased versus binary;\n- nền trắng/nét đen versus nền đen/nét trắng;\n- độ dày;\n- blur;\n- compression;\n- shadow;\n- line noise.\n\n### Geometry shift\n\n- crop sát;\n- margin lớn;\n- nghiêng;\n- scale;\n- cận quá nhỏ;\n- nhiều dòng;\n- khoảng cách không giống train.\n\n### Content shift\n\n- token hiếm;\n- macro ngoài vocabulary;\n- cấu trúc hiếm;\n- biểu thức dài.\n\n### Integration mismatch\n\n- RGB thay vì 1 channel;\n- range 0–255 thay vì 0–1;\n- resize khác;\n- pad khác;\n- invert sai;\n- mask sai.\n\n## 1.3. Phép kiểm chứng parity\n\n1. Lấy ảnh từ `images.pkl`.\n2. Forward trực tiếp qua dataloader.\n3. Export PNG.\n4. Upload PNG qua app.\n5. Lưu tensor ngay trước model.\n6. So shape, min/max/mean và pixel difference.\n7. So output beam.\n\nNếu cùng ảnh nhưng app path kém:\n\n> lỗi ở preprocessing/integration.\n\nNếu app path vẫn đúng với CROHME nhưng ảnh tự vẽ sai:\n\n> domain gap hoặc content gap.\n\n## 1.4. Không nên nói\n\n- “Người dùng viết xấu.”\n- “Dataset tốt nên model không lỗi.”\n- “Demo chỉ khác giao diện.”\n- “Một ảnh sai là đủ kết luận domain shift.”\n\n---"}, {"global_id": 122, "local_id": 2, "priority": "ĐỎ", "title": "Tích phân thường nhận đúng nhưng tích phân có cận trên/dưới nhận sai có thể do những nguyên nhân nào?", "content": "## 2.1. Bản trả lời nhanh\n\n> **Có ít nhất năm nhóm nguyên nhân: cấu trúc hai cận hiếm trong train; cận nhỏ bị resize/downsample làm yếu; bố cục demo khác CROHME; decoder thiên về chuỗi phổ biến `\\int ... dx` và bỏ `_`/`^`; hoặc max length/beam ranking làm mất token.**\n>\n> **Phải xác định model mất dấu tích phân, token cận, nội dung cận hay ngoặc trước khi kết luận.**\n\n## 2.2. Phân rã bài toán\n\nGround truth:\n\n```latex\n\\int _ { 0 } ^ { 1 } f ( x ) d x\n```\n\nCác thành phần:\n\n1. token `\\int`;\n2. relation lower `_`;\n3. group lower `{ 0 }`;\n4. relation upper `^`;\n5. group upper `{ 1 }`;\n6. body;\n7. differential.\n\nMỗi phần có failure mode riêng.\n\n### Data imbalance\n\nCần đếm:\n\n- integral no bounds;\n- lower only;\n- upper only;\n- both bounds;\n- multiple integrals.\n\n### Visual resolution\n\nCận chiếm ít pixel, dễ mất qua:\n\n- threshold;\n- resize;\n- DenseNet downsampling;\n- padding/margin.\n\n### Structural ambiguity\n\n`^` có thể là exponent của body, không phải upper bound. Decoder phải gắn đúng token vào `\\int`.\n\n### Language-model bias\n\nNếu `\\int x dx` phổ biến hơn, decoder có thể ưu tiên chuỗi ngắn quen thuộc.\n\n### Search/length bias\n\nEOS sớm hoặc beam score có thể bỏ cận.\n\n## 2.3. Không nên nói\n\n- “Dataset không có.”\n- “Model nhận được `\\int` nên encoder tốt.”\n- “Chỉ cần thêm vài ảnh.”\n- “Lỗi chắc chắn ở GAT.”\n\n---"}, {"global_id": 123, "local_id": 3, "priority": "VÀNG", "title": "Làm sao xác định mô hình mất ký hiệu tích phân, mất dấu _/^ hay mất nội dung cận?", "content": "## 3.1. Bản trả lời nhanh\n\n> **So sánh ground truth và prediction bằng token-level alignment, rồi phân loại lỗi theo slot: integral token, lower marker, upper marker, lower content, upper content, braces và body. Không chỉ nhìn chuỗi bằng mắt.**\n>\n> **Sau đó kiểm tra top-k beam để biết candidate đúng có tồn tại nhưng bị xếp hạng thấp hay model hoàn toàn không sinh ra.**\n\n## 3.2. Taxonomy lỗi\n\n| Mã lỗi | Mô tả |\n|---|---|\n| INT_MISS | Thiếu `\\int` |\n| LOW_MARK | Thiếu/nhầm `_` |\n| UP_MARK | Thiếu/nhầm `^` |\n| LOW_CONTENT | Sai nội dung cận dưới |\n| UP_CONTENT | Sai nội dung cận trên |\n| BRACE | Sai `{`/`}` |\n| BODY | Sai hàm dưới dấu tích phân |\n| DIFF | Sai `d x` |\n| TRUNC | Dừng sớm/max length |\n| EXTRA | Sinh token thừa |\n\n### Alignment\n\nDùng Levenshtein traceback, không chỉ distance scalar.\n\n### Beam diagnosis\n\n- Ground truth hoặc canonical equivalent có trong beam nhưng không top-1 → ranking/calibration.\n- Không có trong beam → representation/probability/search space.\n- Beam nào cũng mất `^` → systematic bias.\n\n### Token probability\n\nỞ bước cần sinh `_`/`^`, lưu:\n\n- top-10 token;\n- probability;\n- entropy;\n- cross-attention map.\n\n## 3.3. Không nên nói\n\n- “Edit distance 2 nghĩa là mất hai cận.”\n- “Mất `_` chắc chắn do decoder.”\n- “Top-1 sai nhưng beam có đúng thì model đã đúng” — output cuối vẫn sai.\n\n---"}, {"global_id": 124, "local_id": 4, "priority": "VÀNG", "title": "Làm sao kiểm tra cận trên và cận dưới còn nhìn rõ sau preprocessing?", "content": "## 4.1. Bản trả lời nhanh\n\n> **Lưu ảnh ở mọi bước, crop vùng quanh dấu tích phân và đo số foreground pixel, bounding box, contrast và kích thước sau resize. So với ảnh train cùng cấu trúc. Sau đó xem feature activation tại vùng tương ứng.**\n>\n> **Không chỉ zoom ảnh đã render trên màn hình, vì interpolation của trình xem có thể làm cận trông rõ hơn tensor thật.**\n\n## 4.2. Pipeline lưu ảnh\n\n```text\nraw\ncrop\ngrayscale\nthreshold\ninvert\nresize\npad\ntensor\nDenseNet stage 1/2/3 feature\n```\n\n### Chỉ số ảnh\n\n- foreground pixel count;\n- local contrast;\n- cận height/width;\n- khoảng cách với integral;\n- scale factor;\n- signal-to-background ratio.\n\n### Controlled test\n\nTạo nhiều phiên bản cùng biểu thức:\n\n- cận 100%, 75%, 50%, 25% size;\n- nét dày/mảnh;\n- margin khác;\n- threshold khác.\n\nVẽ curve:\n\n$$ \\text{Recall}_{^/_} \\text{ theo kích thước cận} $$\n\n### Feature-level test\n\n- activation norm vùng cận;\n- saliency;\n- occlusion: che cận và xem probability thay đổi;\n- compare with no-bound expression.\n\n## 4.3. Không nên nói\n\n- “Mắt nhìn thấy nên model phải thấy.”\n- “Resize giữ tỷ lệ nên cận không mất.”\n- “Feature map vẫn có cận” nếu chưa visualize.\n\n---"}, {"global_id": 125, "local_id": 5, "priority": "VÀNG", "title": "Nét viết quá cong, nghiêng, dày, mảnh hoặc đứt đoạn ảnh hưởng đến feature extractor thế nào?", "content": "## 5.1. Bản trả lời nhanh\n\n> **DenseNet học pattern từ phân bố train. Nét quá khác có thể làm edge/curve response thay đổi, khiến ký hiệu giống class khác hoặc mất stroke. Nét dày làm ký hiệu dính; nét mảnh/đứt có thể biến mất sau resize; nghiêng làm relative geometry thay đổi.**\n>\n> **Mức robustness phải được đo bằng controlled perturbation, không chỉ nói model “nhạy với chữ xấu”.**\n\n## 5.2. Tác động theo loại\n\n### Quá dày\n\n- lấp khoảng trống;\n- dính `=` thành block;\n- dính cận vào `\\int`;\n- fraction bar nhập với chữ.\n\n### Quá mảnh\n\n- interpolation làm nhạt;\n- threshold xóa;\n- downsampling mất nét.\n\n### Đứt đoạn\n\n- một glyph thành nhiều component;\n- `=` thành hai dash rời bất thường;\n- căn thiếu hook.\n\n### Nghiêng/cong\n\n- thay stroke orientation;\n- baseline lệch;\n- superscript/subscript khó phân biệt.\n\n### Augmentation phù hợp\n\n- stroke dilation/erosion nhỏ;\n- affine nhẹ;\n- elastic nhẹ;\n- broken-stroke simulation;\n- antialias variants.\n\nCần giữ nhãn.\n\n## 5.3. Phép đo robustness\n\nVới perturbation strength $\\epsilon$:\n\n$$ R(\\epsilon) = \\operatorname{ExpRate}(T_\\epsilon(X)) $$\n\nBáo cáo degradation curve, không chỉ vài screenshot.\n\n---"}, {"global_id": 126, "local_id": 6, "priority": "VÀNG", "title": "Hai ký hiệu viết dính hoặc chồng lên nhau có thể gây lỗi ở đâu trong pipeline?", "content": "## 6.1. Bản trả lời nhanh\n\n> **Lỗi có thể xuất hiện từ ảnh: hai glyph thành một blob; DenseNet tạo feature trộn; grid node không có ranh giới symbol; GAT lan truyền feature đã trộn; decoder có thể bỏ một token hoặc sinh một token thay thế. Không có detector nên hệ thống không có bước tách ký hiệu tường minh để sửa.**\n\n## 6.2. Các tầng lỗi\n\n1. **Preprocessing:** morphology nối thêm nét.\n2. **CNN:** receptive field không tách được pattern.\n3. **Graph:** local mixing tăng sự nhập nhằng.\n4. **Decoder:** language prior chọn chuỗi phổ biến.\n5. **Evaluation:** insertion/deletion/substitution.\n\n### Phân biệt encoder và decoder\n\n- Nếu occlusion/tách ảnh làm prediction đúng → visual issue.\n- Nếu top-k feature classifier/probe phân biệt được hai symbol nhưng decoder vẫn bỏ → decoder issue.\n- Nếu beam có candidate đủ hai token → ranking issue.\n\n### Hướng xử lý\n\n- data augmentation ký hiệu dính;\n- higher-resolution branch;\n- auxiliary symbol count;\n- stroke-aware input;\n- detector/segmentation;\n- coverage mechanism;\n- CTC/monotonic auxiliary loss.\n\n## 6.3. Không nên nói\n\n- “GAT tự tách ký hiệu.”\n- “Dính nét chỉ là lỗi người viết.”\n- “Không có detector nên không thể nhận được” — end-to-end vẫn có thể học, chỉ không tách tường minh.\n\n---"}, {"global_id": 127, "local_id": 7, "priority": "BẪY", "title": "Có được trả lời 'dataset không có tích phân có cận' khi chưa thống kê hay không?", "content": "## 7.1. Bản trả lời nhanh\n\n> **Không. Phải nói “em chưa có thống kê xác nhận”. Sau đó đếm số mẫu `\\int` không cận, một cận và hai cận trong train/test bằng parser token đúng ngữ cảnh.**\n>\n> **Ngay cả khi ít, phải nói số cụ thể và tỷ lệ, không nói tuyệt đối “không có”.**\n\n## 7.2. Câu thay thế an toàn\n\n> **Khả năng đầu tiên là cấu trúc hai cận ít hoặc phân bố khác demo; em đang kiểm chứng bằng thống kê. Các khả năng khác là resize, domain shift và decoder bias.**\n\n### Vì sao câu “không có” nguy hiểm?\n\nHội đồng sẽ hỏi:\n\n- script đâu;\n- count bao nhiêu;\n- `\\int_^` xử lý thế nào;\n- test có không;\n- tại sao vocabulary có token.\n\nNếu không trả lời được sẽ mất uy tín.\n\n---"}, {"global_id": 128, "local_id": 8, "priority": "BẪY", "title": "Có được đổ lỗi cho người dùng viết xấu khi preprocessing hoặc giao diện vẽ chưa tương thích với train data không?", "content": "## 8.1. Bản trả lời nhanh\n\n> **Không. “Viết xấu” là mô tả chủ quan. Hệ thống phải xác định cụ thể nét khác train ở độ dày, nghiêng, scale, spacing hay polarity. Nếu app tạo ảnh khác pipeline train thì đó là lỗi tích hợp hoặc giới hạn robustness của hệ thống, không thể đổ hoàn toàn cho người dùng.**\n\n## 8.2. Cách nói đúng\n\n> **Mẫu demo nằm ngoài miền phân bố mà model đã được huấn luyện, đặc biệt ở thuộc tính X; hệ thống hiện chưa robust với thay đổi đó.**\n\n### Trách nhiệm hệ thống\n\n- hướng dẫn canvas;\n- preview normalized image;\n- cảnh báo crop;\n- thu thập feedback;\n- confidence/OOD;\n- fallback cho người dùng sửa.\n\n### User study nếu cần\n\n- nhiều người viết;\n- nhiều thiết bị;\n- standardized prompts;\n- success rate;\n- không chọn vài mẫu thuận lợi.\n\n## 8.3. Không nên nói\n\n- “Người dùng phải viết đẹp.”\n- “Ảnh sai do khách hàng.”\n- “Model đúng vì benchmark tốt.”\n- “Out-of-distribution không thuộc trách nhiệm hệ thống.”\n\n---"}, {"global_id": 129, "local_id": 9, "priority": "BẪY", "title": "Làm sao phân biệt lỗi thị giác của encoder với lỗi ngôn ngữ/cấu trúc của decoder?", "content": "## 9.1. Bản trả lời nhanh\n\n> **Không thể biết chỉ từ output cuối. Cần probe và intervention. Nếu feature vùng ký hiệu không phân biệt được class hoặc prediction không đổi khi che vùng đó, nghi encoder. Nếu feature/alignment có thông tin nhưng decoder chọn token phổ biến hoặc beam chứa đáp án đúng ở hạng thấp, nghi decoder/ranking.**\n\n## 9.2. Các thí nghiệm\n\n### Visual probe\n\n- crop feature vùng ký hiệu;\n- train linear classifier symbol/token;\n- nearest-neighbor retrieval;\n- compare feature same symbol/different style.\n\n### Decoder oracle\n\nCung cấp ground-truth prefix và xem token tiếp theo:\n\n- nếu vẫn sai → visual memory/decoder local issue;\n- nếu đúng với GT prefix nhưng free-run sai → exposure bias.\n\n### Beam oracle\n\nGround truth có trong top-k?\n\n### Attention/occlusion\n\nChe vùng cận:\n\n- probability `_`/`^` có giảm không.\n\n### Synthetic clean input\n\nCùng LaTeX render font sạch:\n\n- nếu nhận đúng clean nhưng sai handwriting → visual/domain.\n- nếu vẫn sai → decoder/label structure.\n\n### Auxiliary symbol count\n\nNếu count head thấy đủ ký hiệu nhưng sequence thiếu, decoder có thể bỏ token.\n\n## 9.3. Không nên nói\n\n- “Sai ký hiệu là encoder, sai ngoặc là decoder” như quy luật tuyệt đối.\n- “Attention nhìn đúng vùng nên encoder đúng.”\n- “Beam có đáp án đúng nghĩa là decoder không lỗi.”\n\n---"}, {"global_id": 130, "local_id": 10, "priority": "BẪY", "title": "Nếu ground truth có cấu trúc đúng nhưng output thiếu ngoặc, đó là lỗi cú pháp hay lỗi nhận dạng cấu trúc?", "content": "## 10.1. Bản trả lời nhanh\n\n> **Có thể là cả hai cách phân loại ở hai tầng. Thiếu ngoặc làm chuỗi LaTeX có thể không hợp lệ nên là syntax error; đồng thời nó cho thấy model không đóng đúng phạm vi cấu trúc nên là structure-generation error.**\n>\n> **Trong error taxonomy nên gắn nhiều nhãn thay vì ép chỉ một nguyên nhân.**\n\n## 10.2. Ví dụ\n\nGT:\n\n```latex\n\\sqrt { x + 1 }\n```\n\nPred:\n\n```latex\n\\sqrt { x + 1\n```\n\n- token deletion: `}`;\n- syntax invalid;\n- root scope chưa đóng;\n- exact match sai.\n\n### Multi-label error taxonomy\n\n```json\n{\n  \"token_error\": \"deletion\",\n  \"syntax_error\": true,\n  \"structure_error\": \"unclosed_root\",\n  \"visual_symbol_error\": false\n}\n```\n\n### Cần parser\n\nChỉ nhìn braces chưa đủ để phân loại macro scope đầy đủ.\n\n## 10.3. Không nên nói\n\n- “Chỉ là lỗi ngoặc nhỏ.”\n- “Syntax error không liên quan structure.”\n- “Mọi thiếu ngoặc do decoder.”\n\n---"}, {"global_id": 131, "local_id": 11, "priority": "BẪY", "title": "Cần xây dựng bộ test chuyên biệt nào để đánh giá tích phân có cận một cách thuyết phục?", "content": "## 11.1. Bản trả lời nhanh\n\n> **Bộ test phải chia theo không cận, cận dưới, cận trên, cả hai cận; thay đổi kích thước cận, độ dài body, kiểu nét, spacing và domain. Phải có cả mẫu in-domain lấy từ CROHME và mẫu controlled/synthetic ngoài domain, kèm ground truth token chuẩn.**\n>\n> **Metric không chỉ ExpRate tổng mà còn recall `\\int`, `_`, `^`, accuracy nội dung cận, syntax validity và MED.**\n\n## 11.2. Ma trận test\n\n### Theo cấu trúc\n\n- `\\int f(x)dx`;\n- `\\int_{a} f(x)dx`;\n- `\\int^{b} f(x)dx`;\n- `\\int_{a}^{b} f(x)dx`;\n- multiple integrals;\n- nested expression in bounds.\n\n### Theo hình ảnh\n\n- cận lớn/vừa/nhỏ;\n- thick/thin;\n- straight/slanted integral;\n- close/far spacing;\n- short/long body;\n- mouse/stylus/camera.\n\n### Theo content\n\n- digit bounds;\n- variable bounds;\n- expressions in bounds;\n- infinity;\n- negative bound;\n- fraction bound.\n\n### Số lượng\n\nTối thiểu nên đủ mỗi cell để báo cáo CI; nếu ít, gọi exploratory set, không benchmark kết luận mạnh.\n\n## 11.3. Metric subset\n\n- integral symbol recall;\n- lower-marker recall;\n- upper-marker recall;\n- both-bound exact;\n- bound-content exact;\n- full-expression exact;\n- MED;\n- syntax error;\n- latency.\n\n### Paired perturbation\n\nCùng công thức, chỉ thay kích thước cận. Đây là bằng chứng causal mạnh hơn ảnh ngẫu nhiên.\n\n---"}, {"global_id": 132, "local_id": 12, "priority": "BẪY", "title": "Nếu thêm dữ liệu tích phân có cận mà kết quả chung giảm, em sẽ phân tích hiện tượng này thế nào?", "content": "## 12.1. Bản trả lời nhanh\n\n> **Không kết luận dữ liệu thêm là xấu ngay. Cần kiểm tra chất lượng nhãn, tỷ lệ trộn, domain mismatch, class imbalance ngược, catastrophic interference và training schedule. Dữ liệu mới có thể cải thiện subset tích phân nhưng làm distribution tổng thay đổi hoặc gây overfit synthetic style.**\n>\n> **Phải báo cáo metric chung và metric subset trước/sau, cùng nhiều seed.**\n\n## 12.2. Các nguyên nhân\n\n### Label noise\n\n- braces sai;\n- bound association sai;\n- render/caption lệch.\n\n### Domain mismatch\n\nSynthetic quá sạch hoặc font-style khác handwriting.\n\n### Sampling imbalance\n\nOversample tích phân làm model giảm exposure với cấu trúc phổ biến.\n\n### Optimization\n\nDataset lớn hơn nhưng giữ nguyên số epoch:\n\n- số update per sample thay đổi;\n- scheduler không phù hợp;\n- model chưa hội tụ.\n\n### Catastrophic interference\n\nFeature/language prior dịch quá mạnh sang pattern tích phân.\n\n### Vocabulary/sequence length\n\nBound expression làm sequence dài hơn, tăng loss distribution.\n\n## 12.3. Phân tích cần làm\n\n| Metric | Trước | Sau |\n|---|---:|---:|\n| Overall ExpRate | | |\n| Integral both-bound ExpRate | | |\n| Non-integral ExpRate | | |\n| MED | | |\n| Token `_` recall | | |\n| Token `^` recall | | |\n\nThử ratio:\n\n- 5%;\n- 10%;\n- 20%;\n- balanced batch.\n\nKiểm tra real-only versus synthetic-only subset.\n\n## 12.4. Không nên nói\n\n- “Thêm dữ liệu luôn phải tăng.”\n- “Kết quả giảm nên xóa dữ liệu.”\n- “Do overfitting” khi chưa xem curves.\n- “Subset tăng là đủ” nếu overall application giảm.\n\n---"}], "extras": [{"title": "Phụ lục A — Bộ hồ sơ forensic cho mỗi demo lỗi", "content": "Mỗi lỗi nên lưu một thư mục:\n\n```text\ncase_001/\n├── raw.png\n├── cropped.png\n├── normalized.png\n├── tensor_stats.json\n├── gt.txt\n├── prediction.txt\n├── beams.json\n├── token_alignment.json\n├── attention/\n└── diagnosis.md\n```\n\nNội dung `diagnosis.md`:\n\n- hiện tượng;\n- tầng đầu tiên xuất hiện lỗi;\n- bằng chứng;\n- giả thuyết;\n- thí nghiệm kiểm tra;\n- kết luận tạm thời."}, {"title": "Phụ lục B — Bản trả lời tổng hợp khoảng hai phút", "content": "> **Demo có thể kém test vì domain shift hoặc preprocessing mismatch. Với tích phân có cận, em tách lỗi thành nhận `\\int`, marker `_`/`^`, nội dung cận, braces, body và truncate. Em không nói dataset không có nếu chưa đếm.**\n>\n> **Quy trình chẩn đoán là lưu ảnh ở mọi bước, kiểm tra cận còn pixel hay không, so đường app với dataloader, chạy subset CROHME cùng cấu trúc, xem token alignment và top-k beam. Nếu ảnh sau preprocessing đã mất cận thì lỗi trực tiếp ở preprocessing; nếu cận còn rõ nhưng feature không phản ứng thì nghi encoder; nếu beam có đáp án đúng nhưng top-1 sai thì nghi ranking/decoder.**\n>\n> **Nét quằn, dày, mảnh hoặc dính phải được chuyển thành thuộc tính đo được và kiểm tra bằng controlled perturbation. Bộ test tích phân phải phân tầng cấu trúc, kích thước cận và domain. Nếu thêm dữ liệu mà overall giảm, em phân tích label quality, sampling ratio, domain mismatch và interference thay vì kết luận đơn giản.**"}]}, {"group_id": 12, "title": "Hạn chế, tính tái lập, ứng dụng và hướng phát triển", "intro": "# NHÓM 12 — HẠN CHẾ, TÍNH TÁI LẬP, ỨNG DỤNG VÀ HƯỚNG PHÁT TRIỂN\n\n> **Mục tiêu nhóm:** Thể hiện sự trung thực khoa học, khả năng tái lập và kế hoạch phát triển có căn cứ.\n\n---", "questions": [{"global_id": 133, "local_id": 1, "priority": "ĐỎ", "title": "Ba hạn chế kỹ thuật quan trọng nhất của mô hình hiện tại là gì?", "content": "## 1.1. Bản trả lời nhanh\n\n> **Thứ nhất, graph hiện là feature-grid graph cục bộ, không phải symbol graph có quan hệ toán học tường minh; vì vậy GAT chỉ học tương quan không gian ẩn. Thứ hai, GAT implementation dùng attention dense $N\\times N$ dù topology chỉ 8-neighbor, nên chi phí bộ nhớ tăng bậc hai theo số node. Thứ ba, protocol dữ liệu và đánh giá còn hạn chế: CROHME 2014 đang được dùng chọn checkpoint, mới có ít seed và chưa có error analysis đầy đủ theo cấu trúc/domain.**\n>\n> **Ngoài ra demo còn domain gap với dữ liệu CROHME và M4 chưa vượt baseline về Exact Match trung bình.**\n\n## 1.2. Hạn chế 1 — Biểu diễn graph chưa tường minh semantics\n\nNode là feature cell, edge là neighbor direction.\n\nKhông có:\n\n- symbol instance;\n- bounding box;\n- edge superscript/subscript;\n- relation supervision;\n- graph output để kiểm tra.\n\nHệ quả:\n\n- khó giải thích;\n- khó chứng minh “hiểu cấu trúc”;\n- long-range relation phụ thuộc CNN/decoder;\n- một symbol trải nhiều node.\n\n### Cách nói\n\n> **Mô hình đưa spatial inductive bias cục bộ chứ chưa xây Symbol Layout Graph.**\n\n## 1.3. Hạn chế 2 — Hiệu quả tính toán\n\nVới:\n\n$$ N=H_fW_f $$\n\ncode tạo score:\n\n$$ [B,K,N,N] $$\n\nnên:\n\n$$ O(KN^2) $$\n\ntrong khi edge logic chỉ:\n\n$$ E\\approx9N $$\n\nHệ quả:\n\n- tăng resolution rất tốn VRAM;\n- batch nhỏ;\n- latency cao;\n- khó scale biểu thức dài.\n\n### Hướng sửa\n\n- sparse edge index;\n- gather 9-neighbor;\n- scatter softmax;\n- hierarchical graph;\n- local window kernel.\n\n## 1.4. Hạn chế 3 — Protocol và bằng chứng thực nghiệm\n\n- validation/test chưa tách sạch;\n- một seed;\n- M4 thay nhiều biến;\n- chưa significance test;\n- chưa thống kê dataset;\n- chưa benchmark latency;\n- chưa external-domain test;\n- normalization chưa được đặc tả rõ.\n\nHạn chế này quan trọng ngang kiến trúc vì nó ảnh hưởng độ tin cậy kết luận.\n\n## 1.5. Những hạn chế phụ\n\n- output vocabulary cố định 113;\n- không có UNK;\n- max decode length 150;\n- ảnh nhỏ có thể mất qua downsampling;\n- demo preprocessing chưa chắc parity;\n- no grammar-constrained decoding;\n- không có confidence/OOD;\n- M1 vẫn cao hơn M4 về Avg ExpRate.\n\n## 1.6. Không nên nói\n\n- “Hạn chế chính chỉ là GPU.”\n- “Mô hình không có hạn chế về dữ liệu.”\n- “M4 tốt hơn nhưng chưa train đủ.”\n- “Graph hiện đã biểu diễn đầy đủ cấu trúc toán.”\n\n---"}, {"global_id": 134, "local_id": 2, "priority": "VÀNG", "title": "Người khác cần những file, seed, checkpoint và lệnh nào để tái lập kết quả?", "content": "## 2.1. Bản trả lời nhanh\n\n> **Một run tái lập cần commit hash, environment lock, checksum dữ liệu, config sau mọi override, seed, lệnh train, checkpoint hash, lệnh evaluate, vocabulary và output prediction. Chỉ chia sẻ file `.ckpt` hoặc README là chưa đủ.**\n>\n> **Mỗi M1–M5 nên có manifest riêng và một lệnh chạy end-to-end.**\n\n## 2.2. Bộ artifact tối thiểu\n\n```text\nrepro/\n├── README_REPRO.md\n├── environment.yml\n├── requirements-lock.txt\n├── data_manifest.json\n├── vocabulary.txt\n├── configs/\n│   ├── m1.yaml\n│   ├── m2.yaml\n│   ├── m3.yaml\n│   ├── m4.yaml\n│   └── m5.yaml\n├── checkpoints/\n│   └── SHA256SUMS\n├── scripts/\n│   ├── train.sh\n│   ├── eval_2014.sh\n│   ├── eval_2016.sh\n│   └── eval_2019.sh\n├── outputs/\n│   ├── predictions.json\n│   └── metrics.json\n└── run_manifest.json\n```\n\n## 2.3. Run manifest cần có\n\n```json\n{\n  \"git_commit\": \"...\",\n  \"data_sha256\": \"...\",\n  \"seed\": 7,\n  \"gpu\": \"NVIDIA T4\",\n  \"cuda\": \"...\",\n  \"pytorch\": \"...\",\n  \"lightning\": \"...\",\n  \"config\": \"configs/m4.yaml\",\n  \"train_command\": \"...\",\n  \"best_epoch\": 0,\n  \"checkpoint_sha256\": \"...\",\n  \"beam_size\": 10,\n  \"max_len\": 150\n}\n```\n\n## 2.4. Seed và determinism\n\nCần ghi:\n\n- Python seed;\n- NumPy;\n- torch CPU/GPU;\n- dataloader workers;\n- deterministic algorithms;\n- cuDNN flags.\n\nNên có nhiều seed và danh sách cố định:\n\n```text\n7, 17, 27\n```\n\n## 2.5. Dữ liệu\n\nDo dataset có thể không được phép phân phối lại, cung cấp:\n\n- nguồn tải;\n- script chuẩn bị;\n- checksum;\n- count;\n- audit statistics;\n- expected directory tree.\n\n## 2.6. Lệnh mẫu\n\n```bash\npython train.py --config configs/m4.yaml --seed 7\npython eval.py --config configs/m4.yaml \\\n  --checkpoint checkpoints/m4_seed7.ckpt \\\n  --test-folder 2014\n```\n\nLệnh thực tế phải khớp entry point repo.\n\n## 2.7. Không nên nói\n\n- “Clone repo là tái lập được.”\n- “Checkpoint đủ rồi.”\n- “Seed 7 đảm bảo giống 100%.”\n- “Dữ liệu CROHME nào cũng giống nhau.”\n\n---"}, {"global_id": 135, "local_id": 3, "priority": "VÀNG", "title": "Ứng dụng thực tế nào phù hợp với mức độ chính xác hiện tại và ứng dụng nào chưa phù hợp?", "content": "## 3.1. Bản trả lời nhanh\n\n> **Với khoảng một nửa biểu thức đúng hoàn toàn, hệ thống phù hợp hơn với trợ lý nhập công thức có preview và người dùng sửa, công cụ nghiên cứu hoặc tiền xử lý bán tự động. Nó chưa phù hợp cho chấm điểm tự động hoàn toàn, nhập dữ liệu y tế/kỹ thuật không hậu kiểm, hoặc số hóa hàng loạt yêu cầu độ chính xác gần tuyệt đối.**\n>\n> **M4 MED thấp có thể hữu ích cho human-in-the-loop, nhưng vẫn cần confidence và giao diện sửa.**\n\n## 3.2. Ứng dụng phù hợp\n\n### Human-in-the-loop editor\n\n- dự đoán LaTeX;\n- render preview;\n- highlight token confidence thấp;\n- người dùng sửa;\n- lưu correction để cải thiện model.\n\n### Trợ lý giảng viên/nghiên cứu\n\n- nhập công thức nhanh;\n- số hóa bài tập đơn giản;\n- tạo draft.\n\n### Công cụ benchmark/nghiên cứu\n\n- thử graph architecture;\n- error analysis;\n- education demo có disclaimer.\n\n### Retrieval hỗ trợ\n\nDùng prediction làm candidate search, không làm ground truth cuối.\n\n## 3.3. Ứng dụng chưa phù hợp\n\n- chấm bài tự động hoàn toàn;\n- quyết định điểm số không review;\n- nhập công thức an toàn-critical;\n- xử lý nguyên trang phức tạp;\n- mọi ký hiệu/macro ngoài vocabulary;\n- camera in-the-wild không preprocessing;\n- real-time mobile nếu chưa benchmark.\n\n## 3.4. Tiêu chí triển khai\n\nKhông chỉ accuracy:\n\n- latency;\n- uptime;\n- confidence;\n- OOD detection;\n- correction UX;\n- privacy;\n- audit log;\n- failure fallback.\n\n### Cách định vị trung thực\n\n> **Prototype hỗ trợ người dùng, chưa phải hệ thống tự động đáng tin cậy hoàn toàn.**\n\n---"}, {"global_id": 136, "local_id": 4, "priority": "BẪY", "title": "Hướng phát triển nào giải quyết trực tiếp hạn chế hiện tại thay vì chỉ nói chung chung 'thêm dữ liệu, thêm GPU'?", "content": "## 4.1. Bản trả lời nhanh\n\n> **Mỗi hướng phải gắn một hạn chế và metric. Với graph dense, chuyển sang sparse 9-neighbor attention và đo VRAM/latency. Với lỗi vị trí, tách ablation relative bias và dùng multi-scale/high-resolution feature. Với syntax, thêm grammar-constrained decoding. Với domain gap, xây parity pipeline và targeted augmentation. Với protocol, tạo validation nội bộ và nhiều seed.**\n>\n> **Đó là kế hoạch có giả thuyết, không phải khẩu hiệu thêm dữ liệu/GPU.**\n\n## 4.2. Bảng hạn chế → giải pháp → phép đo\n\n| Hạn chế | Hướng trực tiếp | Metric |\n|---|---|---|\n| Dense $N^2$ GAT | Sparse neighbor gather | VRAM, latency, ExpRate |\n| Ký hiệu nhỏ mất | High-res branch/multi-scale | bound recall |\n| Graph thiếu semantics | Symbol/region proposal + relation edge | relation F1, ExpRate |\n| Syntax sai | Grammar-constrained beam | SER, ExpRate, latency |\n| Domain gap | Unified preprocessing + targeted augmentation | demo set ExpRate |\n| One seed | Multi-seed protocol | mean ± std |\n| 2014 dùng validation | Internal validation split | untouched test score |\n| M4 confounded | Factorial ablation | causal attribution |\n\n## 4.3. Hướng ưu tiên cao\n\n1. Sửa protocol.\n2. Audit dataset và integral subset.\n3. Ablation tách M4.\n4. Sparse GAT.\n5. Demo parity.\n6. Grammar constraints.\n7. External-domain evaluation.\n\n## 4.4. Không nên nói\n\n- “Thêm nhiều layer.”\n- “Train lâu hơn.”\n- “GPU mạnh hơn.”\n- “Thêm dữ liệu” mà không nói loại dữ liệu và failure mode.\n\n---"}, {"global_id": 137, "local_id": 5, "priority": "BẪY", "title": "Nếu chuyển từ grid graph sang symbol-level graph, cần bổ sung những module và nhãn nào?", "content": "## 5.1. Bản trả lời nhanh\n\n> **Cần một module tạo symbol instance — từ stroke grouping, segmentation hoặc detector — để có bounding box và symbol feature. Sau đó cần graph construction hoặc relation classifier cho các cạnh như right, superscript, subscript, above, below, inside. Dataset phải có node/edge annotation hoặc cách sinh pseudo-label đáng tin cậy.**\n>\n> **Đây là thay đổi lớn, không chỉ đổi adjacency.**\n\n## 5.2. Pipeline symbol-level\n\n```text\nImage/strokes\n→ symbol proposal/detection\n→ ROI feature\n→ symbol classification\n→ relation candidate generation\n→ relation classification\n→ symbol layout graph\n→ graph encoder\n→ tree/LaTeX decoder\n```\n\n## 5.3. Nhãn cần có\n\n### Node\n\n- symbol class;\n- bounding box;\n- stroke IDs;\n- confidence;\n- optional role.\n\n### Edge\n\n- right;\n- superscript;\n- subscript;\n- above;\n- below;\n- inside;\n- numerator;\n- denominator;\n- root content;\n- next relation;\n- no-relation.\n\nPhải thống nhất ontology với CROHME relation grammar.\n\n## 5.4. Module cần bổ sung\n\n- detector/segmenter;\n- NMS hoặc set prediction;\n- ROIAlign;\n- relation candidate pruning;\n- edge classifier;\n- graph batching;\n- graph-to-sequence/tree decoder;\n- loss node/box/edge;\n- matching giữa prediction và GT.\n\n## 5.5. Metric\n\n- box AP/F1;\n- symbol classification;\n- edge relation F1;\n- graph edit distance;\n- expression ExpRate;\n- end-to-end latency.\n\n## 5.6. Rủi ro\n\n- error propagation;\n- ký hiệu chạm/dính;\n- dấu phân số/căn khó box;\n- annotation tốn kém;\n- symbol graph không còn fully end-to-end nếu heuristic.\n\n## 5.7. Không nên nói\n\n- “Chỉ cần lấy mỗi grid node làm symbol.”\n- “CROHME caption đủ làm edge label.”\n- “Symbol graph chắc chắn tốt hơn.”\n- “Detector có thể dùng F1 chung chung” không nêu IoU/protocol.\n\n---"}, {"global_id": 138, "local_id": 6, "priority": "BẪY", "title": "Nếu sử dụng grammar-constrained decoding, metric nào có thể tăng và rủi ro nào có thể xuất hiện?", "content": "## 6.1. Bản trả lời nhanh\n\n> **Grammar constraints có thể giảm Syntax Error Rate, giảm ngoặc thiếu/thừa và có thể tăng ExpRate nếu nhiều lỗi hiện tại là chuỗi không hợp lệ. Nó không sửa được ký hiệu nhìn sai và có thể làm giảm accuracy nếu grammar không bao phủ annotation hoặc loại bỏ hypothesis đúng.**\n>\n> **Chi phí beam và độ phức tạp triển khai cũng tăng.**\n\n## 6.2. Các dạng constraint\n\n### Hard constraint\n\nMask token không hợp lệ:\n\n$$ p'(y_t)=0 $$\n\ncho transition vi phạm grammar.\n\n### Soft constraint\n\nCộng penalty hoặc rerank score:\n\n$$ S(Y) = \\log P_\\theta(Y\\mid X) - \\lambda C_{\\text{grammar}}(Y) $$\n\n### Incremental parser\n\nTheo dõi:\n\n- brace stack;\n- macro arity;\n- allowed token state;\n- EOS legality.\n\n## 6.3. Metric có thể cải thiện\n\n- Syntax Error Rate ↓;\n- bracket match ↑;\n- ExpRate có thể ↑;\n- MED có thể ↓;\n- valid render rate ↑.\n\n### Rủi ro\n\n- grammar mismatch;\n- canonical form hạn chế;\n- valid nhưng sai semantic;\n- search chậm;\n- hard constraint loại đúng;\n- error bị chuyển sang token hợp lệ nhưng sai.\n\n### Thí nghiệm\n\nSo:\n\n- unconstrained;\n- brace-only;\n- full grammar;\n- soft rerank.\n\nBáo cáo accuracy, syntax, latency và failure cases.\n\n## 6.4. Không nên nói\n\n- “Grammar đảm bảo recognition đúng.”\n- “Syntax hợp lệ nghĩa là biểu thức đúng.”\n- “Constraint luôn tăng ExpRate.”\n- “Parser không ảnh hưởng beam latency.”\n\n---"}, {"global_id": 139, "local_id": 7, "priority": "BẪY", "title": "Làm sao đánh giá thời gian suy luận, bộ nhớ và khả năng triển khai thời gian thực?", "content": "## 7.1. Bản trả lời nhanh\n\n> **Phải benchmark end-to-end và từng module trên phần cứng xác định, có warm-up và đồng bộ CUDA. Báo cáo median, P95 latency, throughput, peak VRAM theo kích thước ảnh và beam size. Không chỉ đo một ảnh thuận lợi.**\n>\n> **Khả năng real-time phải gắn SLA cụ thể, ví dụ dưới 200 ms/biểu thức trên GPU mục tiêu.**\n\n## 7.2. Protocol benchmark\n\n### Phần cứng và phần mềm\n\n- GPU/CPU;\n- CUDA;\n- PyTorch;\n- precision;\n- batch;\n- power mode.\n\n### Warm-up\n\nChạy 20–100 iterations trước đo.\n\n### Đồng bộ\n\n```python\ntorch.cuda.synchronize()\nstart = time.perf_counter()\n...\ntorch.cuda.synchronize()\n```\n\n### Kích thước test\n\n- ảnh ngắn;\n- median;\n- P95 width;\n- max allowed;\n- integral/matrix;\n- batch 1 và batch nhiều.\n\n### Các phần cần đo\n\n```text\ndecode/upload\npreprocess\nDenseNet\ngraph build\nGAT\ndecoder beam\npostprocess/render\ntotal\n```\n\n### Metric\n\n- mean/median/P95/P99;\n- samples/s;\n- peak allocated/reserved VRAM;\n- CPU RAM;\n- model size;\n- startup time.\n\n## 7.3. Real-time không chỉ latency model\n\nỨng dụng còn:\n\n- network;\n- queue;\n- image decode;\n- rendering;\n- concurrency;\n- cold start.\n\n### Stress test\n\n- concurrent users;\n- long expressions;\n- timeout;\n- OOM recovery.\n\n## 7.4. So sánh beam\n\nBeam 10 có thể tốn hơn greedy. Nên vẽ:\n\n$$ \\text{Accuracy versus latency} $$\n\ncho beam 1/5/10/20.\n\n## 7.5. Không nên nói\n\n- “Inference gần như tức thì.”\n- “Chạy được trên T4 nên real-time.”\n- “Đo một lần bằng `time.time()` là đủ.”\n- “Graph thưa nên nhanh” khi code dense.\n\n---"}, {"global_id": 140, "local_id": 8, "priority": "BẪY", "title": "Nếu có thêm ba tháng nghiên cứu, thí nghiệm nào nên ưu tiên để tăng sức thuyết phục của luận văn?", "content": "## 8.1. Bản trả lời nhanh\n\n> **Ưu tiên không phải xây thêm nhiều model. Tháng đầu sửa protocol và audit dữ liệu; tháng hai chạy ablation tách M4 cùng nhiều seed; tháng ba làm error analysis tích phân/demo và benchmark sparse/latency. Những việc này trực tiếp tăng độ tin cậy của đóng góp hiện tại.**\n\n## 8.2. Kế hoạch 12 tuần\n\n### Tuần 1–2 — Reproducibility và dữ liệu\n\n- validation nội bộ;\n- freeze test protocol;\n- dataset checksum;\n- length/token/structure audit;\n- integral-bound count;\n- OOV/overlap audit.\n\n### Tuần 3–4 — Baseline sạch\n\n- retrain M1;\n- verify M3/M4;\n- 3 seed;\n- save manifests;\n- confidence intervals.\n\n### Tuần 5–7 — Factorial ablation\n\n- 4 vs 8 neighbor;\n- bias off/on;\n- 1L vs 2L;\n- 4H vs 8H;\n- parameter count;\n- same training budget.\n\n### Tuần 8 — Mechanism probes\n\n- coordinate linear probe;\n- node similarity;\n- attention/occlusion;\n- oracle beam.\n\n### Tuần 9–10 — Error analysis\n\n- length;\n- structure;\n- rare tokens;\n- integral bounds;\n- demo parity;\n- controlled perturbation.\n\n### Tuần 11 — Efficiency\n\n- profile;\n- sparse 9-neighbor prototype;\n- beam latency trade-off.\n\n### Tuần 12 — Consolidation\n\n- final tables;\n- figures;\n- scripts;\n- README reproduction;\n- defense Q&A.\n\n## 8.3. Thứ tự ưu tiên theo giá trị khoa học\n\n1. Protocol sạch.\n2. Nhiều seed.\n3. Ablation tách biến.\n4. Dataset/error analysis.\n5. Mechanism probes.\n6. Efficiency.\n7. App polish.\n\nApp đẹp không bù được thí nghiệm thiếu kiểm soát.\n\n## 8.4. Deliverables cuối ba tháng\n\n- bảng mean ± std;\n- M1–M5 configs;\n- dataset audit;\n- integral benchmark;\n- sparse GAT profile;\n- normalization spec;\n- reproducibility package;\n- updated thesis narrative.\n\n## 8.5. Không nên nói\n\n- “Em sẽ train thêm 1.000 epoch.”\n- “Em sẽ thêm mọi dataset.”\n- “Em sẽ đổi toàn bộ sang model mới.”\n- “Em sẽ làm app trước rồi mới sửa evaluation.”\n\n---"}], "extras": [{"title": "Phụ lục A — Bản trả lời tổng hợp khoảng hai phút", "content": "> **Ba hạn chế lớn nhất là graph mới ở mức feature-grid, GAT dense có chi phí $N^2$, và protocol/bằng chứng thực nghiệm chưa đủ sạch do validation 2014, ít seed và M4 thay nhiều biến. Vì vậy hướng phát triển phải trực tiếp: sparse local attention cho chi phí, symbol/relation graph hoặc probe cho semantics, internal validation và multi-seed cho độ tin cậy, high-resolution/domain adaptation cho lỗi demo.**\n>\n> **Để tái lập, người khác cần commit, environment, checksum dữ liệu, config sau override, seed, lệnh train/eval, checkpoint hash và prediction files. Với độ chính xác hiện tại, hệ thống phù hợp trợ lý nhập công thức có người hậu kiểm hơn là chấm điểm tự động hoàn toàn.**\n>\n> **Grammar-constrained decoding có thể giảm syntax error nhưng không sửa visual recognition và có rủi ro grammar mismatch. Real-time phải được benchmark bằng median/P95 latency, throughput và peak VRAM trên phần cứng mục tiêu. Nếu có thêm ba tháng, em ưu tiên sửa protocol, chạy nhiều seed và ablation tách M4, rồi mới làm error analysis tích phân và tối ưu sparse GAT.**"}, {"title": "Phụ lục B — Checklist tái lập và triển khai", "content": "- [ ] Commit/tag từng model.\n- [ ] Lock dependencies.\n- [ ] Data checksum.\n- [ ] Config sau override.\n- [ ] Seed list.\n- [ ] Checkpoint SHA-256.\n- [ ] Prediction và metric JSON.\n- [ ] Internal validation protocol.\n- [ ] Multi-seed results.\n- [ ] Latency/VRAM benchmark.\n- [ ] Demo parity tests.\n- [ ] Failure fallback và confidence.\n- [ ] Application disclaimer."}]}];

        // Application State
        let currentGroupId = 1;
        let activePriorityFilter = 'ALL';
        let isStudyMode = false;
        let currentView = 'list'; // 'list' | 'flashcard' | 'extra'
        let searchQuery = '';
        
        // Flashcard State
        let currentFlashcardIndex = 0;
        let isCardFlipped = false;

        // LocalStorage progress structure: { global_id: 'unlearned' | 'learning' | 'learned' }
        let progress = JSON.parse(localStorage.getItem('hmer_qa_progress') || '{}');

        // Setup Markdown marked.js config
        marked.setOptions({
            renderer: new marked.Renderer(),
            highlight: null,
            pedantic: false,
            gfm: true,
            breaks: true,
            sanitize: false,
            smartypants: false,
            xhtml: false
        });

        // Save progress to LocalStorage
        function saveProgress(globalId, status) {
            progress[globalId] = status;
            localStorage.setItem('hmer_qa_progress', JSON.stringify(progress));
            updateOverallProgress();
            renderSidebar();
            
            // Update individual question border glow if needed
            const card = document.getElementById(`qa-card-${globalId}`);
            if (card) {
                card.querySelector('.qa-status-badge').className = `qa-status-badge status-${status}`;
            }
        }

        // Compute and update overall progress bars
        function updateOverallProgress() {
            let total = 140;
            let learned = 0;
            let learning = 0;
            
            for (let i = 1; i <= 140; i++) {
                const status = progress[i] || 'unlearned';
                if (status === 'learned') learned++;
                else if (status === 'learning') learning++;
            }
            
            const percent = total > 0 ? Math.round((learned / total) * 100) : 0;
            document.getElementById('overall-percent').textContent = `${percent}%`;
            document.getElementById('overall-bar').style.width = `${percent}%`;
            document.getElementById('overall-learned-count').textContent = `Đã thuộc: ${learned}/${total}`;
            document.getElementById('overall-learning-count').textContent = `Đang học: ${learning}`;
        }

        // Render sidebar group items
        function renderSidebar() {
            const listContainer = document.getElementById('group-nav-list');
            listContainer.innerHTML = '';
            
            data.forEach(group => {
                const navItem = document.createElement('button');
                navItem.className = `group-nav-item ${group.group_id === currentGroupId && searchQuery === '' ? 'active' : ''}`;
                navItem.onclick = () => {
                    // Reset search on clicking navigation items
                    searchQuery = '';
                    document.getElementById('search-input').value = '';
                    loadGroup(group.group_id);
                };
                
                // Calculate progress for this group
                const qIds = group.questions.map(q => q.global_id);
                const totalInGroup = qIds.length;
                let learnedInGroup = 0;
                qIds.forEach(id => {
                    if (progress[id] === 'learned') learnedInGroup++;
                });
                
                const percentInGroup = totalInGroup > 0 ? Math.round((learnedInGroup / totalInGroup) * 100) : 0;
                
                navItem.innerHTML = `
                    <div class="group-item-title">Nhóm ${group.group_id}: ${group.title}</div>
                    <div class="group-item-progress">
                        <div class="group-item-bar">
                            <div class="group-item-fill" style="width: ${percentInGroup}%"></div>
                        </div>
                        <span class="group-item-text">${learnedInGroup}/${totalInGroup} (${percentInGroup}%)</span>
                    </div>
                `;
                listContainer.appendChild(navItem);
            });
        }

        // Load a specific group
        function loadGroup(groupId) {
            currentGroupId = groupId;
            currentFlashcardIndex = 0;
            isCardFlipped = false;
            
            const group = data.find(g => g.group_id === groupId);
            document.getElementById('active-group-subtitle').textContent = `Nhóm ${groupId}`;
            document.getElementById('active-group-title').textContent = group.title;
            
            // Highlight active sidebar item
            renderSidebar();
            
            // Switch back to active view
            switchView(currentView);
        }

        // Switch active view
        function switchView(view) {
            currentView = view;
            
            // Update active states on tab buttons
            document.getElementById('view-tab-list').className = `view-tab ${view === 'list' ? 'active' : ''}`;
            document.getElementById('view-tab-flashcard').className = `view-tab ${view === 'flashcard' ? 'active' : ''}`;
            document.getElementById('view-tab-extra').className = `view-tab ${view === 'extra' ? 'active' : ''}`;
            
            // Reset flashcard state when switching to flashcard view
            if (view === 'flashcard') {
                currentFlashcardIndex = 0;
                isCardFlipped = false;
            }
            
            renderActiveView();
        }

        // Toggle Study Mode (hide/show answers)
        function toggleStudyMode() {
            isStudyMode = !isStudyMode;
            const btn = document.getElementById('btn-toggle-study');
            btn.className = `btn-toggle-study ${isStudyMode ? 'active' : ''}`;
            btn.innerHTML = isStudyMode ? '✓ Đang bật ẩn giải' : 'Chế độ tự học';
            
            if (currentView === 'list') {
                renderActiveView();
            }
        }

        // Apply Priority Filter (Đỏ, Vàng, Bẫy)
        function applyPriorityFilter(priority) {
            activePriorityFilter = priority;
            
            const chips = document.getElementById('filter-chips').children;
            chips[0].className = `chip ${priority === 'ALL' ? 'active' : ''}`;
            chips[1].className = `chip chip-red ${priority === 'ĐỎ' ? 'active' : ''}`;
            chips[2].className = `chip chip-yellow ${priority === 'VÀNG' ? 'active' : ''}`;
            chips[3].className = `chip chip-orange ${priority === 'BẪY' ? 'active' : ''}`;
            
            if (currentView === 'flashcard') {
                currentFlashcardIndex = 0;
                isCardFlipped = false;
            }
            
            renderActiveView();
        }

        // Main Render Logic
        function renderActiveView() {
            const readingArea = document.getElementById('reading-area');
            readingArea.innerHTML = '';
            
            // Get questions list
            let questions = [];
            if (searchQuery.length > 0) {
                // Fuzzy search across all groups
                data.forEach(group => {
                    group.questions.forEach(q => {
                        if (q.title.toLowerCase().includes(searchQuery) || q.content.toLowerCase().includes(searchQuery)) {
                            questions.push(q);
                        }
                    });
                });
            } else {
                const group = data.find(g => g.group_id === currentGroupId);
                questions = group.questions;
            }
            
            // Filter by priority
            if (activePriorityFilter !== 'ALL') {
                questions = questions.filter(q => q.priority === activePriorityFilter);
            }
            
            // Handle different View States
            if (currentView === 'list') {
                renderListView(questions, readingArea);
            } else if (currentView === 'flashcard') {
                renderFlashcardView(questions, readingArea);
            } else if (currentView === 'extra') {
                renderExtraView(readingArea);
            }
            
            // Re-render LaTeX math blocks
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([readingArea]).catch(err => console.log('MathJax error:', err));
            }
        }

        // Highlight search keywords in html
        function highlightText(text, keyword) {
            if (!keyword) return text;
            const regex = new RegExp(`(${keyword.replace(/[-\/\^$*+?.()|[\]{}]/g, '\$&')})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        // Render List View
        function renderListView(questions, container) {
            if (questions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Không tìm thấy câu hỏi nào</h3>
                        <p>Hãy thử thay đổi điều kiện lọc hoặc từ khóa tìm kiếm của bạn.</p>
                    </div>
                `;
                return;
            }
            
            questions.forEach(q => {
                const card = document.createElement('div');
                const status = progress[q.global_id] || 'unlearned';
                
                card.id = `qa-card-${q.global_id}`;
                card.className = `qa-card ${isStudyMode ? 'study-hidden' : ''}`;
                
                // Priority Badge Class
                let badgeClass = 'priority-yellow';
                if (q.priority === 'ĐỎ') badgeClass = 'priority-red';
                else if (q.priority === 'BẪY') badgeClass = 'priority-orange';
                
                const rawHtml = marked.parse(q.content);
                const highlightedHtml = highlightText(rawHtml, searchQuery);
                const highlightedTitle = highlightText(q.title, searchQuery);
